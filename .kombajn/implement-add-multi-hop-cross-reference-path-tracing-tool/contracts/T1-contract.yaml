schemaVersion: 1
feature: T1
title: trace_cross_reference_path multi-hop cross-reference path tracing tool
acceptanceTests:
  - id: AC-1
    source: design
    blocking: true
    description: >
      Given a source ref, target ref, and max_hops=N, when a chain of cross-references
      of length <= N connects them, the tool returns an ordered path of hops, each
      carrying connecting verse and that hop's vote count.
    verify:
      type: test
      command: "cd server && npx vitest run src/tools/cross-references.test.ts -t traversal"
  - id: AC-2
    source: design
    blocking: true
    description: >
      Given a source and target with no connecting chain within max_hops, the tool
      returns an explicit no-path result (found:false), never an error (isError falsy).
    verify:
      type: test
      command: "cd server && npx vitest run src/tools/cross-references.test.ts -t traversal"
  - id: AC-3
    source: design
    blocking: true
    description: >
      When a budget (max_hops / node / edge / range-explode) cuts the search short,
      the response carries truncated:true; genuine exhaustion returns truncated:false.
    verify:
      type: test
      command: "cd server && npx vitest run src/tools/cross-references.test.ts -t traversal"
  - id: AC-4
    source: design
    blocking: true
    description: >
      Every returned hop is rendered verbatim from the stored cross_references edge
      (votes present, correct from/to orientation even when traversed backward) — an
      attributed association, never an asserted theological claim.
    verify:
      type: test
      command: "cd server && npx vitest run src/tools/cross-references.test.ts -t traversal"
  - id: AC-5
    source: design
    blocking: true
    description: >
      Traversal expands only review_status='ok' edges with votes>=min_votes, and per-hop
      SQL is indexed (book+chapter equality + scalar verse IN), with no OR-chain and no
      composite row-value IN.
    verify:
      type: test
      command: "cd server && npx vitest run src/tools/cross-references.test.ts -t traversal"
  - id: AC-6
    source: design
    blocking: true
    description: >
      The trace_cross_reference_path tool is registered in the MCP server and the project
      typechecks and the full vitest suite passes.
    verify:
      type: test
      command: "cd server && npm run typecheck && npm run test"
