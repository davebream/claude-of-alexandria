schemaVersion: 1
feature: F1

acceptanceTests:
  - id: AC-1
    description: "Migration file 0013_add_confessional.sql exists with all three confessional tables"
    verify:
      mode: file-exists
      path: "server/migrations/0013_add_confessional.sql"
    blocking: true

  - id: AC-2
    description: "Migration DDL contains confessional_documents, confessional_sections, and confessional_proof_texts tables"
    verify:
      mode: shell
      command: "grep -q 'confessional_documents' server/migrations/0013_add_confessional.sql && grep -q 'confessional_sections' server/migrations/0013_add_confessional.sql && grep -q 'confessional_proof_texts' server/migrations/0013_add_confessional.sql"
    blocking: true

  - id: AC-3
    description: "ETL script seed-confessional.ts exists and exports parseProofTextRef"
    verify:
      mode: shell
      command: "grep -q 'export function parseProofTextRef' server/scripts/seed-confessional.ts"
    blocking: true

  - id: AC-4
    description: "Vitest test file for parser exists"
    verify:
      mode: file-exists
      path: "server/scripts/seed-confessional.test.ts"
    blocking: true

  - id: AC-5
    description: "Parser tests pass (all 7 test cases green)"
    verify:
      mode: shell
      command: "cd server && npm test -- scripts/seed-confessional.test.ts --reporter=verbose 2>&1 | grep -q 'passed'"
    blocking: true

  - id: AC-6
    description: "ETL script exports VERSE_COUNTS constant (static verse-count map present)"
    verify:
      mode: shell
      command: "grep -q 'export const VERSE_COUNTS' server/scripts/seed-confessional.ts"
    blocking: true

  - id: AC-7
    description: "ETL script imports lookupBook from src/db/books.js (no duplicate BOOK_MAP)"
    verify:
      mode: shell
      command: "grep -q \"from '../src/db/books.js'\" server/scripts/seed-confessional.ts"
    blocking: true

  - id: AC-8
    description: "seed-d1.sh contains Phase 8 confessional seeding step"
    verify:
      mode: shell
      command: "grep -q 'seed-confessional.ts' server/scripts/seed-d1.sh"
    blocking: true

  - id: AC-9
    description: "Migration file uses CREATE TABLE IF NOT EXISTS (idempotent)"
    verify:
      mode: shell
      command: "grep -c 'CREATE TABLE IF NOT EXISTS' server/migrations/0013_add_confessional.sql | grep -q '^3$'"
    blocking: false

  - id: AC-10
    description: "confessional_sections has both confession columns (chapter_number) and catechism columns (question_number) — unified superset design"
    verify:
      mode: shell
      command: "grep -q 'chapter_number' server/migrations/0013_add_confessional.sql && grep -q 'question_number' server/migrations/0013_add_confessional.sql"
    blocking: true

observableOutputs:
  - id: OO-1
    path: "server/migrations/0013_add_confessional.sql"
    shape: "text"
  - id: OO-2
    path: "server/scripts/seed-confessional.ts"
    shape: "text"
  - id: OO-3
    path: "server/scripts/seed-confessional.test.ts"
    shape: "text"

apiSignatures:
  - symbol: "parseProofTextRef"
    path: "server/scripts/seed-confessional.ts"
    signature: "(citation: string) => VerseRef[]"
    consumedBy: ["F1-ETL-C3", "F1-tests"]
  - symbol: "VERSE_COUNTS"
    path: "server/scripts/seed-confessional.ts"
    signature: "Record<string, number[]>"
    consumedBy: ["F1-ETL-C3"]
