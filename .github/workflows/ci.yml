name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Supply-chain security: --ignore-scripts prevents arbitrary postinstall
# scripts from running during npm ci. Do not remove without security review.

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd server && npm ci --ignore-scripts
        # Note: tests/promptfoo deps not installed in CI — promptfoo evals
        # are expensive LLM calls, not CI-suitable.

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Verify dependencies restored
        run: |
          test -d server/node_modules || (echo "ERROR: node_modules cache miss - dependencies not installed" && exit 1)

      - name: Check for server changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'

      - name: Typecheck
        if: steps.filter.outputs.server == 'true' || github.event_name == 'push'
        run: cd server && npm run typecheck

  test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Verify dependencies restored
        run: |
          test -d server/node_modules || (echo "ERROR: node_modules cache miss - dependencies not installed" && exit 1)

      - name: Check for server changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'

      - name: Run tests
        if: steps.filter.outputs.server == 'true' || github.event_name == 'push'
        run: cd server && npm test

  python-etl-tests:
    name: Python ETL Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Run translit generator structural tests
        # Structural suite only — fixture-driven, no network, no
        # server/.cache/, no server/d1-seed/. The corpus-scale suite
        # (--corpus) needs the ~101MB upstream download and is run locally
        # (Task 15) and in-runner (Task 16), never in CI.
        run: python3 server/scripts/test_translit_generator.py -v

      - name: Run lemma/strongs emit tests
        # Fixture-driven byte-identity + exclusion tests for the derived
        # Hebrew lemma_translit emit step (extract-macula-hebrew.parse_lemma_field
        # shared-source pin). No network, no corpus download.
        run: python3 server/scripts/test_emit_lemma_strongs.py -v

      - name: Run Masoretic extractor structural tests
        # Structural suite only — fixture-driven, network-free. Runs on EVERY
        # PR: this job carries no paths-filter, deliberately.
        #
        # Why this one DOES get a corpus job in CI while the translit corpus
        # suite above says "never in CI": the two are not comparable. The
        # translit corpus needs a ~101 MB download; the Masoretic corpus is
        # 25-30 MB, read-only, needs no secrets, and performs no D1 write. It
        # runs in the verify-masoretic-corpus job below. Without this note the
        # two adjacent steps read as contradicting each other.
        run: python3 plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/test_extract_oshb_paragraphs.py -v

  verify-masoretic-corpus:
    name: Verify Masoretic Corpus
    runs-on: ubuntu-latest
    # NOTE: this job ALWAYS runs and always reports. The path filter is a STEP,
    # not a workflow-level `paths:`. A workflow-level filter SKIPS the job, and
    # a skipped required check sits permanently pending — with six required
    # checks on main that would hang every unrelated PR. This exact mistake has
    # already been made twice in this feature's history.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Check for Masoretic changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            masoretic:
              # The DATA path is listed first and is the load-bearing one: it
              # catches a hand-edited JSON with no generator change, which is
              # the root cause the drift check exists to prevent. Filtering
              # only on the scripts would miss exactly that case.
              - 'plugins/claude-of-alexandria/skills/biblical-segmentation/reference/masoretic/**'
              - 'plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/extract_oshb_paragraphs.py'
              - 'plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/test_extract_oshb_paragraphs.py'
              - 'plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/oshb-checksums.json'
              - 'plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/sefaria_paragraphs.py'

      - name: Run corpus goldens
        # THIS STEP is what makes AC-2 and AC-7 enforceable at all. Without it
        # the job would run only the drift check, which proves
        # regenerated == committed and is satisfied identically whether Genesis
        # holds 42+50 or 4+5.
        if: steps.filter.outputs.masoretic == 'true' || github.event_name == 'push'
        run: python3 plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/test_extract_oshb_paragraphs.py --corpus -v

      - name: Drift check — the extractor is the sole regeneration path
        # Regenerate IN PLACE and assert a clean tree with `git status
        # --porcelain`, not `git diff --exit-code`. The latter sees only
        # tracked MODIFIED files, so a newly created regenerated file or a
        # deleted committed one is invisible to it. That is not hypothetical:
        # a filename-convention bug during this feature's build wrote 7 extra
        # files beside the originals and orphaned them, which `git diff` would
        # have passed clean.
        if: steps.filter.outputs.masoretic == 'true' || github.event_name == 'push'
        run: |
          python3 plugins/claude-of-alexandria/skills/biblical-segmentation/scripts/extract_oshb_paragraphs.py
          DRIFT=$(git status --porcelain -- plugins/claude-of-alexandria/skills/biblical-segmentation/reference/masoretic/)
          if [ -n "$DRIFT" ]; then
            echo "DRIFT DETECTED — committed data does not match a fresh regeneration:"
            echo "$DRIFT"
            echo ""
            echo "Hand-editing files under reference/masoretic/ is never legitimate."
            echo "Regenerate with extract_oshb_paragraphs.py and commit the result."
            exit 1
          fi
          echo "No drift: committed data matches a fresh regeneration."

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Audit server production dependencies
        run: cd server && npm audit --audit-level=critical --omit=dev
        # Using --audit-level=critical (not high) to avoid blocking CI on
        # unfixable transitive vulnerabilities. Review high-severity findings
        # manually via `cd server && npm audit --omit=dev`.

  validate-plugin:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify MCP entry point exists
        run: test -f server/src/index.ts

      - name: Check version consistency
        run: ./scripts/validate-versions.sh

      - name: Validate skill-tool wiring
        run: ./scripts/validate-skill-tools.sh
        # Note: --strict omitted until frontmatter extraction is battle-tested.
        # Graduate to --strict after confirming zero false positives.

      - name: Check README counts
        run: ./scripts/validate-readme-counts.sh

      - name: Verify LICENSE exists
        run: test -f LICENSE

      - name: Verify CHANGELOG exists
        run: test -f CHANGELOG.md

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Scanning PR diff..."
            ./scripts/betterleaks.sh scan \
              --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "Scanning full history..."
            ./scripts/betterleaks.sh scan
          fi
