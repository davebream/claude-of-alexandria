name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Supply-chain security: --ignore-scripts prevents arbitrary postinstall
# scripts from running during npm ci. Do not remove without security review.

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd server && npm ci --ignore-scripts
        # Note: tests/promptfoo deps not installed in CI — promptfoo evals
        # are expensive LLM calls, not CI-suitable.

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Restore node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Verify dependencies restored
        run: |
          test -d server/node_modules || (echo "ERROR: node_modules cache miss - dependencies not installed" && exit 1)

      - name: Check for server changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'

      - name: Typecheck
        if: steps.filter.outputs.server == 'true' || github.event_name == 'push'
        run: cd server && npm run typecheck

  test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Restore node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: server/node_modules
          key: node-modules-${{ hashFiles('server/package-lock.json') }}

      - name: Verify dependencies restored
        run: |
          test -d server/node_modules || (echo "ERROR: node_modules cache miss - dependencies not installed" && exit 1)

      - name: Check for server changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'

      - name: Run tests
        if: steps.filter.outputs.server == 'true' || github.event_name == 'push'
        run: cd server && npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Audit server production dependencies
        run: cd server && npm audit --audit-level=critical --omit=dev
        # Using --audit-level=critical (not high) to avoid blocking CI on
        # unfixable transitive vulnerabilities. Review high-severity findings
        # manually via `cd server && npm audit --omit=dev`.

  validate-plugin:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify MCP entry point exists
        run: test -f server/src/index.ts

      - name: Check version consistency
        run: ./scripts/validate-versions.sh

      - name: Validate skill-tool wiring
        run: ./scripts/validate-skill-tools.sh
        # Note: --strict omitted until frontmatter extraction is battle-tested.
        # Graduate to --strict after confirming zero false positives.

      - name: Check README counts
        run: ./scripts/validate-readme-counts.sh

      - name: Verify LICENSE exists
        run: test -f LICENSE

      - name: Verify CHANGELOG exists
        run: test -f CHANGELOG.md

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Scanning PR diff..."
            ./scripts/betterleaks.sh scan \
              --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "Scanning full history..."
            ./scripts/betterleaks.sh scan
          fi
