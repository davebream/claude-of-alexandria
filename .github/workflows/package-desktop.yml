name: Package for Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create skill ZIPs
        run: |
          mkdir -p desktop-zips
          for dir in plugins/claude-of-alexandria/skills/*/; do
            skill_name=$(basename "$dir")
            (cd "$dir" && zip -r "../../../../desktop-zips/${skill_name}.zip" . \
              -x "./reference/masoretic/*" \
              -x "./reference/morphology/*" \
              -x "./reference/vocabulary/*" \
              -x "./reference/levinsohn/*" \
              -x "./scripts/*")
          done

      - name: Build MCP server tarball
        run: |
          cd plugins/claude-of-alexandria/servers/claude-of-alexandria-mcp
          npm ci
          npm run build
          cd ../../../..
          mkdir -p desktop-zips
          tar czf desktop-zips/claude-of-alexandria-mcp.tar.gz \
            -C plugins/claude-of-alexandria/servers \
            claude-of-alexandria-mcp/dist \
            claude-of-alexandria-mcp/data/biblical.sqlite \
            claude-of-alexandria-mcp/package.json \
            claude-of-alexandria-mcp/package-lock.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} desktop-zips/* --clobber
          else
            gh release create ${{ github.ref_name }} desktop-zips/* \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi
