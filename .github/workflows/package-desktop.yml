name: Package for Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create skill ZIPs
        run: |
          mkdir -p desktop-zips
          for dir in plugins/claude-of-alexandria/skills/*/; do
            skill_name=$(basename "$dir")
            (cd "$dir" && zip -r "../../../../desktop-zips/${skill_name}.zip" . \
              -x "./reference/masoretic/*" \
              -x "./reference/morphology/*" \
              -x "./reference/vocabulary/*" \
              -x "./reference/levinsohn/*" \
              -x "./scripts/*")
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} desktop-zips/* --clobber
          else
            gh release create ${{ github.ref_name }} desktop-zips/* \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi
