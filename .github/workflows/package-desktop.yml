name: Package for Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create skill ZIPs
        run: |
          mkdir -p desktop-zips
          for dir in plugins/claude-of-alexandria/skills/*/; do
            zip -r "desktop-zips/$(basename $dir).zip" "$dir" \
              -x "*/reference/masoretic/*" \
              -x "*/reference/morphology/*" \
              -x "*/reference/vocabulary/*" \
              -x "*/reference/levinsohn/*" \
              -x "*/scripts/*"
          done

      - name: Create GitHub Release with ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} desktop-zips/*.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
