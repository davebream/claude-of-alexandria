name: Regenerate Vocabulary

# This workflow performs a DESTRUCTIVE full-table replace of the production
# `vocabulary` table (DELETE FROM vocabulary; then re-INSERT every row). There is
# exactly one D1 database and --remote is production — no staging to rehearse
# against. Per decision 0004 this repo writes production D1 with no human in the
# loop by explicit choice; every guard below is load-bearing on its own.
#
# It exists to deliver the second half of decisions/0009: the extractor
# min_occurrences threshold was lowered to 1, but the shipped `vocabulary` table
# still carries the old per-book threshold (NT 3 / OT 5) that silently dropped
# rare-per-book lemmas — e.g. μεταξύ in John 4:31, H7225 (רֵאשִׁית) in Genesis.
# This regenerates the table complete. See server/scripts/REGENERATE-VOCABULARY.md.
#
# Delivery follows decisions/0005 (generate-in-runner, nothing committed to
# server/d1-seed/) and 0006 (per-book files bound each D1 request). SQL is
# regenerated in the runner from PINNED corpora on every run.
#
# TRIGGER IS workflow_dispatch ONLY — deliberately no `push:` trigger. A
# destructive full-table replace must never fire automatically on a source edit
# the way the UPDATE-only transliteration backfill does.
#
# CLOBBER CAVEAT: the `vocabulary` table also ships in d1-seed/data.sql (the
# manual seed path). Running seed-d1.sh after this workflow re-applies that
# stale, thresholded data.sql and silently reverts this regeneration. A reseed
# does not auto-re-fire this workflow — re-dispatch it manually after any reseed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REGENERATE-VOCABULARY to confirm the destructive full-table replace'
        required: true
        default: ''
      sblgnt_sha:
        description: 'morphgnt/sblgnt commit to pin (NT corpus)'
        required: true
        default: 'aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d'
      morphhb_sha:
        description: 'openscriptures/morphhb commit to pin (OT corpus)'
        required: true
        default: '3d15126fb1ef74867fc1434be1942e837932691f'

permissions:
  contents: read

concurrency:
  # A second run's `DELETE FROM vocabulary` must not race a first run's in-flight
  # INSERTs. Serialize; a queued run WAITS rather than cancelling an apply
  # already touching production.
  group: regenerate-vocabulary
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate vocabulary table
    runs-on: ubuntu-latest
    # Defence-in-depth against an accidental dispatch from the wrong ref. Not a
    # security boundary (a write-access holder already has the merge-to-main
    # path decision 0004 accepts) — the same trust boundary, exercised twice.
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: server
    steps:
      - name: Confirm destructive intent
        working-directory: .
        # Fail fast, before any checkout/clone work, unless the operator typed
        # the exact confirmation phrase. The input has no default value, so an
        # empty dispatch stops here.
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "REGENERATE-VOCABULARY" ]; then
            echo "ERROR: confirmation phrase not given — expected REGENERATE-VOCABULARY." >&2
            echo "This workflow does a destructive full-table replace of production vocabulary." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install server dependencies (wrangler)
        run: npm ci --ignore-scripts

      - name: Clone pinned corpora
        working-directory: .
        # Full clone then checkout the pinned SHA — reproducible inputs
        # (decision 0005). Never interpolate ${{ }} inside the shell body; pass
        # the pins through the environment so they cannot break out of quoting.
        env:
          SBLGNT_SHA: ${{ github.event.inputs.sblgnt_sha }}
          MORPHHB_SHA: ${{ github.event.inputs.morphhb_sha }}
        run: |
          set -euo pipefail
          git clone https://github.com/morphgnt/sblgnt.git "${GITHUB_WORKSPACE}/_corpora/sblgnt"
          git -C "${GITHUB_WORKSPACE}/_corpora/sblgnt" checkout "${SBLGNT_SHA}"
          git clone https://github.com/openscriptures/morphhb.git "${GITHUB_WORKSPACE}/_corpora/morphhb"
          git -C "${GITHUB_WORKSPACE}/_corpora/morphhb" checkout "${MORPHHB_SHA}"

      - name: Extract vocabulary JSON at the complete threshold (min_occurrences=1)
        working-directory: .
        # The extractors' default is now 1 (decisions/0009). Do NOT pass -n>1.
        run: |
          set -euo pipefail
          EX=plugins/claude-of-alexandria/skills/biblical-segmentation/scripts
          python3 "${EX}/extract_nt_vocabulary.py" -m "${GITHUB_WORKSPACE}/_corpora/sblgnt"  -o "${GITHUB_WORKSPACE}/_vocab_json/nt"
          python3 "${EX}/extract_ot_vocabulary.py" -m "${GITHUB_WORKSPACE}/_corpora/morphhb" -o "${GITHUB_WORKSPACE}/_vocab_json/ot"

      - name: Generate per-book vocabulary SQL
        run: |
          set -euo pipefail
          python3 scripts/generate-vocabulary-sql.py \
            --nt-dir "${GITHUB_WORKSPACE}/_vocab_json/nt" \
            --ot-dir "${GITHUB_WORKSPACE}/_vocab_json/ot" \
            --out-dir d1-seed/vocabulary-staging

      - name: Pre-apply oracles (BEFORE touching production)
        # The whole point of the run is completeness: John must GAIN μεταξύ and
        # Genesis must GAIN H7225 versus the old thresholded table. Assert that
        # in the generated SQL before any production write — if the generator
        # silently produced thresholded output, stop here.
        run: |
          set -euo pipefail
          S=d1-seed/vocabulary-staging
          [ -f "${S}/00-reset.sql" ] || { echo "ERROR: reset file missing — generator failed" >&2; exit 1; }
          book_files=$(ls "${S}"/nt-*.sql "${S}"/ot-*.sql 2>/dev/null | wc -l)
          [ "${book_files}" -ge 60 ] || { echo "ERROR: only ${book_files} book files (<60) — generator produced too few" >&2; exit 1; }
          # Acts μεταξύ total must be 3 (present in both thresholds).
          python3 scripts/generate-vocabulary-sql.py \
            --nt-dir "${GITHUB_WORKSPACE}/_vocab_json/nt" \
            --ot-dir "${GITHUB_WORKSPACE}/_vocab_json/ot" --verify
          # Completeness oracles — these rows exist ONLY at min=1.
          grep -q "μεταξύ" "${S}/nt-john.sql" || { echo "ERROR: μεταξύ absent from nt-john.sql — output is still thresholded, refusing to apply" >&2; exit 1; }
          grep -q "'H7225'" "${S}/ot-genesis.sql" || { echo "ERROR: H7225 absent from ot-genesis.sql — output is still thresholded, refusing to apply" >&2; exit 1; }

      - name: Apply to production D1 (reset first, then every book file)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `wrangler d1 execute --file=` takes exactly ONE file per invocation and
        # does not glob-expand — loop explicitly (precedent: seed-d1.sh's per-book
        # loop). NEVER invoke seed-d1.sh here (its NT path batch-deletes all NT
        # morphology — a production outage). Reset MUST be applied first. Pinned
        # wrangler version: --file --remote atomicity is version-dependent.
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "Applying reset (DELETE FROM vocabulary)"
          npx wrangler@4.112.0 d1 execute claude-of-alexandria --remote --file=d1-seed/vocabulary-staging/00-reset.sql
          files=(d1-seed/vocabulary-staging/nt-*.sql d1-seed/vocabulary-staging/ot-*.sql)
          [ ${#files[@]} -gt 0 ] || { echo "ERROR: no per-book SQL matched — generator failed silently" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "Applying ${f}"
            npx wrangler@4.112.0 d1 execute claude-of-alexandria --remote --file="${f}"
          done

      - name: Coverage gate (the only correctness oracle for the apply)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Detective, not preventive — a partial or reverted apply is already live
        # by the time this fires, but it is the only thing that catches it. Assert
        # the two headline completeness rows are actually present in production.
        run: |
          set -euo pipefail
          nt=$(npx wrangler@4.112.0 d1 execute claude-of-alexandria --remote --json \
            --command "SELECT COUNT(*) AS n FROM vocabulary WHERE lemma='μεταξύ' AND testament='nt' AND book='john'" 2>/dev/null \
            | jq -r '[.[0].results[]?.n][0] // 0')
          ot=$(npx wrangler@4.112.0 d1 execute claude-of-alexandria --remote --json \
            --command "SELECT COUNT(*) AS n FROM vocabulary WHERE lemma='H7225' AND testament='ot' AND book='genesis'" 2>/dev/null \
            | jq -r '[.[0].results[]?.n][0] // 0')
          echo "Production completeness: john/μεταξύ=${nt} (expect 1), genesis/H7225=${ot} (expect >=1)"
          if [ "${nt}" != "1" ] || [ "${ot}" -lt 1 ]; then
            echo "ERROR: coverage gate FAILED — the regeneration did not land completely." >&2
            echo "A REPEATED failure across re-runs means the generator is defective, not" >&2
            echo "transient: a re-run is correct only for a transient failure (timeout, blip)" >&2
            echo "and WRONG for a deterministic bug it would just propagate. Do NOT hand-patch" >&2
            echo "production D1 — open a PR fixing the generator and re-dispatch. Note: the" >&2
            echo "table is mid-replace, so leaving it failed leaves it partial; re-dispatch or" >&2
            echo "restore from d1-seed/data.sql via the runbook." >&2
            exit 1
          fi
          echo "Coverage gate passed — vocabulary regenerated complete."
