name: Dependabot Auto-merge

# Automatically merges Dependabot patch and minor PRs after all CI checks pass.
# Major version bumps are excluded — they always require manual review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge patch and minor updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI checks and merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          echo "Patch/minor update detected — waiting for CI checks to pass..."
          gh pr checks "$PR_NUMBER" \
            --repo "$REPO" \
            --watch \
            --interval 30 \
            --fail-fast
          echo "All checks passed — merging..."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
