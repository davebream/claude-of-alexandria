name: Promptfoo Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to test (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - exegetical-notes
          - pericope-delimitation
          - argument-flow
          - consult-biblical-scholar
          - biblical-segmentation
      phase:
        description: 'Test phase'
        required: true
        default: 'red'
        type: choice
        options:
          - red
          - green
          - both

jobs:
  eval:
    name: Evaluate ${{ inputs.skill }} (${{ inputs.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: tests/promptfoo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/promptfoo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run RED phase — ${{ inputs.skill }}
        if: inputs.phase == 'red' || inputs.phase == 'both'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDECODE: ''
        run: |
          if [ "${{ inputs.skill }}" = "all" ]; then
            for skill in exegetical-notes pericope-delimitation argument-flow consult-biblical-scholar biblical-segmentation; do
              npm run eval:${skill}:red
            done
          else
            npm run eval:${{ inputs.skill }}:red
          fi

      - name: Run GREEN phase — ${{ inputs.skill }}
        if: inputs.phase == 'green' || inputs.phase == 'both'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDECODE: ''
        run: |
          if [ "${{ inputs.skill }}" = "all" ]; then
            for skill in exegetical-notes pericope-delimitation argument-flow consult-biblical-scholar biblical-segmentation; do
              npm run eval:${skill}:green
            done
          else
            npm run eval:${{ inputs.skill }}:green
          fi
