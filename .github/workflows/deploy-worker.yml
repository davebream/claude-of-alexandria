name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'server/src/**'
      - 'server/wrangler.toml'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks CI runs. This workflow fires on push
      # to main independently of ci.yml, so without these it will ship code that
      # fails typecheck or tests — and apply D1 migrations to production first.
      # Until 2026-07-17 the only thing standing between a broken main and a live
      # deploy was `npm ci` happening to fail for the same reason CI did.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply claude-of-alexandria --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
