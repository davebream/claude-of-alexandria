name: Backfill Theographic Place Redirects

# Writes duplicate→canonical place redirects to production D1. SQL is produced
# in-runner from the pinned, checksum-verified Theographic corpus and is never
# committed under server/d1-seed/ (decision 0005). Production D1 is the only
# remote database (decision 0004); every guard below is load-bearing.

on:
  push:
    branches: [main]
    paths:
      - 'server/scripts/etl-theographic.py'
      - 'server/scripts/theographic-checksums.json'
      - '.github/workflows/backfill-theographic-places.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill theographic place redirects
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install server dependencies
        run: npm ci --ignore-scripts

      - name: Generate place-redirect SQL in-runner
        run: python3 scripts/etl-theographic.py --emit place-redirect

      - name: Run corpus assertions before touching production
        run: python3 scripts/test_etl_theographic.py --corpus -v

      - name: Apply redirect head (staging table)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4.113.0 d1 execute claude-of-alexandria --remote \
            --file=d1-seed/theographic-place-redirect-head.sql

      - name: Preflight production staging and orphan coverage
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          def d1(command: str):
              result = subprocess.run(
                  [
                      "npx",
                      "wrangler@4.113.0",
                      "d1",
                      "execute",
                      "claude-of-alexandria",
                      "--remote",
                      "--json",
                      "--command",
                      command,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              payload = json.loads(result.stdout)
              return payload[0]["results"]

          manifest = json.loads(
              open("d1-seed/theographic-place-redirect-manifest.json", encoding="utf-8").read()
          )
          expected_mappings = manifest["duplicate_mapping_count"]
          if expected_mappings != 27:
              raise SystemExit(f"Unexpected mapping count in manifest: {expected_mappings}")

          staging_count = d1(
              "SELECT COUNT(*) AS n FROM theographic_place_redirect"
          )[0]["n"]
          if staging_count != 27:
              raise SystemExit(f"Staging row count {staging_count} != 27")

          missing_targets = d1(
              """
              SELECT COUNT(*) AS n
              FROM theographic_place_redirect r
              WHERE NOT EXISTS (SELECT 1 FROM places p WHERE p.id = r.canonical_place_id)
              """
          )[0]["n"]
          if missing_targets != 0:
              raise SystemExit(f"{missing_targets} staging targets missing from places")

          orphans = d1(
              """
              SELECT place_id FROM (
                SELECT DISTINCT place_id FROM verse_places
                WHERE place_id NOT IN (SELECT id FROM places)
                UNION
                SELECT DISTINCT place_id FROM event_locations
                WHERE place_id NOT IN (SELECT id FROM places)
              )
              """
          )
          orphan_ids = {row["place_id"] for row in orphans}
          mapped = {
              row["source_place_id"]
              for row in d1("SELECT source_place_id FROM theographic_place_redirect")
          }
          unmapped = sorted(orphan_ids - mapped)
          if unmapped:
              raise SystemExit(f"Orphan IDs lack staging mappings: {unmapped}")

          def capture(table: str):
              before_total = d1(f"SELECT COUNT(*) AS n FROM {table}")[0]["n"]
              mapped_source_rows = d1(
                  f"""
                  SELECT COUNT(*) AS n FROM {table} t
                  WHERE EXISTS (
                    SELECT 1 FROM theographic_place_redirect r
                    WHERE r.source_place_id = t.place_id
                  )
                  """
              )[0]["n"]
              newly_needed = d1(
                  f"""
                  SELECT COUNT(*) AS n FROM (
                    SELECT DISTINCT t.book, t.chapter, t.verse, r.canonical_place_id AS place_id
                    FROM {table} t
                    JOIN theographic_place_redirect r ON r.source_place_id = t.place_id
                    WHERE NOT EXISTS (
                      SELECT 1 FROM {table} existing
                      WHERE existing.book = t.book
                        AND existing.chapter = t.chapter
                        AND existing.verse = t.verse
                        AND existing.place_id = r.canonical_place_id
                    )
                  )
                  """
                  if table == "verse_places"
                  else f"""
                  SELECT COUNT(*) AS n FROM (
                    SELECT DISTINCT t.event_id, r.canonical_place_id AS place_id
                    FROM {table} t
                    JOIN theographic_place_redirect r ON r.source_place_id = t.place_id
                    WHERE NOT EXISTS (
                      SELECT 1 FROM {table} existing
                      WHERE existing.event_id = t.event_id
                        AND existing.place_id = r.canonical_place_id
                    )
                  )
                  """
              )[0]["n"]
              return before_total, mapped_source_rows, newly_needed

          vp_before, vp_mapped, vp_new = capture("verse_places")
          el_before, el_mapped, el_new = capture("event_locations")

          print(f"verse_places before={vp_before} mapped_source={vp_mapped} new_canonical={vp_new}")
          print(f"event_locations before={el_before} mapped_source={el_mapped} new_canonical={el_new}")

          with open("/tmp/theographic-place-redirect-preflight.json", "w", encoding="utf-8") as fh:
              json.dump(
                  {
                      "verse_places": {
                          "before_total": vp_before,
                          "mapped_source_rows": vp_mapped,
                          "newly_inserted_canonical_rows": vp_new,
                      },
                      "event_locations": {
                          "before_total": el_before,
                          "mapped_source_rows": el_mapped,
                          "newly_inserted_canonical_rows": el_new,
                      },
                  },
                  fh,
              )
          print("Preflight OK")
          PY

      - name: Apply redirect mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4.113.0 d1 execute claude-of-alexandria --remote \
            --file=d1-seed/theographic-place-redirect-apply.sql

      - name: Verify production invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          def d1(command: str):
              result = subprocess.run(
                  [
                      "npx",
                      "wrangler@4.113.0",
                      "d1",
                      "execute",
                      "claude-of-alexandria",
                      "--remote",
                      "--json",
                      "--command",
                      command,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)[0]["results"]

          preflight = json.loads(open("/tmp/theographic-place-redirect-preflight.json", encoding="utf-8").read())

          def check_table(table: str):
              after_total = d1(f"SELECT COUNT(*) AS n FROM {table}")[0]["n"]
              before = preflight[table]["before_total"]
              mapped = preflight[table]["mapped_source_rows"]
              newly = preflight[table]["newly_inserted_canonical_rows"]
              expected = before - mapped + newly
              print(f"{table}: after={after_total} expected={expected} (before={before} - mapped={mapped} + new={newly})")
              if after_total != expected:
                  raise SystemExit(f"{table} total mismatch")

          check_table("verse_places")
          check_table("event_locations")

          orphans = d1(
              """
              SELECT COUNT(*) AS n FROM (
                SELECT place_id FROM verse_places
                WHERE place_id NOT IN (SELECT id FROM places)
                UNION ALL
                SELECT place_id FROM event_locations
                WHERE place_id NOT IN (SELECT id FROM places)
              )
              """
          )[0]["n"]
          if orphans != 0:
              raise SystemExit(f"{orphans} orphan junction rows remain")

          mismatches = d1(
              """
              SELECT COUNT(*) AS n
              FROM places p
              WHERE p.id IN (SELECT DISTINCT canonical_place_id FROM theographic_place_redirect)
                AND p.appearance_count != (
                  SELECT COUNT(*) FROM verse_places vp WHERE vp.place_id = p.id
                )
              """
          )[0]["n"]
          if mismatches != 0:
              raise SystemExit(f"{mismatches} appearance_count mismatches for redirect targets")

          psalm_126_1 = d1(
              """
              SELECT place_id FROM verse_places
              WHERE book = 'psalms' AND chapter = 126 AND verse = 1
              ORDER BY place_id
              """
          )
          ids = [row["place_id"] for row in psalm_126_1]
          if 636 not in ids:
              raise SystemExit(f"Psalm 126:1 missing Jerusalem 636; got {ids}")

          psalm_126_4 = d1(
              """
              SELECT COUNT(*) AS n FROM verse_places
              WHERE book = 'psalms' AND chapter = 126 AND verse = 4
              """
          )[0]["n"]
          if psalm_126_4 != 0:
              raise SystemExit(f"Psalm 126:4 unexpectedly has {psalm_126_4} place row(s)")

          print("Production invariants OK")
          PY

      - name: Drop staging table
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer the generated tail file when present; fall back to an
          # inline DROP so cleanup still runs if generation failed after head.
          if [ -f d1-seed/theographic-place-redirect-tail.sql ]; then
            npx wrangler@4.113.0 d1 execute claude-of-alexandria --remote \
              --file=d1-seed/theographic-place-redirect-tail.sql
          else
            npx wrangler@4.113.0 d1 execute claude-of-alexandria --remote \
              --command "DROP TABLE IF EXISTS theographic_place_redirect"
          fi
