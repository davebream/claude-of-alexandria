name: Backfill Transliteration

# This workflow writes to PRODUCTION D1. wrangler.toml defines exactly one
# database and --remote is that production database — there is no staging to
# rehearse against. Per decision 0004, this repo autonomously merges to main
# and writes production D1 with no human in the loop, by explicit choice; the
# environment:/required-reviewer gate that would normally sit in front of a
# production-writing workflow was considered and rejected. Every guard below
# is therefore load-bearing on its own — there is no second line of defense.
#
# Delivery mechanism is decision 0005 (Option B): nothing is committed to
# server/d1-seed/ (it stays gitignored). This workflow regenerates the
# translit staging SQL from the pinned upstream corpora, in the runner, on
# every run, and applies it directly to production with wrangler d1 execute.

on:
  push:
    branches: [main]
    # Enumerate the two source scripts EXPLICITLY. `extract-*.py` matches
    # EIGHT files in server/scripts/ (abbott-smith, bdb, lexicon, lsj,
    # macula-hebrew, opengnt, speaker-quotations, versification) — a glob
    # here would fire a full, unreviewed, ~517K-row production backfill on a
    # typo fix to an unrelated lexicon ETL. Only these two scripts feed the
    # transliteration backfill.
    paths:
      - 'server/scripts/extract-opengnt.py'
      - 'server/scripts/extract-macula-hebrew.py'
  workflow_dispatch:
    # Manual re-run path — e.g. a transient failure (timeout, upstream blip)
    # per Step 8's remediation note. Safe to re-run: the backfill is
    # UPDATE-only and EXISTS-guarded (see extract scripts).

permissions:
  contents: read

concurrency:
  # The staging table's head-DROP is idempotent only under serialized
  # execution: a second run's HEAD DROP would remove translit_staging out
  # from under a first run's in-flight INSERTs. cancel-in-progress: false so
  # a queued run WAITS rather than cancelling (and losing) an in-flight
  # import.
  group: d1-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill morphology.transliteration
    runs-on: ubuntu-latest
    # Defence-in-depth against an ACCIDENTAL dispatch from the wrong ref (a
    # fat-fingered UI selection): branches:[main] above constrains only the
    # push trigger — workflow_dispatch accepts an arbitrary ref and, because
    # workflow_dispatch evaluates the workflow YAML FROM THE DISPATCHED REF,
    # this check cannot protect itself (anyone able to dispatch could first
    # delete this line on their own branch). It is NOT a security boundary
    # against a malicious or compromised write-access holder — that actor
    # already has unmediated production D1 write via the merge-to-main path
    # decision 0004 explicitly accepts. This guard does not widen the
    # accepted trust surface; it is the same trust boundary, exercised by a
    # second workflow.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60 # default is 360 — a hung poll would otherwise burn 6h of runner time
    defaults:
      run:
        working-directory: server
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install server dependencies
        run: npm ci --ignore-scripts

      # Deliberately NO actions/cache step on server/.cache/ here. The
      # backfill currently wins the same-merge race against deploy-worker.yml
      # by LOSING it: the ~101MB self-download burns 5-15 minutes before this
      # job ever polls, handing deploy-worker.yml (which has zero
      # concurrency block) a head start on applying migration 0020 first.
      # Caching this directory would delete that head start and tighten the
      # race the poll below is the only thing sequencing. It is also
      # un-keyable for the OpenGNT half until pinned (which it now is, but
      # the saving is small against ~66 sequential d1 execute --file calls
      # regardless). If caching is added later, Step 5's poll budget must
      # still hold on its own — it is not sized around this accident.

      - name: Generate translit staging SQL in-runner
        # Both scripts self-download from pinned, checksum-verified sources
        # (extract-opengnt.py pins to an immutable commit SHA and verifies
        # SHA-256 on both the cache-hit and fresh-download paths;
        # extract-macula-hebrew.py was already pinned and verified). Nothing
        # is committed — server/d1-seed/ stays gitignored (decision 0005).
        # --emit translit-staging emits ONLY the translit staging SQL; it
        # does not regenerate the 28 NT chunks or 39 OT per-book seed files.
        run: |
          python3 scripts/extract-opengnt.py --emit translit-staging
          python3 scripts/extract-macula-hebrew.py --emit translit-staging

      - name: Wait for migration 0020 to land (read-only schema poll)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # deploy-worker.yml fires on this same squash merge (it also filters
        # server/migrations/**, which this PR touches) and carries NO
        # concurrency block, so there is no mutual exclusion between it and
        # this workflow — both can run concurrently on the same commit. This
        # poll is the ONLY thing sequencing the backfill after migration
        # 0020 actually applies. Measured: deploy-worker.yml reaches its
        # "Apply D1 migrations" step only after checkout, setup-node, npm
        # ci, typecheck, and test — realistically 2-4 minutes, with npm ci
        # alone sometimes exceeding 60s cold. 30 attempts x 30s = ~15
        # minutes is budgeted to actually win that race, not a coin flip.
        #
        # CRITICAL: poll PRAGMA table_info(morphology), NOT
        # `wrangler d1 migrations list`. `migrations list` prints UNAPPLIED
        # migrations — verified against live D1: with 0020 not yet applied
        # it is listed; once applied, it DISAPPEARS from the output. A
        # "0020 present -> proceed" predicate is therefore inverted and
        # would run this backfill BEFORE the column exists, failing with
        # "no such column: transliteration". PRAGMA table_info tests the
        # actual schema state directly and is immune to that inversion.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Poll attempt ${attempt}/30: checking for morphology.transliteration column..."
            result=$(npx wrangler@4.108.0 d1 execute claude-of-alexandria --remote --json \
              --command "PRAGMA table_info(morphology)" 2>/dev/null || echo '[]')
            if echo "${result}" | jq -e '.[0].results[]? | select(.name == "transliteration")' >/dev/null 2>&1; then
              echo "Column present — migration 0020 has landed."
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: morphology.transliteration column never appeared after 30 attempts (~15 min)." >&2
          echo "Migration 0020 did not land in time — stopping before touching production." >&2
          exit 1

      - name: Run corpus-scale assertions BEFORE applying anything
        # Task 4 Step 5a's (e)+(f) assertions, running against the SQL just
        # generated above. Under decision 0005 (Option B) these run
        # automatically on every backfill rather than depending on a human
        # remembering to run them locally. If they fail, stop before
        # touching production.
        run: python3 scripts/test_translit_generator.py --corpus -v

      - name: Apply generated SQL files (explicit loop — --file does not glob-expand)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # wrangler d1 execute --file= takes exactly ONE file per invocation
        # and does not glob-expand; --file=<glob> as a single shell token
        # also fails because pathname expansion needs the literal directory
        # prefix to already exist. Precedent: seed-d1.sh's per-book loop
        # (never invoke seed-d1.sh itself — its NT path batch-deletes all NT
        # morphology, a production outage). Order is not load-bearing for
        # correctness (each file is self-contained: head-drop -> create ->
        # chunked INSERT -> per-book UPDATE -> tail-drop) but the loop stays
        # a plain shell glob forever — this is intentional, keep it that
        # way. NEVER interpolate ${{ }} from any changed-files-style action
        # into this run: block; that is a script-injection sink and the
        # exact shortcut a future edit might reach for after hitting the
        # broken --file=<glob> form.
        #
        # Pinned wrangler version (npx wrangler@4.108.0, matching
        # server/package.json's ^4.108.0 devDependency): --file --remote
        # atomicity/timeout behavior is version-dependent and not fully
        # documented, so a silent wrangler upgrade could change how the one
        # production D1 ingests these files. Pinning removes that variable.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(d1-seed/morphology-translit-*.sql)
          [ ${#files[@]} -gt 0 ] || { echo "ERROR: no generated SQL matched — generator failed silently" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "Applying ${f}"
            npx wrangler@4.108.0 d1 execute claude-of-alexandria --remote --file="${f}"
          done

      - name: Verify coverage gate (the only correctness oracle for the apply step)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The per-book UPDATE's EXISTS guard makes a skipped or mis-ordered
        # apply a SILENT no-op, indistinguishable from the designed ~20% OT
        # gap. This gate is detective, not preventive — a partial import is
        # already live in production by the time it fires — but it is the
        # only thing that can catch it.
        #
        # Assert equality against BOTH the hardcoded absolute counts
        # (138013 nt / 378952 ot — never 138013/378954; C4 excludes 2
        # populated collision-key rows) AND the generated counts sidecar.
        # The sidecar alone only proves self-consistency ("the SQL I
        # generated is the SQL that applied"); the hardcoded pair is the
        # only absolute check, and disagreement between the two signals
        # upstream drift. Fail on inequality in EITHER direction — an
        # overshoot means the key matched rows it should not have.
        run: |
          set -euo pipefail
          expected_nt=$(jq -r '.nt' d1-seed/morphology-translit-counts.json)
          expected_ot=$(jq -r '.ot' d1-seed/morphology-translit-counts.json)

          if [ "${expected_nt}" != "138013" ] || [ "${expected_ot}" != "378952" ]; then
            echo "ERROR: generated counts sidecar (nt=${expected_nt} ot=${expected_ot}) does not match" >&2
            echo "the hardcoded absolute counts (nt=138013 ot=378952). Upstream has likely drifted." >&2
            exit 1
          fi

          result=$(npx wrangler@4.108.0 d1 execute claude-of-alexandria --remote --json \
            --command "SELECT testament, COUNT(*) AS n FROM morphology WHERE transliteration IS NOT NULL GROUP BY testament" 2>/dev/null)

          # Defensive extraction: a testament entirely missing from the result set
          # (e.g. every OT UPDATE silently no-op'd — the exact scenario this gate
          # exists to catch) must become 0 and flow into the comparison + the
          # remediation message below, NOT abort the step early under `set -e`
          # with a bare exit code that erases the guidance. (Cloudflare review C1.)
          actual_nt=$(echo "${result}" | jq -r '[.[0].results[]? | select(.testament == "nt") | .n][0] // 0')
          actual_ot=$(echo "${result}" | jq -r '[.[0].results[]? | select(.testament == "ot") | .n][0] // 0')

          echo "Production coverage: nt=${actual_nt} ot=${actual_ot} (expected nt=138013 ot=378952)"

          if [ "${actual_nt}" != "138013" ] || [ "${actual_ot}" != "378952" ]; then
            echo "ERROR: coverage gate FAILED. Production nt=${actual_nt} ot=${actual_ot}," >&2
            echo "expected nt=138013 ot=378952." >&2
            echo "" >&2
            echo "A REPEATED gate failure across re-runs means the SQL is defective, not" >&2
            echo "transient — a re-run is correct only for a transient failure (timeout," >&2
            echo "upstream blip); it is WRONG for a deterministic generator bug, which" >&2
            echo "reproduces identically forever and whose wrong values a re-run PROPAGATES" >&2
            echo "rather than corrects. If this keeps failing: open a new PR with a fixed" >&2
            echo "generator. Do NOT hand-patch production D1. Rollback via" >&2
            echo "'UPDATE morphology SET transliteration = NULL' is legal under the" >&2
            echo "no-DELETE invariant but is not automated by this workflow." >&2
            exit 1
          fi

          echo "Coverage gate PASSED."

      - name: Report D1 size headroom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Use the sanctioned wrangler d1 info command, not
        # pragma_page_count * pragma_page_size (not the supported route on
        # D1). Expect reported size NOT to fall back down after the staging
        # table's tail-DROP — VACUUM is not on D1's allowlist, so freed
        # pages land on the freelist and are reused by subsequent runs
        # rather than reclaimed. That plateau is normal, not a leak.
        run: npx wrangler@4.108.0 d1 info claude-of-alexandria --json
