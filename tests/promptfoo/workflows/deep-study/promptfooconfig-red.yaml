description: "deep-study workflow — RED bare-model orchestration gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare model does not preserve bounded workflow provenance"
    vars:
      prompt: "Deeply study Philippians 2:5-11 for its humiliation-to-exaltation movement."
    assert:
      - type: llm-rubric
        value: |
          This is a RED baseline. PASS if the answer lacks stable claim/evidence IDs,
          per-tool outcomes, an independent verification status, or an explicit incomplete
          state for unavailable evidence. FAIL only if it unexpectedly provides all of those
          workflow contracts without the plugin.
