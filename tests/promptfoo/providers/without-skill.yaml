# RED-phase provider: agent has MCP access but NO skills loaded
# Omit working_dir → SDK creates temp dir automatically (no skills discoverable)
# Omit setting_sources → no CLAUDE.md, no project skills
id: anthropic:claude-agent-sdk
label: without-skill
config:
  model: claude-sonnet-4-5-20250929
  permission_mode: bypassPermissions
  allow_dangerously_skip_permissions: true
  append_allowed_tools:
    - Read
    - WebSearch
    - list_books
    - query_discourse_features
    - query_paragraph_breaks
    - query_vocabulary
    - query_morphology
    - query_ot_quotes
    - query_lemmas
    - query_themes_for_lemmas
  max_turns: 40
  max_budget_usd: 2.00
  mcp:
    enabled: true
    servers:
      - name: claude-of-alexandria-mcp
        url: https://coa.davebream.com/mcp
