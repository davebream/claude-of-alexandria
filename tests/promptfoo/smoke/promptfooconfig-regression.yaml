description: "Regression smoke — cheap checks across all deployed tools (no llm-rubric)"

# Uses GREEN provider (skills + MCP) but assertions are deterministic only.
# Cost: ~$0.50-1.00 per run (Sonnet calls only, zero Opus grading).
# Run between every phase gate to catch regressions without burning $33-40 on full suite.

providers:
  - file://../providers/with-skill.agent-sdk.yaml

prompts:
  - "{{prompt}}"

# No defaultTest — each scenario has its own cheap assertions.
# NO llm-rubric assertions anywhere in this file. Deterministic only.

tests:
  # ── Phase 1+ (morphology) ──────────────────────────────────────────────
  - description: "R1: query_morphology basic fields (Phase 1+)"
    vars:
      prompt: >
        Use the query_morphology tool to look up Genesis 1:1 with fields="basic".
        Return the raw tool output only, no analysis.
    assert:
      - type: icontains
        value: "lemma"
      - type: icontains
        value: "pos"
      - type: javascript
        value: |
          const raw = JSON.parse(context.providerResponse?.raw || '{}');
          return (raw.num_turns || 0) > 1;

  - description: "R2: query_morphology full fields returns OT enrichment (Phase 1+)"
    vars:
      prompt: >
        Use the query_morphology tool to look up Genesis 1:1 with fields="full".
        Return the raw tool output only, no analysis.
    assert:
      - type: icontains
        value: "gloss"
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          return out.toLowerCase().includes('strongs') || out.toLowerCase().includes('strong');

  # NOTE: R9 (query_syntax) deferred — OpenText data ETL incomplete.
  # R3-R6, R8 verified deployed on server (2026-03-04) and active.

  # ── Phase 2+ (lexicon, versification, cross-refs) ──────────────────────
  - description: "R3: query_lexicon returns Hebrew entry (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with strongs_ids=["H7225"].
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          const lower = out.toLowerCase();
          // H7225 = reshit (beginning) — first word of Genesis 1:1
          return lower.includes('begin') || lower.includes('reshit') || lower.includes('first');

  - description: "R3a: query_lexicon returns Greek LSJ entry (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with strongs_ids=["G4561"].
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          const lower = out.toLowerCase();
          // G4561 = sarx (flesh) — should have LSJ definition
          return lower.includes('flesh') || lower.includes('sarx') || lower.includes('body');

  - description: "R3b: query_lexicon returns H1 entry — H1-H9 padding fix (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with strongs_ids=["H1"].
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // H1 = av (father) — previously unreachable due to zero-padding bug
          try {
            const parsed = JSON.parse(out.match(/\{[\s\S]*\}/)?.[0] || '{}');
            const notInNotFound = !parsed.not_found?.includes('H0001');
            const hasContent = out.toLowerCase().includes('father') || out.toLowerCase().includes('av');
            return notInNotFound && hasContent;
          } catch {
            const hasContent = out.toLowerCase().includes('father') || out.toLowerCase().includes('av');
            return hasContent;
          }

  - description: "R3c: query_lexicon handles mixed Greek+Hebrew batch (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with strongs_ids=["G3056", "H7225"].
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          const lower = out.toLowerCase();
          // G3056 = logos, H7225 = reshit — both should appear in results
          const hasGreek = lower.includes('logos') || lower.includes('word') || lower.includes('λόγος');
          const hasHebrew = lower.includes('reshit') || lower.includes('begin') || lower.includes('first');
          return hasGreek && hasHebrew;

  - description: "R3d: query_lexicon compact mode unchanged (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with strongs_ids=["G4561"] and compact=true.
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // Compact mode: should have gloss, should NOT have lsj_definition
          const hasGloss = out.includes('gloss');
          const noDefinition = !out.includes('lsj_definition');
          return hasGloss && noDefinition;

  - description: "R3e: query_lexicon lemma lookup returns entry (Phase 2+)"
    vars:
      prompt: >
        Use the query_lexicon tool with lemmas=["λόγος"].
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          const lower = out.toLowerCase();
          // λόγος should resolve via lemma lookup
          return lower.includes('logos') || lower.includes('word') || lower.includes('g3056');

  - description: "R4: query_cross_references returns results (Phase 2+)"
    vars:
      prompt: >
        Use the query_cross_references tool for Romans 8:28.
        Return the raw tool output only.
    assert:
      - type: icontains
        value: "Genesis"

  # ── Phase 3+ (entities) ────────────────────────────────────────────────
  - description: "R5: query_people returns results (Phase 3+)"
    vars:
      prompt: >
        Use the query_people tool for Romans 16:1-16:16.
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // Should contain multiple people names
          // KJV naming: Phebe (not Phoebe), Priscilla (not Prisca), Aquila
          const names = ['Phebe', 'Priscilla', 'Aquila', 'Phoebe', 'Prisca'].filter(n => out.includes(n));
          return names.length >= 2;

  # ── Phase 3a+ (speakers) ───────────────────────────────────────────────
  - description: "R6: query_speakers returns divine speech (Phase 3a+)"
    vars:
      prompt: >
        Use the query_speakers tool for Genesis 22:1-22:19.
        Return the raw tool output only.
    assert:
      - type: icontains
        value: "God"
      - type: icontains
        value: "Abraham"

  # ── Phase 5+ (OpenGNT) ─────────────────────────────────────────────────
  - description: "R7: query_morphology full returns NT Louw-Nida (Phase 5+)"
    vars:
      prompt: >
        Use the query_morphology tool to look up John 1:1 with fields="full".
        Return the raw tool output only.
    assert:
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          return out.toLowerCase().includes('louw') || out.toLowerCase().includes('nida');

  - description: "R8: query_variants returns edition comparison (Phase 5+)"
    vars:
      prompt: >
        Use the query_variants tool for John 7:53-8:11.
        Return the raw tool output only.
    assert:
      - type: icontains
        value: "variant"
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // Should reference at least some edition codes
          const editions = ['NA28', 'SBLGNT', 'Byzantine', 'Tyndale', 'Textus Receptus', 'Westcott'];
          const found = editions.filter(e => out.includes(e));
          return found.length >= 1;

  - description: "R9: query_syntax returns clause annotations (Phase 7+)"
    vars:
      prompt: >
        Use the query_syntax tool for Romans chapter 8.
        Return the raw tool output only.
    assert:
      - type: icontains
        value: "clause"

  # ── Phase 7+ (bible text tools) ────────────────────────────────────────

  - description: "R10: bible_lookup returns verse text (Phase 7+)"
    vars:
      prompt: >
        Use the bible_lookup tool to look up John 3:16.
        Return the raw tool output only, no analysis.
    assert:
      - type: icontains
        value: "God"
      - type: icontains
        value: "world"
      - type: javascript
        value: |
          const raw = JSON.parse(context.providerResponse?.raw || '{}');
          return (raw.num_turns || 0) > 1;
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          return out.length > 50;

  - description: "R11: commentary_lookup returns commentary content (Phase 7+)"
    vars:
      prompt: >
        Use the commentary_lookup tool to look up commentary on Romans 8:28.
        Return the raw tool output only, no analysis.
    assert:
      - type: javascript
        value: |
          const raw = JSON.parse(context.providerResponse?.raw || '{}');
          return (raw.num_turns || 0) > 1;
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // Commentary should return substantive content (not just an error or empty)
          return out.length > 200;

  - description: "R12: parallel_text returns multi-version comparison (Phase 7+)"
    vars:
      prompt: >
        Use the parallel_text tool to compare translations of Genesis 1:1.
        Return the raw tool output only, no analysis.
    assert:
      - type: javascript
        value: |
          const raw = JSON.parse(context.providerResponse?.raw || '{}');
          return (raw.num_turns || 0) > 1;
      - type: javascript
        value: |
          const out = context.vars?.output || output || '';
          // parallel_text returns translations keyed by BSB, WEB, KJV, ASV, YLT, DBY.
          // Check for at least 2 translation abbreviations to prove multi-version output.
          const lower = out.toLowerCase();
          const translations = ['bsb', 'web', 'kjv', 'asv', 'ylt', 'dby'];
          const found = translations.filter(t => lower.includes(t));
          return found.length >= 2;
