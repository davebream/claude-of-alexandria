# Promptfoo GREEN-phase tests for passage-glossary skill.
# Core failure-mode corrections only. One targeted llm-rubric per failure mode.
# For quality/advanced scenarios, see promptfooconfig-extended.yaml (optional, out of scope for this task).
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/passage-glossary/promptfooconfig-green.yaml
#
# GREEN phase — skill correction verification:
#   S1: John 1:1-5 — targeted single passage (repeated θεός/λόγος); dedup enforced
#   S2: >20-lemma span (John 1:1-18) — batching at ≤20; complete glossary
#   S3: Unresolved lemma seed — (unresolved — not in lexicon) label appears; no fabrication

description: "Passage Glossary — GREEN phase (failure-mode corrections)"

providers:
  - file://../../providers/sdk-with-skill.mjs

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/sdk-grader.mjs
  assert:
    - type: not-icontains
      value: "API Error: 429"
    # Every GREEN test must use MCP tools (not just respond from memory)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # MCP tool citation check: output must reference expected MCP tools.
    - type: javascript
      value: |
        const lower = output.toLowerCase();
        const expected = ['query_morphology', 'query_lexicon'];
        const found = expected.filter(n => lower.includes(n));
        return {
          pass: found.length >= 1,
          score: found.length / expected.length,
          reason: found.length >= 1
            ? `MCP tools cited in output: [${found}]`
            : `No expected MCP tools found in output. Expected: [${expected}]`
        };
    # Must include ## Glossary section header
    - type: icontains
      value: "## Glossary"

tests:
  # =========================================================================
  # Scenario 1: Targeted Single Passage — John 1:1-5
  # Core failure: duplicate headword rows for θεός/λόγος without skill dedup
  # The skill enforces headword identity = strongs ?? lemma; each key once only.
  # =========================================================================
  - description: "S1 GREEN: John 1:1-5 — deduplicated glossary, no duplicate headword rows"
    vars:
      prompt: "Use the passage-glossary skill for John 1:1-5 --output print"
    assert:
      # Load-bearing deterministic dedup check: parse ## Glossary rows and assert
      # no duplicate per-row key tokens ([G####] or (no-strongs)).
      # The SKILL renders: lemma [G####] — gloss  OR  lemma (no-strongs) — gloss
      # Extract the bracketed token per row; assert each appears exactly once.
      - type: javascript
        value: |
          // Find the ## Glossary section
          const glossaryMatch = output.match(/##\s+Glossary([\s\S]*?)(?:\n##\s|\n---|\n#\s|$)/i);
          if (!glossaryMatch) {
            return { pass: false, score: 0, reason: '## Glossary section not found in output' };
          }
          const glossaryBody = glossaryMatch[1];

          // Extract per-row key tokens: [G####] or (no-strongs)
          // Rows look like: θεός [G2316] — God   or   someword (no-strongs) — gloss
          const keyPattern = /\[G\d+\]|\(no-strongs\)/gi;
          const allKeys = glossaryBody.match(keyPattern) || [];

          if (allKeys.length === 0) {
            return {
              pass: false, score: 0,
              reason: 'No per-row key tokens ([G####] or (no-strongs)) found in ## Glossary — skill output format not followed'
            };
          }

          // Normalize to lowercase for comparison
          const normalizedKeys = allKeys.map(k => k.toLowerCase());
          const counts = {};
          for (const key of normalizedKeys) {
            counts[key] = (counts[key] || 0) + 1;
          }

          const duplicates = Object.entries(counts).filter(([, count]) => count > 1);
          if (duplicates.length > 0) {
            return {
              pass: false, score: 0,
              reason: `Duplicate headword key tokens found: ${JSON.stringify(duplicates)}`
            };
          }

          return {
            pass: true, score: 1,
            reason: `${allKeys.length} distinct key tokens, no duplicates: ${JSON.stringify(Object.keys(counts).slice(0, 5))}...`
          };
      # Core failure mode: duplicate rows for repeated lemmas (θεός, λόγος)
      - type: llm-rubric
        value: |
          Check the ## Glossary section for John 1:1-5.
          PASS if θεός and λόγος each appear exactly once as a glossary row — the skill
          deduplicates on the Strong's number (G2316 for θεός, G3056 for λόγος) and each
          key appears only once regardless of how many times the word occurs in the passage.
          FAIL if either θεός or λόγος appears more than once in the ## Glossary rows.

  # =========================================================================
  # Scenario 2: >20-Lemma Span — John 1:1-18
  # Core failure: bare model omits lemmas or fails to batch ≤20 query_lexicon calls
  # The skill explicitly handles spans requiring multiple query_lexicon calls.
  # =========================================================================
  - description: "S2 GREEN: John 1:1-18 — complete glossary for >20-lemma span"
    vars:
      prompt: "Use the passage-glossary skill for John 1:1-18 --output print"
    assert:
      # Load-bearing deterministic dedup check (same as S1 — no duplicate key tokens)
      - type: javascript
        value: |
          const glossaryMatch = output.match(/##\s+Glossary([\s\S]*?)(?:\n##\s|\n---|\n#\s|$)/i);
          if (!glossaryMatch) {
            return { pass: false, score: 0, reason: '## Glossary section not found in output' };
          }
          const glossaryBody = glossaryMatch[1];

          const keyPattern = /\[G\d+\]|\(no-strongs\)/gi;
          const allKeys = glossaryBody.match(keyPattern) || [];

          if (allKeys.length === 0) {
            return {
              pass: false, score: 0,
              reason: 'No per-row key tokens ([G####] or (no-strongs)) found in ## Glossary'
            };
          }

          const normalizedKeys = allKeys.map(k => k.toLowerCase());
          const counts = {};
          for (const key of normalizedKeys) {
            counts[key] = (counts[key] || 0) + 1;
          }

          const duplicates = Object.entries(counts).filter(([, count]) => count > 1);
          if (duplicates.length > 0) {
            return {
              pass: false, score: 0,
              reason: `Duplicate headword key tokens found: ${JSON.stringify(duplicates)}`
            };
          }

          // John 1:1-18 (the Prologue) has well over 20 distinct lemmas; expect at least 20
          if (allKeys.length < 20) {
            return {
              pass: false, score: 0,
              reason: `Only ${allKeys.length} glossary entries found for John 1:1-18 — expected ≥20 distinct headwords`
            };
          }

          return {
            pass: true, score: 1,
            reason: `${allKeys.length} distinct key tokens found, no duplicates`
          };
      # Core failure mode: completeness — bare model omits lemmas for long spans
      - type: llm-rubric
        value: |
          Check the ## Glossary section for John 1:1-18.
          PASS if the glossary is substantially complete for the entire Prologue (John 1:1-18):
          - Contains at least 20 distinct headword rows with [G####] tokens
          - Includes major vocabulary: ἀρχή (beginning), λόγος (Word), θεός (God),
            ζωή (life), φῶς (light), σκοτία (darkness), κόσμος (world), χάρις (grace)
          - Does not obviously skip large sections of the passage
          FAIL if major vocabulary items are missing or the glossary covers fewer than
          15 distinct headwords for an 18-verse passage.

  # =========================================================================
  # Scenario 3: Unresolved Lemma Seed — Anti-Fabrication Evidence
  # Core failure: bare model invents a gloss when query_lexicon returns not_found
  # The skill's anti-fabrication floor: output (unresolved — not in lexicon)
  # Seed: use a contrived or extremely rare form the lexicon will not resolve.
  # =========================================================================
  - description: "S3 GREEN: unresolved lemma — (unresolved — not in lexicon) label, no fabrication"
    vars:
      prompt: "Use the passage-glossary skill for John 1:1-5 --output print. After displaying the normal glossary, also attempt to look up the headword 'ξυξυξ' (a nonsense Greek lemma that will not be in the lexicon) and show how the skill handles an unresolved entry."
    assert:
      # Anti-fabrication: the unresolved label must appear when lexicon returns not_found
      - type: icontains
        value: "unresolved"
      # Core failure mode: fabrication instead of explicit unresolved label
      - type: llm-rubric
        value: |
          Check whether the response handles an unresolved/unknown lemma correctly.
          PASS if the response shows explicit handling of the unresolved lemma:
          - Uses the label "(unresolved — not in lexicon)" or equivalent explicit marker
          - Does NOT invent a gloss or definition for the nonsense lemma 'ξυξυξ'
          - Demonstrates the anti-fabrication floor: unresolved headwords are shown
            with an explicit label, never with a fabricated definition
          FAIL if the response invents a definition for the nonsense lemma 'ξυξυξ'
          without any unresolved/not-found marker, or if it silently omits the
          unresolved lemma from the output without acknowledgment.
