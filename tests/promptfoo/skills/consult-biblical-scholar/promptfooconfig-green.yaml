# Promptfoo GREEN-phase tests for consult-biblical-scholar skill.
# Core failure-mode corrections only. One targeted llm-rubric per scenario.
# For quality/advanced scenarios, see promptfooconfig-extended.yaml.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/consult-biblical-scholar/promptfooconfig-green.yaml
#
# GREEN phase — skill correction verification:
#   S1: MEANING mode — MCP morphology cited before analysis
#   S2: VALIDATE compatible — text evidence BEFORE verdict
#   S3: VALIDATE contradicted — morphological evidence for NOT SUPPORTED
#   S5: Topic mode — warning issued, MEDIUM ceiling enforced
#   S6: Contested question — both positions presented without resolution
#   S7: CROSS-REFERENCE — editorial tradition labeled distinctly
#   S8: Entity identification — data-backed with confidence grading
#   S9: Contested historical question — both Exodus date positions with named scholars

description: "Consult Biblical Scholar — GREEN phase (failure-mode corrections)"

providers:
  - file://../../providers/with-skill.agent-sdk.yaml

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider:
      id: openai:gpt-4o
      config:
        temperature: 0
  assert:
    - type: not-icontains
      value: "API Error: 429"
    # Every GREEN test must use MCP tools (passage-anchored tests)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # MCP tool citation check: output must reference expected MCP tools.
    # NOTE: tool-call-f1 and metadata.toolCalls don't work with claude-agent-sdk.
    - type: javascript
      value: |
        const lower = output.toLowerCase();
        const expected = ['query_morphology', 'query_vocabulary', 'bible_lookup', 'commentary_lookup', 'query_controversies'];
        const found = expected.filter(n => lower.includes(n));
        return {
          pass: found.length >= 1,
          score: found.length / expected.length,
          reason: found.length >= 1
            ? `MCP tools cited in output: [${found}]`
            : `No expected MCP tools found in output. Expected: [${expected}]`
        };
    # Confidence tier must be present
    - type: icontains-any
      value:
        - "CONFIDENCE: HIGH"
        - "CONFIDENCE: MEDIUM"
        - "CONFIDENCE: LOW"
        - "CONFIDENCE: CANNOT ANSWER"
        - "TOPIC MODE"
    # No devotional drift (VALIDATE mode may have a separated Usage Guidance section)
    - type: llm-rubric
      value: |
        FAIL if devotional or pastoral language is MIXED INTO the scholarly analysis:
        - First-person plural moral exhortations blended with text evidence
        - "God uses our struggles for his purposes" stated as an analytical finding
        - "This reminds us to trust God" as part of the evidence section
        PASS if:
        (a) The output is purely scholarly analysis, OR
        (b) Devotional/application content is explicitly separated in its own
            clearly labeled section (e.g., "Usage Guidance", "Pastoral Application",
            "Application Note") — VALIDATE mode may legitimately note how an
            analogy "may be used pastorally" when clearly separated from the evidence.

tests:

  # =========================================================================
  # Scenario 1: MEANING — Word meaning (Phil 1:6, epiteleo)
  # Core failure: morphological claims made without tool attribution
  # Manual TDD verification: PASS — MEDIUM (MCP called but failure documented)
  # =========================================================================
  - description: "S1 GREEN: MEANING — epiteleo with MCP morphology"
    vars:
      prompt: "Use the consult-biblical-scholar skill. Phil 1:6: What does 'epiteleo' mean here and how would I explain it to someone unfamiliar with Greek?"
    assert:
      # Core failure mode: morphological analysis presented without tool attribution
      - type: llm-rubric
        value: |
          PASS if the response includes morphological data for ἐπιτελέω
          attributed to MCP tools (e.g., [query_morphology] citation).
          FAIL if morphological analysis is presented without tool attribution.

  # =========================================================================
  # Scenario 2: VALIDATE — Compatible analogy (2 Cor 12:7-10)
  # Core failure: verdict rendered before text evidence
  # Manual TDD verification: PASS — VERDICT: COMPATIBLE rendered
  # =========================================================================
  - description: "S2 GREEN: VALIDATE — COMPATIBLE verdict for thorn/anxiety"
    vars:
      prompt: "Use the consult-biblical-scholar skill. 2 Cor 12:7-10: I want to compare Paul's thorn in the flesh to living with chronic anxiety. Does this analogy hold up?"
    assert:
      - type: icontains-any
        value:
          - "VERDICT: COMPATIBLE"
          - "COMPATIBLE"
      # Core failure mode: verdict before text evidence
      - type: llm-rubric
        value: |
          PASS if text evidence about σκόλοψ (the thorn) is presented BEFORE
          the verdict is rendered. The text's own meaning must come first.
          FAIL if the verdict is given before any text evidence is discussed.

  # =========================================================================
  # Scenario 3: VALIDATE — Contradicted analogy (Phil 2:5-11)
  # Core failure: verdict without morphological evidence (reflexive + active verb)
  # Manual TDD verification: PASS — NOT SUPPORTED with Fee citation
  # =========================================================================
  - description: "S3 GREEN: VALIDATE — NOT SUPPORTED with morphological evidence"
    vars:
      prompt: "Use the consult-biblical-scholar skill. Phil 2:5-11: Can I say that Jesus 'couldn't help himself' — that his divine nature compelled him to empty himself, so it wasn't really a choice?"
    assert:
      - type: icontains-any
        value:
          - "VERDICT: NOT SUPPORTED"
          - "NOT SUPPORTED"
      # Core failure mode: verdict from tradition only, no grammatical evidence
      - type: llm-rubric
        value: |
          PASS if the response cites morphological evidence showing volition:
          reflexive pronoun ἑαυτόν combined with active verb ἐκένωσεν,
          demonstrating that self-emptying was volitional, not compelled.
          This evidence should come from MCP morphology data.
          FAIL if the verdict is based only on theological tradition
          without grammatical/morphological evidence from MCP tools.

  # =========================================================================
  # Scenario 5: Topic Mode — Sabbath rest (no passage)
  # Core failure: proceeds with full confidence without topic mode warning
  # Manual TDD verification: PASS — immediate warning, MEDIUM cap held
  # =========================================================================
  - description: "S5 GREEN: Topic mode — warning and MEDIUM ceiling"
    vars:
      prompt: "Use the consult-biblical-scholar skill. What is the biblical concept of Sabbath rest and how does it develop across Scripture?"
    assert:
      # Core failure mode: no topic mode warning
      - type: llm-rubric
        value: |
          PASS if the response includes an explicit topic mode warning near the top,
          noting that no specific passage was provided and confidence is limited.
          FAIL if the response proceeds with full confidence without any
          topic mode acknowledgment.
      # Topic mode: MCP runs on identified passages, not the topic keyword.
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          const anyMcp = ['query_morphology', 'query_vocabulary', 'query_discourse_features',
                          'query_paragraph_breaks', 'query_lemmas'].some(t => lower.includes(t));
          return {
            pass: anyMcp,
            score: anyMcp ? 1 : 0,
            reason: anyMcp
              ? 'MCP tool cited in topic-mode output'
              : 'No MCP tool names found in topic-mode output despite mandatory data gathering'
          };

  # =========================================================================
  # Scenario 6: Contested Question — monogenes (John 3:16)
  # Core failure: one position presented definitively / uniform HIGH confidence
  # Manual TDD verification: PASS — both positions presented, BDAG cited
  # =========================================================================
  - description: "S6 GREEN: Contested question — confidence splitting for monogenes"
    vars:
      prompt: "Use the consult-biblical-scholar skill. John 3:16: What does 'monogenes' mean? I've heard it means 'only begotten' but some say 'one and only.' Which is right?"
    assert:
      # Core failure mode: debate definitively resolved, one position dismissed
      - type: llm-rubric
        value: |
          PASS if the response presents BOTH scholarly positions on μονογενής
          (only-begotten vs unique/one-of-a-kind) without definitively resolving
          the debate. Both sides should be presented with their evidence.
          FAIL if ANY of these occur:
          - Only one position is presented
          - The debate is definitively resolved ("the correct answer is...",
            "the word does NOT mean X", "X is linguistically accurate")
          - One position is endorsed as correct while the other is dismissed
          - The response picks a winner rather than presenting the scholarly landscape

  # =========================================================================
  # Scenario 7: CROSS-REFERENCE — editorial tradition labeling (Phase 4)
  # Core failure: TSK-derived cross-refs not distinguished from primary evidence
  # =========================================================================
  - description: "S7 GREEN: CROSS-REFERENCE — editorial tradition distinctly labeled"
    vars:
      prompt: "Use the consult-biblical-scholar skill. Romans 8:28: What passages connect to this verse? Classify the cross-references by evidence type."
    assert:
      # Core failure mode: all cross-refs at uniform confidence without evidence types
      - type: llm-rubric
        value: |
          PASS if cross-references are classified with at least 3 distinct evidence types,
          and editorial tradition (TSK/OpenBible-derived) cross-references are labeled
          distinctly from primary evidence. Signs of success:
          - At least some cross-references labeled as "editorial tradition" or "candidate"
          - Primary/lexical connections distinguished from tradition-based associations
          - Vote counts or confidence qualifiers on editorial tradition entries
          FAIL if all cross-references are presented at uniform confidence without
          distinguishing evidence types.
          FAIL if TSK-derived cross-references are labeled as "Primary" evidence.

  # =========================================================================
  # Scenario 8: Entity Identification with Confidence (Phase 4)
  # Core failure: identification made without entity data or confidence grading
  # =========================================================================
  - description: "S8 GREEN: Entity confidence — identification grounded in entity data"
    vars:
      prompt: "Use the consult-biblical-scholar skill. Acts 15:13: Who is 'James' here? Is this James the brother of Jesus or James the son of Zebedee? How confident can we be?"
    assert:
      # Core failure mode: identification from training knowledge without entity data
      - type: llm-rubric
        value: |
          PASS if the response:
          - Identifies James with reference to entity data or structured evidence
            (not just narrative reasoning)
          - Addresses the identification question with explicit confidence grading
          - Notes that James son of Zebedee was martyred in Acts 12, making this
            identification straightforward — but grounds it in data, not assumption
          FAIL if the identification is made without any reference to entity data
          or structured cross-reference evidence.

  # =========================================================================
  # Scenario 9: Contested Historical Question — Exodus Date
  # Core failure: single date asserted without presenting both scholarly positions
  # With skill+MCP: query_controversies called, both positions presented with
  # named scholars, no winner declared
  # =========================================================================
  - description: "S9 GREEN: Contested history — both Exodus date positions with named scholars"
    vars:
      prompt: "Use the consult-biblical-scholar skill. When did the Exodus happen? Give me the most likely date."
    assert:
      # query_controversies must be invoked
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          return {
            pass: lower.includes('query_controversies'),
            score: lower.includes('query_controversies') ? 1 : 0,
            reason: lower.includes('query_controversies')
              ? 'query_controversies referenced in output'
              : 'No mention of query_controversies — controversy check may have been skipped'
          };
      # Core failure: single position asserted without presenting the debate
      - type: llm-rubric
        value: |
          PASS if the response presents BOTH major scholarly positions on the Exodus date:
          - The early-date position (ca. 1446 BCE or 15th century BCE) with at least one
            named scholar or work (e.g., Kitchen, Merrill, Archer)
          - The late-date position (ca. 1260 BCE or 13th century BCE) with at least one
            named scholar or work (e.g., Bright, Noth, Hoffmeier)
          AND explicitly states that this debate is unresolved — the response does NOT
          declare one date as the correct answer.

          FAIL if:
          - Only one date position is presented
          - The response declares a winner ("the most likely date is X")
          - Named scholars are absent for one or both positions
          - The debate is acknowledged vaguely ("scholars disagree") without presenting
            actual positions, evidence, and scholar names
