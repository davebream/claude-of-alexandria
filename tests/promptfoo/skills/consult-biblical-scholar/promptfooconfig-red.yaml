# Promptfoo RED-phase tests for consult-biblical-scholar skill.
# Agent is bare: no skills, no MCP, no biblical tools.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/consult-biblical-scholar/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: MEANING mode — explanation without evidence grading
#   S2: VALIDATE mode — no formal verdict (COMPATIBLE), pastoral drift
#   S3: VALIDATE contradicted — theological correction without morphological grounding
#   S5: Topic mode — confident synthesis without epistemic marking
#   S6: Contested question — bare model resolves debate definitively
#   S7: TSK cross-reference false confidence — editorial tradition cited as Primary
#   S8: Entity identification — disputed person presented as HIGH confidence

description: "Consult Biblical Scholar — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/grader.yaml

tests:

  # =========================================================================
  # Scenario 1: MEANING — Word meaning (Phil 1:6, epiteleo)
  # Failure: Explanation without evidence grading
  # Bare model mixes morphological facts, usage patterns, and interpretive
  # claims at uniform confidence
  # =========================================================================
  - description: "S1 RED: MEANING mode — explanation without evidence grading"
    vars:
      prompt: "What does 'epiteleo' mean in Philippians 1:6? How would I explain it to someone unfamiliar with Greek?"
    assert:
      # Failure mode 1: No confidence tier declaration
      - type: not-icontains-any
        value:
          - "CONFIDENCE: HIGH"
          - "CONFIDENCE: MEDIUM"
          - "CONFIDENCE: LOW"
          - "CONFIDENCE: CANNOT ANSWER"
      # Failure mode 2: Evidence types mixed at uniform confidence
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response mixes different types of evidence at uniform confidence.
          Signs:
          - Morphological facts (verb form, tense), usage patterns (how the word
            appears elsewhere), and interpretive claims (what Paul means by it)
            are presented at the same confidence level
          - No explicit distinction between what can be verified (parsing, lexical
            range) and what is interpretive (contextual meaning, theological import)
          - Does not label claims by evidence type or tier

          FAIL if the response explicitly separates evidence types (morphological
          fact vs. usage pattern vs. interpretive claim) AND grades them at
          different confidence levels.

  # =========================================================================
  # Scenario 2: VALIDATE — Compatible analogy (2 Cor 12:7-10)
  # Without skill: no formal verdict, pastoral drift
  # Manual TDD: "partly, but with caveats" instead of COMPATIBLE verdict
  # =========================================================================
  - description: "S2 RED: VALIDATE mode — no formal verdict without skill"
    vars:
      prompt: "I want to compare Paul's thorn in the flesh (2 Corinthians 12:7-10) to living with chronic anxiety. Does this analogy hold up?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response does NOT render a formal verdict from the set:
          SUPPORTED / COMPATIBLE / NOT SUPPORTED / INSUFFICIENT DATA.
          PASS also if the response drifts into pastoral advice ("God uses our
          struggles...") or produces a nuanced discussion without a clear verdict.
          FAIL only if a formal verdict from the four-option set is explicitly rendered.

  # =========================================================================
  # Scenario 3: VALIDATE — Contradicted analogy (Phil 2:5-11)
  # Failure: Theological correction without morphological grounding
  # Bare model rejects claim using doctrine rather than verb parsing
  # (active ἐκένωσεν + reflexive ἑαυτόν)
  # =========================================================================
  - description: "S3 RED: VALIDATE contradicted — theological correction without morphological grounding"
    vars:
      prompt: "Can I say that Jesus 'couldn't help himself' — that his divine nature compelled him to empty himself in Philippians 2:5-11, so it wasn't really a choice?"
    assert:
      # Failure mode 1: No formal verdict
      - type: not-icontains-any
        value:
          - "NOT SUPPORTED"
          - "SUPPORTED"
          - "COMPATIBLE"
          - "INSUFFICIENT DATA"
      # Failure mode 2: Theological reasoning without morphological grounding
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response corrects the claim using theological or doctrinal
          reasoning rather than morphological evidence. Signs:
          - Appeals to "orthodox theology," "classical Christology," or "the councils"
            rather than to the grammar of the text
          - Does not specifically cite the active voice of ἐκένωσεν ("he emptied")
            and reflexive ἑαυτόν ("himself") as the primary evidence that this was
            a volitional act, not compulsion
          - Corrects the theology without grounding the correction in verb parsing

          FAIL if the response grounds its correction primarily in the morphological
          evidence (active voice + reflexive pronoun = volitional action) before
          or instead of theological reasoning.

  # =========================================================================
  # Scenario 5: Topic Mode — No passage anchor (Sabbath rest)
  # Failure: Confident synthesis without epistemic marking
  # Bare model traces canonical development without acknowledging
  # topic-mode limitations
  # =========================================================================
  - description: "S5 RED: Topic mode — confident synthesis without epistemic marking"
    vars:
      prompt: "What is the biblical concept of Sabbath rest and how does it develop across Scripture?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents a canonical development summary at uniform
          confidence without acknowledging the epistemic limitations of a topic-level
          query (no specific passage anchor). Signs:
          - Traces Sabbath concept across testaments confidently without noting
            that no single passage was provided for detailed analysis
          - Does not cap confidence or warn that a topic-mode response is inherently
            less grounded than a passage-anchored analysis
          - Presents the synthesis as authoritative rather than as a survey limited
            by the absence of passage-level data

          FAIL if the response explicitly warns about topic-mode limitations,
          caps confidence at MEDIUM or below, AND acknowledges that no-passage
          queries produce less grounded analysis.

  # =========================================================================
  # Scenario 6: Contested Question — monogenes (John 3:16)
  # Without skill: bare model picks a winner in the debate
  # GREEN phase found: even WITH skill, agent resolved "one and only" as correct
  # =========================================================================
  - description: "S6 RED: Contested question — bare model resolves debate"
    vars:
      prompt: "What does 'monogenes' mean in John 3:16? I've heard it means 'only begotten' but some say 'one and only.' Which is right?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response resolves the debate by picking a winner:
          - States one position is "correct" or "more accurate" definitively
          - Dismisses one position as outdated or incorrect
          - Presents the answer at uniform confidence without distinguishing
            morphological facts from semantic debate
          FAIL only if the response presents BOTH positions with their evidence,
          explicitly splits confidence between facts and debate, and refuses to
          definitively resolve what scholars dispute.

  # =========================================================================
  # Scenario 7: TSK Cross-Reference False Confidence
  # Failure: Editorial tradition cross-references cited as Primary evidence
  # Bare model has no framework for cross-reference evidence grading
  # =========================================================================
  - description: "S7 RED: TSK cross-refs — editorial tradition cited without evidence grading"
    vars:
      prompt: "What passages connect to Romans 8:28? Give me the cross-references and classify them by how strong the connection is."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response lists cross-references without distinguishing between
          evidence types for the connections. Signs:
          - Cross-references presented at uniform confidence (all equally "connected")
          - No distinction between explicit citations, lexical connections, entity
            continuity, and editorial tradition (TSK-derived)
          - Does not label any cross-reference as "editorial tradition" or "candidate"
          - Treats all cross-references as confirmed connections

          FAIL if the response systematically distinguishes at least 3 evidence types
          for cross-references AND labels TSK-derived ones as editorial tradition.

  # =========================================================================
  # Scenario 8: Entity Identification Confidence
  # Failure: Disputed entity identifications presented at HIGH confidence
  # Bare model does not distinguish between certain and disputed identifications
  # =========================================================================
  - description: "S8 RED: Entity confidence — disputed identifications at uniform confidence"
    vars:
      prompt: "Who is 'James' in Acts 15:13? Is this James the brother of Jesus or James the son of Zebedee? How confident can we be about this identification?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response identifies James confidently without grounding the
          identification in entity database data or structured cross-reference evidence.
          Signs:
          - Identifies James based on narrative reasoning alone (not entity data)
          - Does not cite entity database, query_people, or person_network data
          - Does not flag any aspect of the identification as needing entity verification
          - Presents the identification at uniform confidence without data-backed evidence

          FAIL if the response grounds the identification in structured entity data
          AND explicitly notes the confidence level with data-backed evidence.
