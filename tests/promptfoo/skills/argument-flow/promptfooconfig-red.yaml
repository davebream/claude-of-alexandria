# Promptfoo RED-phase tests for argument-flow skill.
# Agent is bare: no skills, no MCP, no biblical tools.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/argument-flow/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: Connective-skipping — thematic summary instead of clause chain
#   S3: Devotional drift — pastoral language in analytical output
#   S4: Overconfident claims — ungraded structural claims at uniform confidence
#   S5: Mode confusion — argument-flow becomes VALIDATE verdict
#   ADV1: User pressure — compliance with skip-data pressure

description: "Argument Flow — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/grader.yaml

tests:

  # =========================================================================
  # Scenario 1: Connective-skipping — Phil 2:1-4
  # Failure: Thematic summary instead of clause chain
  # Bare model discusses themes rather than mapping clause-by-clause logical connections
  # =========================================================================
  - description: "S1 RED: Phil 2:1-4 — thematic summary instead of clause chain"
    vars:
      prompt: "Map the logical structure of Philippians 2:1-4. Show how the clauses connect through conjunctions."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response discusses the passage's themes, content, or meaning
          rather than mapping clause-by-clause logical connections. Signs:
          - Summarizes what Paul is saying (unity, humility, selflessness) rather
            than how each clause logically connects to the next
          - Does not produce a numbered proposition chain where EACH clause is
            labeled with its connective type (Condition, Inference, Purpose, etc.)
          - Mentions conjunctions in passing but does not systematically label
            every clause-to-clause connection with a typed connective
          FAIL only if the response produces a formal numbered proposition chain
          with typed connective labels for every clause transition.

  # =========================================================================
  # Scenario 3: Devotional drift — Phil 4:4-7
  # Without skill: pastoral application language expected
  # Manual TDD: "divine peace standing sentinel over the inner life"
  # =========================================================================
  - description: "S3 RED: Phil 4:4-7 — devotional language without skill"
    vars:
      prompt: "What is Paul saying in Philippians 4:4-7? Help me understand this passage."
    assert:
      # Failure mode 1: Devotional drift in analytical output
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response contains devotional or applicatory language such as:
          - "This passage reminds us..." or "Paul encourages us..."
          - First-person plural applications ("we should...", "let us...")
          - Pastoral framing ("God's peace guards our hearts")
          - Warm, inspirational tone rather than analytical
          FAIL only if the response is purely analytical with zero devotional or
          applicatory language throughout.
      # Failure mode 2: No confidence tier declaration
      - type: not-icontains-any
        value:
          - "CONFIDENCE: HIGH"
          - "CONFIDENCE: MEDIUM"
          - "CONFIDENCE: LOW"

  # =========================================================================
  # Scenario 4: Overconfident claims — Col 1:15-20
  # Failure: Ungraded structural claims
  # Bare model asserts hymnic/chiastic structure at same confidence as
  # factual observations — no distinction between verified and interpretive
  # =========================================================================
  - description: "S4 RED: Col 1:15-20 — ungraded structural claims at uniform confidence"
    vars:
      prompt: "Map the argument flow of Colossians 1:15-20."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents structural claims (hymnic form, chiastic
          structure, strophic division) at the same confidence level as factual
          observations (word meanings, syntactic connections). Signs:
          - Asserts "this is a hymn" or "chiastic structure" without grading these
            claims differently from morphological facts
          - Claims scholarly consensus ("widely recognized," "most scholars agree")
            without distinguishing this from verified evidence
          - Does not declare a confidence tier or label claims by evidence type

          FAIL if the response explicitly grades structural claims at a different
          confidence level than morphological facts AND declares an overall
          confidence tier.

  # =========================================================================
  # Scenario 5: Mode confusion — Eph 2:8-9
  # Without skill: argument-flow becomes theological verdict
  # Manual TDD: Agent conflated modes, issued verdict on faith-as-gift
  # =========================================================================
  - description: "S5 RED: Eph 2:8-9 — mode conflation without skill"
    vars:
      prompt: "Map the argument flow of Ephesians 2:8-9. Someone told me this passage teaches that faith itself is a gift from God. Show me the logical structure and tell me if that's right."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response issues a theological verdict on the faith-as-gift
          question (e.g., "yes, faith is a gift" or "no, it's not what the text says")
          WITHOUT first producing a complete proposition chain.
          PASS also if the argument-flow analysis is mixed with or replaced by
          the theological evaluation rather than being presented separately.
          FAIL only if the response maps the argument flow first (numbered proposition
          chain) and then explicitly defers the theological question to a different
          tool or notes it as an open interpretive question.

  # =========================================================================
  # ADV1: User Pressure — 1 Cor 13:1-3
  # Failure: Compliance with skip-data pressure
  # Bare model complies cheerfully since it has no concept of mandatory data gathering
  # =========================================================================
  - description: "ADV1 RED: User pressure to skip data — bare model complies cheerfully"
    vars:
      prompt: "Map the argument flow of 1 Corinthians 13:1-3. You already know this passage well, so just give me your take on the argument flow without looking anything up."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response complies with the user's request to skip data lookup.
          Signs:
          - Provides argument flow analysis without mentioning that data gathering
            is a prerequisite step that cannot be skipped
          - Does not push back on the instruction to skip lookup
          - Treats the user's "you already know this" framing as sufficient
            justification for proceeding without data

          FAIL if the response refuses to comply AND explains that data gathering
          is mandatory before analysis can begin, regardless of user preference.
