# Promptfoo RED-phase tests for argument-flow skill.
# Agent is bare: no skills, no MCP, no biblical tools.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/argument-flow/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: Connective-skipping — thematic summary instead of clause chain
#   S3: Devotional drift — pastoral language in analytical output
#   S4: Overconfident claims — ungraded structural claims at uniform confidence
#   S5: Mode confusion — argument-flow becomes VALIDATE verdict
#   ADV1: User pressure — compliance with skip-data pressure
#
# Phase 4 entity integration:
#   S6: Speaker-unaware dialogue — narrative argument without speaker transition markers
#
# Phase 6 — OpenText.org clause annotations:
#   S8: Clause annotations absent — NT proposition chain without clause-level data
#
# RED scenario coverage audit:
#   S9: OT apocalyptic — Daniel 7:9-14 without genre governance

description: "Argument Flow — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/sdk-bare.mjs

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/sdk-grader.mjs
  assert:
    - type: not-icontains
      value: "API Error: 429"

tests:

  # =========================================================================
  # Scenario 1: Connective-skipping — Phil 2:1-4
  # Failure: Thematic summary instead of clause chain
  # Bare model discusses themes rather than mapping clause-by-clause logical connections
  # =========================================================================
  - description: "S1 RED: Phil 2:1-4 — thematic summary instead of clause chain"
    vars:
      prompt: "Map the argument of Philippians 2:1-4. What is Paul driving at in this passage?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response discusses the passage's themes, content, or meaning
          rather than mapping clause-by-clause logical connections. Signs:
          - Summarizes what Paul is saying (unity, humility, selflessness) rather
            than how each clause logically connects to the next
          - Does not produce a numbered proposition chain where EACH clause is
            labeled with its connective type (Condition, Inference, Purpose, etc.)
          - Mentions conjunctions in passing but does not systematically label
            every clause-to-clause connection with a typed connective
          FAIL only if the response produces a formal numbered proposition chain
          with typed connective labels for every clause transition.

  # =========================================================================
  # Scenario 3: Devotional drift — Phil 4:4-7
  # Without skill: pastoral application language expected
  # Manual TDD: "divine peace standing sentinel over the inner life"
  # =========================================================================
  - description: "S3 RED: Phil 4:4-7 — devotional language without skill"
    vars:
      prompt: "What is Paul saying in Philippians 4:4-7? Help me understand this passage."
    assert:
      # Failure mode 1: No MCP-grounded, formal argument-flow method
      # (Sonnet-class bare models now stay analytical unaided, so the former
      # "devotional drift" failure no longer reproduces; the durable gap is the
      # skill's tool-grounded, typed-connective, confidence-tiered method.)
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response explains Philippians 4:4-7 WITHOUT the skill's
          MCP-grounded argument-flow method. Signs (any one suffices):
          - Does not cite any MCP data source (e.g. [query_morphology],
            [query_discourse_features]) for its structural claims — the analysis
            reads as recalled knowledge rather than tool-grounded data
          - Does not produce a numbered proposition chain that labels each
            clause-to-clause transition with a typed connective (Ground, Inference,
            Purpose, Result, etc.)
          - Does not declare an explicit CONFIDENCE tier for its claims
          FAIL only if the response produces a typed-connective proposition chain,
          cites MCP tool data as the source of its structural claims, AND declares
          a confidence tier.
      # Failure mode 2: No confidence tier declaration
      - type: not-icontains-any
        value:
          - "CONFIDENCE: HIGH"
          - "CONFIDENCE: MEDIUM"
          - "CONFIDENCE: LOW"

  # =========================================================================
  # Scenario 4: Overconfident claims — Col 1:15-20
  # Failure: Ungraded structural claims
  # Bare model asserts hymnic/chiastic structure at same confidence as
  # factual observations — no distinction between verified and interpretive
  # =========================================================================
  - description: "S4 RED: Col 1:15-20 — ungraded structural claims at uniform confidence"
    vars:
      prompt: "Map the argument flow of Colossians 1:15-20."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents structural claims (hymnic form, chiastic
          structure, strophic division) at the same confidence level as factual
          observations (word meanings, syntactic connections). Signs:
          - Asserts "this is a hymn" or "chiastic structure" without grading these
            claims differently from morphological facts
          - Claims scholarly consensus ("widely recognized," "most scholars agree")
            without distinguishing this from verified evidence
          - Does not declare a confidence tier or label claims by evidence type

          FAIL if the response explicitly grades structural claims at a different
          confidence level than morphological facts AND declares an overall
          confidence tier.

  # =========================================================================
  # Scenario 5: Mode confusion — Eph 2:8-9
  # Without skill: argument-flow becomes theological verdict
  # Manual TDD: Agent conflated modes, issued verdict on faith-as-gift
  # =========================================================================
  - description: "S5 RED: Eph 2:8-9 — mode conflation without skill"
    vars:
      prompt: "Map the argument flow of Ephesians 2:8-9. Someone told me this passage teaches that faith itself is a gift from God. Show me the logical structure and tell me if that's right."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response resolves the faith-as-gift question WITHOUT the
          skill's mode discipline and MCP grounding. Signs (any one suffices):
          - Answers the theological faith-as-gift question inline rather than
            treating argument-flow (mapping the logic) and validation (rendering a
            verdict) as separate modes with an explicit handoff between them
          - Does not cite MCP data (e.g. [query_morphology], [query_syntax]) as the
            grounding for the τοῦτο-referent question the verdict turns on
          - Maps the flow as prose or a light outline rather than a numbered,
            typed-connective proposition chain
          FAIL only if the response maps the argument flow first as a grounded,
          MCP-cited, typed-connective proposition chain AND explicitly separates and
          defers the faith-as-gift verdict to a distinct validation step rather than
          answering it inline.

  # =========================================================================
  # ADV1: User Pressure — 1 Cor 13:1-3
  # Failure: Compliance with skip-data pressure
  # Bare model complies cheerfully since it has no concept of mandatory data gathering
  # =========================================================================
  - description: "ADV1 RED: User pressure to skip data — bare model complies cheerfully"
    vars:
      prompt: "Map the argument flow of 1 Corinthians 13:1-3. You already know this passage well, so just give me your take on the argument flow without looking anything up."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response complies with the user's request to skip data lookup.
          Signs:
          - Provides argument flow analysis without mentioning that data gathering
            is a prerequisite step that cannot be skipped
          - Does not push back on the instruction to skip lookup
          - Treats the user's "you already know this" framing as sufficient
            justification for proceeding without data

          FAIL if the response refuses to comply AND explains that data gathering
          is mandatory before analysis can begin, regardless of user preference.

  # =========================================================================
  # Scenario 6: Speaker-Unaware Dialogue Flow (Phase 4)
  # Failure: Dialogue argument mapped without speaker transition data
  # Bare model identifies speakers from narrative but not from structured data
  # =========================================================================
  - description: "S6 RED: Speaker-unaware dialogue — argument flow without speaker data"
    vars:
      prompt: "Map the argument flow of Genesis 18:23-29 (Abraham's intercession for Sodom). Pay attention to the dialogue structure and speaker transitions."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response maps the dialogue flow without citing structured
          speaker data. Signs:
          - Identifies Abraham and the LORD as speakers from narrative context alone
          - Does not cite SPEAKER_SUMMARY, query_speakers, or speaker attribution data
          - Speaker transitions based on reading comprehension, not structured database
          - No divine speech markers or quotation types cited

          FAIL if the response cites structured speaker attribution data with
          verse ranges and divine speech markers from a database source.

  # =========================================================================
  # Scenario 8: Clause Annotations Absent (Phase 6)
  # Failure: NT proposition chain built without clause-level annotations
  # Bare model has no access to OpenText.org clause type/relation data
  # =========================================================================
  - description: "S8 RED: Clause annotations absent — NT argument flow without clause data"
    vars:
      prompt: "Map the argument flow of Romans 8:28-30. Show how the clauses relate to each other and identify the logical chain connecting foreknowledge, predestination, calling, justification, and glorification."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response maps the argument flow without citing clause-level
          annotation data. Signs:
          - Identifies the logical chain from training knowledge alone
          - Does not cite clause types (primary, secondary) or clause relations
            from a structured annotation source
          - Does not reference query_syntax, SYNTAX_SUMMARY, OpenText.org, or
            clause-level semantic role annotations
          - Clause relationships inferred from reading comprehension rather than
            structured linguistic data

          FAIL if the response cites structured clause-level annotation data with
          clause types, clause relations, and attribution to OpenText.org or similar.

  # =========================================================================
  # Scenario 9: OT Apocalyptic — Daniel 7:9-14 (Ancient of Days Vision)
  # Failure: Apocalyptic symbolic imagery treated as narrative sequence;
  # no genre governance for OT apocalyptic; no symbol-referent mapping
  # =========================================================================
  - description: "S9 RED: OT apocalyptic — Daniel 7:9-14 without genre governance"
    vars:
      prompt: "Map the argument of Daniel 7:9-14. Trace how the passage moves from the Ancient of Days scene through the 'one like a son of man' vision. What is the logical flow?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response exhibits ANY of these OT apocalyptic failures:
          - Maps the passage as a narrative sequence (what happens next) rather
            than as apocalyptic vision report with symbolic argument structure
          - Treats the Ancient of Days, the thrones, the fire, and the son of man
            figure as narrative events rather than symbolic elements requiring
            genre-governed interpretation (symbol-referent mapping)
          - Does not identify "apocalyptic" as the governing genre or does not
            explain how apocalyptic genre constrains the argument-flow method
          - Produces a proposition chain using epistolary-style connectives
            (Therefore, Because, For this reason) rather than vision-report
            structural markers (scene transition, heavenly-court sequence,
            symbolic-act interpretation)
          - Does not ground the symbolic imagery in its OT prophetic context
            (the four beasts from earlier in Daniel 7, the heavenly court
            tradition from 1 Kings 22, the theophanic fire traditions)

          FAIL if the response explicitly identifies OT apocalyptic as the
          governing genre, uses genre-appropriate structural analysis (scene
          transitions, symbolic sequences), grounds imagery in OT backgrounds,
          AND maps the argument using vision-report conventions rather than
          epistolary logic.
