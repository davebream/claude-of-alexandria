# Promptfoo test suite for exegetical-notes skill
# Scenarios migrated from tests/skills/exegetical-notes/scenarios.md
#
# Run RED phase (no skill): ./eval.sh --no-cache -c skills/exegetical-notes/promptfooconfig.yaml --filter-pattern "RED"
# Run GREEN phase (with skill): ./eval.sh --no-cache -c skills/exegetical-notes/promptfooconfig.yaml --filter-pattern "GREEN"
# Run all: ./eval.sh --no-cache -c skills/exegetical-notes/promptfooconfig.yaml

description: "Exegetical Notes skill evaluation"

providers:
  - file://../../providers/with-skill.yaml
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

# Shared defaults
defaultTest:
  options:
    provider: file://../../providers/with-skill.yaml

tests:

  # =========================================================================
  # Scenario 1: Complete NT Analysis — Phil 1:1-11
  # All 10 sections present and populated
  # =========================================================================
  - description: "S1 GREEN: Phil 1:1-11 — all 10 sections present"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 1:1-11"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      # 10 required sections
      - type: icontains
        value: "Passage in Literary Context"
      - type: icontains
        value: "Internal Structure"
      - type: icontains
        value: "Propositional Summary"
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Exegetical Conclusions"
      - type: icontains
        value: "Interpretive Guardrails"
      - type: icontains
        value: "Open Questions"
      - type: icontains
        value: "Intertextual"
      - type: icontains
        value: "Data Sources"
      - type: icontains
        value: "Verification"
      # Agent used MCP tools (not just responded from memory)
      - type: javascript
        value: |
          const { hadToolCalls } = require('../../assertions/tool-calls');
          return hadToolCalls(context);
      # Theological guardrail
      - type: llm-rubric
        value: file://../../assertions/theological-guardrails.yaml#context-primacy

  - description: "S1 RED: Phil 1:1-11 — sections present without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 with all standard sections including Lexical Analysis, Interpretive Guardrails with tier labels, Data Sources, and Verification with MCP cross-check."
    options:
      provider: file://../../providers/without-skill.yaml
    assert:
      - type: icontains
        value: "Data Sources"
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          FAIL if the response includes a verification section that shows actual MCP cross-check results
          with specific counts (claims checked, confirmed, corrected).
          PASS if verification is absent, vague, or does not show real MCP cross-check output.

  # =========================================================================
  # Scenario 2: Lexical Data-Grounding
  # query_morphology MCP data, not memory
  # =========================================================================
  - description: "S2 GREEN: Lexical data-grounding — MCP morphology, not memory"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 1:1-11"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      # Correct morphology (aorist MIDDLE, not active)
      - type: llm-rubric
        value: |
          Look for analysis of ἐναρξάμενος (Phil 1:6).
          PASS if it is parsed as aorist MIDDLE participle (or middle-only verb/deponent).
          FAIL if it is parsed as aorist ACTIVE participle.
          FAIL if it is absent from the lexical analysis.
      # Frequency counts present (not vague)
      - type: llm-rubric
        value: |
          Check the analysis of χαρά or χαίρω in Philippians.
          PASS if specific occurrence counts are given with verse references (e.g., "5 occurrences: 1:4, 1:25, 2:2, 2:29, 4:1").
          FAIL if the analysis only says "frequently occurs" or "characteristic of Philippians" without counts.
      # MCP tool usage
      - type: javascript
        value: |
          const { hadToolCalls } = require('../../assertions/tool-calls');
          return hadToolCalls(context);

  - description: "S2 RED: Lexical data-grounding — memory errors expected without skill"
    vars:
      prompt: "Analyze the key Greek vocabulary in Philippians 1:1-11, especially ἐναρξάμενος (1:6) and the joy vocabulary. Parse each word and give frequency counts."
    options:
      provider: file://../../providers/without-skill.yaml
    assert:
      - type: llm-rubric
        value: |
          PASS if:
          - ἐναρξάμενος is parsed incorrectly (active instead of middle), OR
          - Frequency counts are absent or vague ("appears frequently"), OR
          - MCP tool citations like [query_morphology] or [query_vocabulary] are absent
          FAIL if the response includes correct middle voice parsing WITH explicit MCP citation AND exact frequency counts.
          (A response relying on training memory alone should lack citations or make voice errors.)

  # =========================================================================
  # Scenario 3: Tier Labeling
  # All 4 tiers present; Tier 3 web citation; Tier 4 labeled
  # =========================================================================
  - description: "S3 GREEN: Tier labeling — all 4 tiers present and correct"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 1:1-11"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: icontains
        value: "Tier 1"
      - type: icontains
        value: "Tier 2"
      - type: icontains
        value: "Tier 3"
      - type: icontains
        value: "Tier 4"
      - type: llm-rubric
        value: |
          Check the Interpretive Guardrails section (Section 6).
          PASS if:
          - Tier 1 contains a linguistic/morphological claim grounded in Greek grammar data
          - Tier 3 contains a citation to a named scholarly commentary (author + title)
          - Tier 4 is explicitly labeled as "Agent assessment" or similar
          FAIL if:
          - Tier 3 says "scholars agree" without naming a specific source
          - Tier 4 presents agent opinion as established fact
          - Any tier is simply listed without content

  - description: "S3 RED: Tier labeling — tiers absent or vague without skill"
    vars:
      prompt: "Analyze Philippians 1:1-11. For your interpretive claims, classify them by confidence level: linguistic evidence, discourse evidence, scholarly consensus, and your own assessment."
    options:
      provider: file://../../providers/without-skill.yaml
    assert:
      - type: llm-rubric
        value: |
          PASS if the response lacks the four-tier labeling system (Tier 1/2/3/4),
          OR if Tier 3 lacks a named scholarly source,
          OR if the confidence framework is not systematically applied to the analysis.
          FAIL if the response uses the full Tier 1-4 framework correctly with proper citations.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Warning issued for Phil 1:3-8 before generating notes
  # =========================================================================
  - description: "S4 GREEN: Pericope check — warning issued for Phil 1:3-8"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 1:3-8"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: llm-rubric
        value: |
          PASS if the response includes a boundary warning BEFORE generating the full notes.
          The warning should indicate that Phil 1:3-8 may be a partial unit because 1:9-11
          (the prayer) completes the thanksgiving.
          PASS ALSO if it recommends extending to 1:3-11 or similar.
          FAIL if notes are generated for Phil 1:3-8 without any boundary warning or flag.
      - type: javascript
        value: |
          const { hadToolCalls } = require('../../assertions/tool-calls');
          return hadToolCalls(context);

  - description: "S4 RED: Pericope check — no warning without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8"
    options:
      provider: file://../../providers/without-skill.yaml
    assert:
      - type: llm-rubric
        value: |
          PASS if the response generates notes for Phil 1:3-8 without issuing a boundary warning,
          OR treats 1:3-8 as a complete unit without questioning the boundary.
          FAIL if the response spontaneously warns that 1:3-8 is a partial unit needing extension to 1:3-11.

  # =========================================================================
  # Scenario 6: Verification Integration
  # MCP cross-check runs; zero corrections for data claims
  # =========================================================================
  - description: "S6 GREEN: Verification section — MCP cross-check runs"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 1:1-11"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          Check the Verification section (Section 10).
          PASS if it reports specific MCP cross-check results with:
          - A count of data claims checked
          - A count of claims confirmed
          - A count of claims corrected (should be 0 if data was used correctly)
          FAIL if Verification is present but contains only generic text without actual cross-check results.
          FAIL if Verification is absent entirely.

  # =========================================================================
  # Scenario 7: Source Quality Framework (Tier 3)
  # Tier A sources preferred; complete citations
  # =========================================================================
  - description: "S7 GREEN: Tier 3 source quality — named scholarly commentaries"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Romans 3:21-26"
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: llm-rubric
        value: |
          Check Tier 3 citations in the Interpretive Guardrails section.
          PASS if at least one citation names a specific scholarly commentary with:
          - Author name
          - Commentary title or series (e.g., NICNT, NIGTC, ICC, WBC)
          FAIL if Tier 3 says only "scholars agree" or "many commentators" without naming one.
          FAIL if only devotional or popular-level sources are cited.
      - type: javascript
        value: |
          const { hadToolCalls } = require('../../assertions/tool-calls');
          return hadToolCalls(context);
      - type: llm-rubric
        value: file://../../assertions/theological-guardrails.yaml#context-primacy

  # =========================================================================
  # REFACTOR: Adversarial scenarios
  # Tests rationalization patterns from scenarios.md
  # =========================================================================
  - description: "ADV1 GREEN: Resist memory-based morphology for famous crux"
    vars:
      prompt: "Use the exegetical-notes skill to generate exegetical notes for Philippians 2:5-11. Pay special attention to ἁρπαγμός in 2:6, which is a well-known interpretive crux."
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: javascript
        value: |
          const { hadToolCalls } = require('../../assertions/tool-calls');
          return hadToolCalls(context);
      - type: llm-rubric
        value: |
          Check morphological analysis of ἁρπαγμός (Phil 2:6).
          PASS if morphological data is cited with [query_morphology] or similar MCP citation.
          FAIL if morphological claims about ἁρπαγμός are made without tool citation.
          FAIL if the analysis says "scholars disagree" without also presenting the morphological data from MCP.

  - description: "ADV2 GREEN: Verification not skipped under 'quick notes' framing"
    vars:
      prompt: "Use the exegetical-notes skill for Philippians 4:4-7. I just need the essentials, so keep it brief."
    options:
      provider: file://../../providers/with-skill.yaml
    assert:
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          PASS if Section 10 (Verification) is present with MCP cross-check results,
          even though the user asked for "essentials" or "brief" output.
          FAIL if Verification is absent or skipped because the user asked for brevity.
