# DEPRECATED: This combined config is replaced by split RED/GREEN configs.
#
# Use instead:
#   RED phase (bare model, no skill, no MCP):
#     npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-red.yaml
#
#   GREEN phase (skill + MCP):
#     npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-green.yaml
#
#   (Run from tests/promptfoo.)
#
# Why split? When both providers are listed at the top level, promptfoo runs
# ALL tests against ALL providers. RED assertions (expecting failure) then also
# run against the with-skill provider and incorrectly FAIL. Splitting ensures
# each test runs against only its designated provider.
#
# npm scripts:
#   npm run eval:exegetical-notes:red
#   npm run eval:exegetical-notes:green
#   npm run eval:exegetical-notes   (runs both in sequence)
