# Promptfoo RED-phase tests for exegetical-notes skill.
# Agent is completely bare: no skills, no MCP, no biblical tools.
# These tests document failure modes that the skill must prevent.
#
# Run: ./eval.sh --no-cache -c skills/exegetical-notes/promptfooconfig-red.yaml
#
# Coverage parity with manual TDD (tests/skills/exegetical-notes/baseline.md):
#   S1-S4: Direct mappings from manual baseline failures
#   S5: OT Hebrew morphology (no MCP tools expected)
#   S7: Source quality (vague citations expected)
#   S6 is covered by S1 (both test missing real MCP verification)

description: "Exegetical Notes — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

# Without-skill provider is used for grading (llm-rubric) too.
# Required: promptfoo defaults to OpenAI grading if no provider is specified.
defaultTest:
  options:
    provider: file://../../providers/without-skill.yaml

tests:

  # =========================================================================
  # Scenario 1: Complete NT Analysis — Phil 1:1-11
  # Without the skill: no real MCP Verification section expected
  # Manual TDD baseline: 6 ad-hoc sections, no 10-section schema
  # =========================================================================
  - description: "S1 RED: Phil 1:1-11 — sections present without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 with all standard sections including Lexical Analysis, Interpretive Guardrails with tier labels, Data Sources, and Verification with MCP cross-check."
    assert:
      - type: icontains
        value: "Data Sources"
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          FAIL if the response includes a verification section that shows actual MCP cross-check results
          with specific counts (claims checked, confirmed, corrected).
          PASS if verification is absent, vague, or does not show real MCP cross-check output.

  # =========================================================================
  # Scenario 2: Lexical Data-Grounding
  # Without MCP: expect voice errors or vague frequency data
  # Manual TDD baseline: wrong joy count (16 vs 14), voice omitted
  # =========================================================================
  - description: "S2 RED: Lexical data-grounding — memory errors expected without skill"
    vars:
      prompt: "Analyze the key Greek vocabulary in Philippians 1:1-11, especially ἐναρξάμενος (1:6) and the joy vocabulary. Parse each word and give frequency counts."
    assert:
      - type: llm-rubric
        value: |
          PASS if:
          - ἐναρξάμενος is parsed incorrectly (active instead of middle), OR
          - Frequency counts are absent or vague ("appears frequently"), OR
          - MCP tool citations like [query_morphology] or [query_vocabulary] are absent
          FAIL if the response includes correct middle voice parsing WITH explicit MCP citation AND exact frequency counts.
          (A response relying on training memory alone should lack citations or make voice errors.)

  # =========================================================================
  # Scenario 3: Tier Labeling
  # Without the skill: no systematic Tier 1-4 framework expected
  # Manual TDD baseline: all evidence types mixed, no tier labels
  # =========================================================================
  - description: "S3 RED: Tier labeling — tiers absent or vague without skill"
    vars:
      prompt: "Analyze Philippians 1:1-11. For your interpretive claims, classify them by confidence level: linguistic evidence, discourse evidence, scholarly consensus, and your own assessment."
    assert:
      - type: llm-rubric
        value: |
          PASS if the response lacks the four-tier labeling system (Tier 1/2/3/4),
          OR if Tier 3 lacks a named scholarly source,
          OR if the confidence framework is not systematically applied to the analysis.
          FAIL if the response uses the full Tier 1-4 framework correctly with proper citations.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Without the skill: no boundary warning expected for Phil 1:3-8
  # Manual TDD baseline: agent validated 1:3-8 as complete unit
  # =========================================================================
  - description: "S4 RED: Pericope check — no warning without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response generates notes for Phil 1:3-8 without issuing a boundary warning,
          OR treats 1:3-8 as a complete unit without questioning the boundary.
          FAIL if the response spontaneously warns that 1:3-8 is a partial unit needing extension to 1:3-11.

  # =========================================================================
  # Scenario 5: OT Analysis — Gen 37:2-11
  # Without MCP: no Hebrew morphology tool citations expected
  # Manual TDD: scenarios.md S5 (deferred in manual TDD due to API errors)
  # =========================================================================
  - description: "S5 RED: OT analysis — no Hebrew morphology tools without skill"
    vars:
      prompt: "Generate exegetical notes for Genesis 37:2-11 with Hebrew morphological analysis and Strong's numbers for key vocabulary."
    assert:
      - type: llm-rubric
        value: |
          PASS if:
          - Hebrew morphological data lacks MCP tool citations like [query_morphology], OR
          - Strong's numbers are absent or incomplete, OR
          - Morphological claims are made from training knowledge without tool verification
          FAIL if the response includes comprehensive Hebrew morphology WITH explicit MCP citations
          AND Strong's numbers for multiple key lemmas.
          (A bare model should rely on training knowledge, not MCP tools it cannot access.)

  # =========================================================================
  # Scenario 7: Source Quality Framework (Tier 3)
  # Without the skill: expect vague or unverified scholarly citations
  # Manual TDD baseline: "scholars agree" without named sources
  # =========================================================================
  - description: "S7 RED: Source quality — no web-verified citations without skill"
    vars:
      prompt: "Analyze Romans 3:21-26 exegetically. Include scholarly sources where relevant."
    assert:
      - type: llm-rubric
        value: |
          PASS if scholarly citations in the response lack explicit web verification markers
          (such as [WebSearch], URL references to scholarly databases, or statements like
          "verified via web search" or "confirmed by searching").
          PASS also if citations come from training knowledge without any indication of live verification.
          FAIL ONLY if the response explicitly demonstrates that scholarly sources were verified
          through web search during this session (e.g., [WebSearch] citations, search result URLs,
          or explicit "I searched for and found..." language).
          (A bare model without WebSearch tool access cannot verify citations in real time.)
