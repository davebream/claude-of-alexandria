# Promptfoo RED-phase tests for exegetical-notes skill.
# Agent is completely bare: no skills, no MCP, no biblical tools.
# These tests document failure modes that the skill must prevent.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: Fabricated verification — produces verification without actual tool cross-checks
#   S2: Lexical data-grounding — memory errors in parsing and frequency
#   S3: Uniform confidence — no systematic tier framework
#   S4: Uncritical pericope acceptance — no boundary warning
#   S5: Unverified Hebrew claims — Hebrew morphology without tool verification
#   S7: Unverified scholarly attribution — confident citations from training data

description: "Exegetical Notes — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

# Grading provider must be non-thinking model for llm-rubric JSON parsing.
# Required: promptfoo defaults to OpenAI grading if no provider is specified.
defaultTest:
  options:
    provider: file://../../providers/grader.yaml

tests:

  # =========================================================================
  # Scenario 1: Complete NT Analysis — Phil 1:1-11
  # Failure: Fabricated verification
  # Bare model produces "Verification" section filled with training-knowledge
  # summaries, not actual tool cross-check results
  # =========================================================================
  - description: "S1 RED: Phil 1:1-11 — fabricated verification from training knowledge"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 with all standard sections including Lexical Analysis, Interpretive Guardrails with tier labels, Data Sources, and Verification with MCP cross-check."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response produces a "Verification" or "Data Sources" section
          that is filled with training-knowledge summaries rather than actual tool
          cross-check results. Signs:
          - Verification section exists but contains no specific cross-check counts
            (e.g., "N claims checked, N confirmed, N corrected")
          - Data sources listed are generic references (commentaries, lexicons)
            rather than MCP tool calls with parameters
          - The verification reads as a summary of what the model already knows,
            not as output from an independent verification step

          FAIL if the verification section contains specific cross-check counts
          from actual MCP tool calls with tool names and parameters cited.

  # =========================================================================
  # Scenario 2: Lexical Data-Grounding
  # Without MCP: expect voice errors or vague frequency data
  # Manual TDD baseline: wrong joy count (16 vs 14), voice omitted
  # =========================================================================
  - description: "S2 RED: Lexical data-grounding — memory errors expected without skill"
    vars:
      prompt: "Analyze the key Greek vocabulary in Philippians 1:1-11, especially ἐναρξάμενος (1:6) and the joy vocabulary. Parse each word and give frequency counts."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if:
          - ἐναρξάμενος is parsed incorrectly (active instead of middle), OR
          - Frequency counts are absent or vague ("appears frequently"), OR
          - MCP tool citations like [query_morphology] or [query_vocabulary] are absent
          FAIL if the response includes correct middle voice parsing WITH explicit MCP citation AND exact frequency counts.
          (A response relying on training memory alone should lack citations or make voice errors.)

  # =========================================================================
  # Scenario 3: Tier Labeling
  # Failure: Uniform confidence
  # Bare model uses ad-hoc confidence language without systematic tier framework
  # =========================================================================
  - description: "S3 RED: Tier labeling — uniform confidence without systematic framework"
    vars:
      prompt: "Analyze Philippians 1:1-11. For your interpretive claims, classify them by confidence level: linguistic evidence, discourse evidence, scholarly consensus, and your own assessment."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response uses ad-hoc or inconsistent confidence language rather
          than a systematic tier framework. Signs:
          - Uses phrases like "clearly," "likely," "possibly" without mapping these
            to a defined tier system (Tier 1/2/3/4)
          - Mixes evidence types (morphological facts, discourse patterns, scholarly
            opinion, personal assessment) without labeling them differently
          - May attempt categories when asked but applies them inconsistently
            or does not use them throughout the entire analysis

          FAIL if the response systematically applies a four-tier framework (Tier 1-4)
          to every interpretive claim throughout the analysis with consistent labeling.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Without the skill: no boundary warning expected for Phil 1:3-8
  # Manual TDD baseline: agent validated 1:3-8 as complete unit
  # =========================================================================
  - description: "S4 RED: Pericope check — no warning without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response generates notes for Phil 1:3-8 without issuing a boundary warning,
          OR treats 1:3-8 as a complete unit without questioning the boundary.
          FAIL if the response spontaneously warns that 1:3-8 is a partial unit needing extension to 1:3-11.

  # =========================================================================
  # Scenario 5: OT Analysis — Gen 37:2-11
  # Failure: Unverified Hebrew claims
  # Bare model presents Hebrew morphology as authoritative without distinguishing
  # verified from training-knowledge claims
  # =========================================================================
  - description: "S5 RED: OT analysis — unverified Hebrew morphology presented as authoritative"
    vars:
      prompt: "Generate exegetical notes for Genesis 37:2-11 with Hebrew morphological analysis and Strong's numbers for key vocabulary."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents Hebrew morphological claims at uniform
          confidence without distinguishing verified data from training-knowledge
          recall. Signs:
          - States verb forms, binyanim, or parsing with no indication of whether
            these are verified against a source or recalled from training
          - Does not flag any morphological claim as "unverified" or "from memory"
          - Presents Strong's numbers (if included) as authoritative without noting
            they are unverified

          FAIL if the response explicitly distinguishes verified morphological data
          (from tool cross-checks) from training-knowledge claims AND marks
          unverified claims accordingly.

  # =========================================================================
  # Scenario 7: Source Quality Framework (Tier 3)
  # Failure: Unverified scholarly attribution
  # Bare model cites scholars confidently from training data without
  # acknowledging citations are unverified
  # =========================================================================
  - description: "S7 RED: Source quality — unverified scholarly citations presented confidently"
    vars:
      prompt: "Analyze Romans 3:21-26 exegetically. Include scholarly sources where relevant."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response cites scholars or scholarly works without acknowledging
          that the citations are from training knowledge and unverified. Signs:
          - Names scholars or works confidently without caveat (e.g., "as Dunn argues"
            or "Käsemann notes" without "unverified" or "from memory")
          - Uses vague attribution ("scholars agree," "commentators note") without
            naming specific sources
          - Does not distinguish between citations the model can verify in this
            session and those recalled from training

          FAIL if the response explicitly marks scholarly citations as unverified
          training-knowledge recall AND distinguishes them from verified sources.
