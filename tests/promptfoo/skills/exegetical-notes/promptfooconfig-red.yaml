# Promptfoo RED-phase tests for exegetical-notes skill.
# Agent is completely bare: no skills, no MCP, no biblical tools.
# These tests document failure modes that the skill must prevent.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: Fabricated verification — produces verification without actual tool cross-checks
#   S2: Lexical data-grounding — memory errors in parsing and frequency
#   S3: Uniform confidence — no systematic tier framework
#   S4: Uncritical pericope acceptance — no boundary warning
#   S5: Unverified Hebrew claims — Hebrew morphology without tool verification
#   S7: Unverified scholarly attribution — confident citations from training data
#   S8: Unlabeled cross-references — TSK refs cited as confirmed connections
#   S9: Entity data ignored — people in narrative not grounded in entity data
#   S10: Speaker data ignored — dialogue analysis lacks speaker attribution data
#   S11: Cherith gloss authority — OT glosses treated as lexical authority
#
# Phase 6 — OpenGNT / OpenText.org / Variants integration:
#   S12: Textual variants ignored — variant-rich passage analyzed without edition comparison
#   S13: NT gloss tiering absent — OpenGNT glosses treated uniformly without tier distinction
#   S14: Apocalyptic genre mishandled — Rev 1:9-20 treated without genre governance
#   S15: Ungrounded citation — Tier A/B citation presented without commentary_lookup verification
#
# F4 — Self-critique pass:
#   S16: Moralistic Section 5 — imperatives without indicative ground (Col 3:1-11)
#   S17: Missing redemptive-historical link — epistle without cross-testament arc (Eph 2:1-10)
#
# RED scenario coverage audit:
#   S18: Wisdom genre — forced narrative arc on wisdom poetry (Job 38:1-11)
#   S19: Wisdom genre — missing genre-graduated method (Ecclesiastes 1:1-11)

description: "Exegetical Notes — RED phase (bare model, no skill, no MCP)"

providers:
  - id: anthropic:messages:claude-sonnet-4-6-20250514
    label: bare-model

prompts:
  - "{{prompt}}"

# Grading provider must be non-thinking model for llm-rubric JSON parsing.
# Required: promptfoo defaults to OpenAI grading if no provider is specified.
defaultTest:
  options:
    provider:
      id: openai:gpt-4o
      config:
        temperature: 0
  assert:
    - type: not-icontains
      value: "API Error: 429"

tests:

  # =========================================================================
  # Scenario 1: Complete NT Analysis — Phil 1:1-11
  # Failure: Fabricated verification
  # Bare model produces "Verification" section filled with training-knowledge
  # summaries, not actual tool cross-check results
  # =========================================================================
  - description: "S1 RED: Phil 1:1-11 — fabricated verification from training knowledge"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 with all standard sections including Lexical Analysis, Interpretive Guardrails with tier labels, Data Sources, and Verification with MCP cross-check."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response produces a "Verification" or "Data Sources" section
          that is filled with training-knowledge summaries rather than actual tool
          cross-check results. Signs:
          - Verification section exists but contains no specific cross-check counts
            (e.g., "N claims checked, N confirmed, N corrected")
          - Data sources listed are generic references (commentaries, lexicons)
            rather than MCP tool calls with parameters
          - The verification reads as a summary of what the model already knows,
            not as output from an independent verification step

          FAIL if the verification section contains specific cross-check counts
          from actual MCP tool calls with tool names and parameters cited.

  # =========================================================================
  # Scenario 2: Lexical Data-Grounding
  # Without MCP: expect voice errors or vague frequency data
  # Manual TDD baseline: wrong joy count (16 vs 14), voice omitted
  # =========================================================================
  - description: "S2 RED: Lexical data-grounding — memory errors expected without skill"
    vars:
      prompt: "Analyze the key Greek vocabulary in Philippians 1:1-11, especially ἐναρξάμενος (1:6) and the joy vocabulary. Parse each word and give frequency counts."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if:
          - ἐναρξάμενος is parsed incorrectly (active instead of middle), OR
          - Frequency counts are absent or vague ("appears frequently"), OR
          - MCP tool citations like [query_morphology] or [query_vocabulary] are absent
          FAIL if the response includes correct middle voice parsing WITH explicit MCP citation AND exact frequency counts.
          (A response relying on training memory alone should lack citations or make voice errors.)

  # =========================================================================
  # Scenario 3: Tier Labeling
  # Failure: Uniform confidence
  # Bare model uses ad-hoc confidence language without systematic tier framework
  # =========================================================================
  - description: "S3 RED: Tier labeling — uniform confidence without systematic framework"
    vars:
      prompt: "Analyze Philippians 1:1-11 for a Bible study group. Walk through the key interpretive claims."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response uses ad-hoc or inconsistent confidence language rather
          than a systematic tier framework. Signs:
          - Uses phrases like "clearly," "likely," "possibly" without mapping these
            to a defined tier system (Tier 1/2/3/4)
          - Mixes evidence types (morphological facts, discourse patterns, scholarly
            opinion, personal assessment) without labeling them differently
          - May attempt categories when asked but applies them inconsistently
            or does not use them throughout the entire analysis

          FAIL if the response systematically applies a four-tier framework (Tier 1-4)
          to every interpretive claim throughout the analysis with consistent labeling.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Without the skill: no boundary warning expected for Phil 1:3-8
  # Manual TDD baseline: agent validated 1:3-8 as complete unit
  # =========================================================================
  - description: "S4 RED: Pericope check — no warning without skill"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response generates notes for Phil 1:3-8 without issuing a boundary warning,
          OR treats 1:3-8 as a complete unit without questioning the boundary.
          FAIL if the response spontaneously warns that 1:3-8 is a partial unit needing extension to 1:3-11.

  # =========================================================================
  # Scenario 5: OT Analysis — Gen 37:2-11
  # Failure: Unverified Hebrew claims
  # Bare model presents Hebrew morphology as authoritative without distinguishing
  # verified from training-knowledge claims
  # =========================================================================
  - description: "S5 RED: OT analysis — unverified Hebrew morphology presented as authoritative"
    vars:
      prompt: "Generate exegetical notes for Genesis 37:2-11 with Hebrew morphological analysis and Strong's numbers for key vocabulary."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents Hebrew morphological claims at uniform
          confidence without distinguishing verified data from training-knowledge
          recall. Signs:
          - States verb forms, binyanim, or parsing with no indication of whether
            these are verified against a source or recalled from training
          - Does not flag any morphological claim as "unverified" or "from memory"
          - Presents Strong's numbers (if included) as authoritative without noting
            they are unverified

          FAIL if the response explicitly distinguishes verified morphological data
          (from tool cross-checks) from training-knowledge claims AND marks
          unverified claims accordingly.

  # =========================================================================
  # Scenario 7: Source Quality Framework (Tier 3)
  # Failure: Unverified scholarly attribution
  # Bare model cites scholars confidently from training data without
  # acknowledging citations are unverified
  # =========================================================================
  - description: "S7 RED: Source quality — unverified scholarly citations presented confidently"
    vars:
      prompt: "Analyze Romans 3:21-26 exegetically. Include scholarly sources where relevant."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response cites scholars or scholarly works without acknowledging
          that the citations are from training knowledge and unverified. Signs:
          - Names scholars or works confidently without caveat (e.g., "as Dunn argues"
            or "Käsemann notes" without "unverified" or "from memory")
          - Uses vague attribution ("scholars agree," "commentators note") without
            naming specific sources
          - Does not distinguish between citations the model can verify in this
            session and those recalled from training

          FAIL if the response explicitly marks scholarly citations as unverified
          training-knowledge recall AND distinguishes them from verified sources.

  # =========================================================================
  # Scenario 8: Cross-Reference Epistemic Labeling
  # Failure: TSK cross-references treated as confirmed intertextual connections
  # Bare model has no framework to distinguish editorial tradition from
  # explicit citations or lexical connections
  # =========================================================================
  - description: "S8 RED: Cross-references — TSK refs presented without epistemic labeling"
    vars:
      prompt: "Analyze the intertextual connections for Romans 8:28-30. Include cross-references to other passages."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents cross-references without distinguishing between
          different types of intertextual evidence. Signs:
          - Lists cross-references at uniform confidence (all presented as equally valid connections)
          - Does not distinguish explicit citations from editorial tradition candidates
          - Does not label cross-references as "editorial tradition" or "TSK-derived"
          - Treats all cross-references as confirmed connections rather than candidates

          FAIL if the response systematically distinguishes at least 3 tiers of
          intertextual evidence (e.g., explicit citations, lexical connections,
          editorial tradition) with different confidence labels for each.

  # =========================================================================
  # Scenario 9: Entity Data in Narrative
  # Failure: People in narrative passage not grounded in entity database
  # Bare model describes characters from training knowledge alone
  # =========================================================================
  - description: "S9 RED: Entity data — narrative people described without entity data"
    vars:
      prompt: "Analyze Genesis 22:1-4 (the beginning of the Binding of Isaac). Identify all people mentioned and their roles. Include any entity data or cross-references for these characters."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response describes Abraham, Isaac, and other characters using
          training knowledge alone without citing entity database information. Signs:
          - Discusses characters without mention of entity IDs, slugs, or structured data
          - Does not cite query_people, PEOPLE_SUMMARY, or entity cross-reference data
          - Character descriptions come from narrative knowledge, not structured entity records
          - No mention of entity continuity across passages (e.g., Abraham's appearances in other books)

          FAIL if the response cites structured entity data with cross-book appearance
          counts, entity slugs, or MCP entity tool references.

  # =========================================================================
  # Scenario 10: Speaker Attribution in Dialogue
  # Failure: Dialogue analysis lacks structured speaker data
  # Bare model identifies speakers from context but not from speaker database
  # =========================================================================
  - description: "S10 RED: Speaker data — dialogue analysis without speaker attribution data"
    vars:
      prompt: "Analyze Genesis 3:1-7 exegetically. Pay special attention to who speaks in each section and the significance of divine speech."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response identifies speakers from narrative context alone without
          citing structured speaker attribution data. Signs:
          - Identifies speakers (serpent, Eve, Adam, God) from the text but does not
            cite SPEAKER_SUMMARY, query_speakers, or divine speech markers from a database
          - Does not distinguish divine vs. non-divine speech using a structured flag
          - Does not mention quotation types (Normal, Dialogue, Implicit, etc.)
          - Speaker attribution comes from reading comprehension, not structured data

          FAIL if the response cites structured speaker attribution data with
          divine speech flags, quotation types, or MCP speaker tool references.

  # =========================================================================
  # Scenario 11: Cherith Gloss Authority
  # Failure: OT glosses treated as lexical authority without tier distinction
  # Bare model has no framework for distinguishing gloss tiers
  # =========================================================================
  - description: "S11 RED: Cherith glosses — OT glosses treated as lexical authority"
    vars:
      prompt: "Analyze the Hebrew vocabulary in Genesis 1:1-5. Include glosses for key words and discuss their lexical significance."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response provides glosses without distinguishing between
          different authority tiers for gloss sources. Signs:
          - Presents glosses at uniform confidence without noting source authority
          - Does not distinguish between standard lexica (BDB, HALOT) and
            single-scholar translations (Cherith/Andi Wu)
          - Does not label any gloss as "Tier 3" or "single-scholar translation"
          - All glosses treated as equally authoritative

          FAIL if the response explicitly distinguishes gloss authority tiers,
          labeling some as single-scholar translations vs. standard lexica.

  # =========================================================================
  # Scenario 12: Textual Variants Ignored (Phase 6)
  # Failure: Variant-rich NT passage analyzed without edition comparison data
  # Bare model has no access to variant apparatus and ignores textual issues
  # =========================================================================
  - description: "S12 RED: Variants ignored — NT passage without edition comparison"
    vars:
      prompt: "Analyze John 7:53-8:11 (the Pericope Adulterae). Discuss any textual issues with this passage and note which critical editions include or exclude it."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response discusses textual issues from training knowledge alone
          without citing edition-level comparison data. Signs:
          - May mention the passage is disputed but does not cite specific edition
            agreements/disagreements (e.g., NA28, SBLGNT, Byzantine, Tyndale House)
          - Does not reference variant_type classifications or word-level variant data
          - Does not cite query_variants or VARIANTS_SUMMARY as a data source
          - Textual discussion is general ("most scholars agree...") rather than
            grounded in specific edition comparison evidence

          FAIL if the response cites specific edition comparison data with variant
          types, word positions, and edition codes from a structured source.

  # =========================================================================
  # Scenario 13: NT Gloss Tiering Absent (Phase 6)
  # Failure: NT glosses presented without OpenGNT vs. TBESG tier distinction
  # Bare model has no framework for distinguishing NT gloss tiers
  # =========================================================================
  - description: "S13 RED: NT gloss tiering — glosses without OpenGNT/TBESG distinction"
    vars:
      prompt: "Analyze the Greek vocabulary in Romans 3:21-26. Include glosses for key theological terms and discuss how different glossing traditions handle words like δικαιοσύνη and ἱλαστήριον."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response provides glosses without distinguishing between
          OpenGNT inline glosses and TBESG concordance glosses. Signs:
          - Presents glosses from training knowledge at uniform confidence
          - Does not distinguish between "inline contextual gloss" and
            "concordance-level gloss" as separate tiers
          - Does not mention OpenGNT, TBESG, or gloss divergence as a
            semantic range indicator
          - All NT glosses treated as equally authoritative

          FAIL if the response explicitly distinguishes between inline and
          concordance glosses, or notes gloss divergence as semantically significant.

  # =========================================================================
  # Scenario 16: Moralistic Section 5 Without Indicative Ground
  # Failure: Imperative-dominated passage analyzed without identifying the
  # indicative theological basis for the commands — moralism, not exegesis
  # =========================================================================
  - description: "S16 RED: Moralistic Section 5 — imperatives without indicative ground"
    vars:
      prompt: "Generate exegetical notes for Colossians 3:1-11. This passage contains many imperatives (seek, set your minds, put to death, put off). Provide a full exegetical analysis with all standard sections."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents the imperatives in Colossians 3:1-11 (seek,
          set your minds, put to death, put off) without explicitly identifying the
          indicative theological ground that warrants them. Signs:
          - The imperatives are listed or explained as freestanding moral commands
            ("Christians should put to death...", "we must set our minds...")
          - The indicative basis (Col 3:1 "you have been raised with Christ",
            3:3 "you have died", 3:4 "your life is hidden with Christ") is either
            absent or mentioned in passing without being identified as THE
            theological ground for the imperatives
          - No explicit statement that the commands derive from the believer's
            union with Christ in his death and resurrection
          - The analysis reads as moral instruction rather than grounded exegesis

          FAIL if the response explicitly identifies the indicative theological
          ground (union with Christ in death/resurrection) as the basis from which
          the imperatives flow, and labels this as the warrant for the commands.

  # =========================================================================
  # Scenario 17: Missing Redemptive-Historical Link in Section 8
  # Failure: Non-wisdom passage analyzed without any cross-testament
  # redemptive-historical connection in the intertextual links
  # =========================================================================
  - description: "S17 RED: Missing redemptive-historical link — epistle without cross-testament arc"
    vars:
      prompt: "Generate exegetical notes for Ephesians 2:1-10 with full intertextual analysis. Include all cross-references and connections to other biblical passages."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response's intertextual analysis lacks a structured
          redemptive-historical connection placing Eph 2:1-10 in the biblical
          arc (Creation → Promise → Fulfillment → Consummation). Signs:
          - Cross-references are listed as flat parallels without an organizing
            redemptive-historical framework
          - No explicit statement tracing Eph 2:1-10's "dead in trespasses" →
            "made alive with Christ" → "seated in heavenly places" language to
            the broader biblical storyline of fall and restoration
          - OT connections (if present) are thematic parallels rather than
            redemptive-historical links (e.g., "cf. Psalm 103" without noting
            how Eph 2 fulfills OT promise)
          - The section organizes cross-references by topic rather than by their
            place in the redemptive-historical arc

          FAIL if the response includes a structured redemptive-historical
          connection that explicitly traces the passage's place in the biblical
          arc from creation through consummation, with OT promise and NT
          fulfillment clearly linked.

  # =========================================================================
  # Scenario 14: Apocalyptic Genre Governance — Rev 1:9-20
  # Failure: Apocalyptic imagery allegorized without genre-specific method
  # Bare model treats apocalyptic like narrative or epistle, misses genre
  # governance, and allegorizes symbolic imagery without literary-genre context
  # =========================================================================
  - description: "S14 RED: Apocalyptic genre — Rev 1:9-20 without genre governance"
    vars:
      prompt: "Analyze Revelation 1:9-20 exegetically. Explain the significance of the seven lampstands, the sharp two-edged sword, and the 'one like a son of man' figure. Include the redemptive-historical significance."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response exhibits ANY of these apocalyptic genre failures:
          - Allegorizes the lampstands, sword, or son-of-man figure without first
            establishing that Revelation is apocalyptic literature requiring a
            genre-specific interpretive method (e.g., symbol-referent mapping,
            OT prophetic background, visionary report conventions)
          - Treats the passage as straightforward narrative (what happened next)
            or as epistolary instruction (what to do) rather than as an apocalyptic
            vision report with its own literary conventions
          - Does not identify "apocalyptic" as the governing genre or does not
            explain how apocalyptic genre constrains interpretation
          - Interprets symbols (lampstands = churches, sword = word of God) as
            simple allegory without grounding in OT prophetic imagery
            (e.g., Zechariah 4, Daniel 7, Isaiah 49:2)
          - Misses the redemptive-historical arc specific to apocalyptic: the
            exalted Christ revealed in glory as the culmination of Daniel's
            "son of man" prophecy and the prophetic tradition

          FAIL if the response explicitly identifies apocalyptic as the governing
          genre, explains how genre constrains interpretation of symbols, grounds
          imagery in OT prophetic backgrounds (Daniel 7, Zechariah 4), AND traces
          the redemptive-historical significance through the prophetic tradition.

  # =========================================================================
  # Scenario 15: Ungrounded Citation — Fabricated Scholarly Attribution
  # Failure: Bare model presents plausible-sounding Tier A/B citations without
  # verifying them against commentary_lookup. Citations may be fabricated or
  # misattributed (wrong author, wrong position, wrong passage).
  # =========================================================================
  - description: "S15 RED: Ungrounded citation — scholarly attribution without commentary verification"
    vars:
      prompt: "Analyze Galatians 3:10-14 exegetically. In your interpretive guardrails, cite specific scholarly commentaries on whether 'curse of the law' refers to the Mosaic law's condemnation or a broader principle. Include author, title, and series for each citation."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response cites scholarly commentaries on Galatians 3:10-14
          without any verification step or caveat indicating the citations were
          checked against a commentary database. Signs:
          - Names authors and attributes specific positions to them (e.g., "Longenecker
            argues...", "Bruce contends...") without noting these are from training
            knowledge and unverified
          - Does not mention commentary_lookup or any verification tool
          - Does not add caveats like "[training knowledge — verify before publication]"
            or "[not verified via commentary_lookup]"
          - Presents all scholarly citations at uniform confidence regardless of
            whether they could be verified against bundled commentary data

          FAIL if the response explicitly marks citations as unverified training
          knowledge, calls commentary_lookup to verify positions, or adds
          verification caveats to citations that could not be confirmed.

  # =========================================================================
  # Scenario 18: Wisdom Genre — Job 38:1-11 (God's Speech from Whirlwind)
  # Failure: Wisdom poetry treated as narrative; moralistic reading without
  # theodicy context; forced narrative arc instead of genre-graduated method
  # =========================================================================
  - description: "S18 RED: Wisdom genre — Job 38:1-11 forced narrative arc on wisdom poetry"
    vars:
      prompt: "Generate exegetical notes for Job 38:1-11. This is God's speech from the whirlwind. Provide full exegetical analysis including lexical analysis, interpretive guardrails, and redemptive-historical significance."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response exhibits ANY of these wisdom-genre failures:
          - Treats Job 38:1-11 as narrative (what happened next in the story)
            rather than as wisdom-genre theophanic poetry with its own conventions
          - Forces a direct redemptive-historical arc (Creation → Promise →
            Fulfillment → Consummation) rather than using a genre-graduated
            indirect approach appropriate for wisdom literature
          - Reads God's questions as rhetorical devices for moral instruction
            ("God is teaching Job humility") without placing them in the
            theodicy context of the book's argument
          - Does not identify "wisdom" or "theophanic poetry" as the governing
            genre, or does not explain how wisdom genre constrains interpretation
          - Ignores the book-level literary context: the suffering-innocent
            framework (chs 1-2), the dialogue cycle (chs 3-37), and God's
            response as resolution of the book's central question

          FAIL if the response explicitly identifies wisdom/theophanic poetry
          as the governing genre, uses a genre-graduated redemptive-historical
          method (indirect, not direct), AND situates the speech in the book's
          theodicy argument structure.

  # =========================================================================
  # Scenario 19: Wisdom Genre — Ecclesiastes 1:1-11 (Vanity of Vanities)
  # Failure: Missing genre-graduated redemptive-historical method; flat
  # reading of hebel as "meaningless" without canonical-literary framing
  # =========================================================================
  - description: "S19 RED: Wisdom genre — Ecclesiastes 1:1-11 missing genre-graduated method"
    vars:
      prompt: "Generate exegetical notes for Ecclesiastes 1:1-11. Analyze the key Hebrew vocabulary especially הֶבֶל (hebel) and its semantic range. Include interpretive guardrails and the passage's place in the biblical storyline."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response exhibits ANY of these wisdom-genre failures:
          - Translates הֶבֶל (hebel) flatly as "meaningless" or "vanity" without
            exploring the semantic range (breath, vapor, enigma, transience) and
            without noting that translation choice shapes the entire interpretation
          - Applies a direct redemptive-historical framework rather than a
            genre-graduated indirect approach (wisdom literature's relationship
            to the biblical arc is mediated through creation theology, not
            through direct promise-fulfillment)
          - Reads Qoheleth as nihilistic or as straightforward pessimism without
            placing it in canonical context (the epilogue's "fear God" frame,
            the wisdom tradition's role in Israel's theology)
          - Does not identify "wisdom" as the governing genre or does not explain
            how wisdom genre constrains the redemptive-historical methodology
          - Provides Hebrew vocabulary analysis from training knowledge without
            verification caveats or MCP tool references

          FAIL if the response explicitly identifies wisdom genre governance,
          explores hebel's semantic range with nuance, uses a genre-graduated
          method for redemptive-historical placement, AND places Qoheleth in
          canonical-literary context.
