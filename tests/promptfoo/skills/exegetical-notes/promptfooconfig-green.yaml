# Promptfoo GREEN-phase tests for exegetical-notes skill.
# Core failure-mode corrections only. Adversarial/STRESS scenarios in promptfooconfig-extended.yaml.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-green.yaml
#
# GREEN phase — skill correction verification:
#   S1-S7: Core scenarios (structure, data-grounding, tiers, pericope, OT, verification, scholarly)
#   S8-S12: Phase 4 scenarios (cross-ref labeling, entity data, speaker data, gloss tiers, variants)
#   S14: Apocalyptic genre governance (Rev 1:9-20)
#   S15: Citation grounding via commentary_lookup (Gal 3:10-14)
#   S16-S17: F4 self-critique (indicative ground, redemptive-historical link)
#
# RED scenario coverage audit:
#   S18: Wisdom genre — Job 38:1-11 (genre-graduated method)
#   S19: Wisdom genre — Ecclesiastes 1:1-11 (hebel semantic range)
#   S20: Sparse MCP data — Obadiah 1-4 (degraded-data fallback)
#   S21: Law genre — Leviticus 16:1-10 (covenantal-fulfillment framework)
#
# Controversy awareness (Phase 5 — historicity metadata layer):
#   S22: Contested authorship — Daniel 7:13-14 notes surface both positions, no winner

description: "Exegetical Notes — GREEN phase (failure-mode corrections)"

providers:
  - file://../../providers/with-skill.agent-sdk.yaml

prompts:
  - "{{prompt}}"

# Default assertions applied to EVERY test case.
# Theological guardrail + MCP tool usage are universal requirements.
defaultTest:
  options:
    provider:
      id: openai:gpt-4o
      config:
        temperature: 0
  assert:
    - type: not-icontains
      value: "API Error: 429"
    # Every GREEN test must use MCP tools (not just respond from memory)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # MCP tool citation check: output must reference expected MCP tools.
    # NOTE: tool-call-f1 and metadata.toolCalls don't work with claude-agent-sdk.
    - type: javascript
      value: |
        const lower = output.toLowerCase();
        const expected = ['query_morphology', 'query_vocabulary', 'bible_lookup', 'commentary_lookup'];
        const found = expected.filter(n => lower.includes(n));
        return {
          pass: found.length >= 1,
          score: found.length / expected.length,
          reason: found.length >= 1
            ? `MCP tools cited in output: [${found}]`
            : `No expected MCP tools found in output. Expected: [${expected}]`
        };
    # Theological guardrail: literary context must be respected
    - type: llm-rubric
      value: |
        Evaluate whether the output respects literary context. FAIL if:
        - Individual verses are interpreted without reference to the surrounding discourse unit
        - Pericope boundaries are ignored or violated
        - Book-level context (author, audience, occasion) is absent from the interpretation
        - The passage is treated as a proof-text independent of its argument
        PASS if interpretation flows from the discourse unit, respects the pericope, and references
        the book's argumentative context.
    # Theological guardrail: christ-centeredness
    - type: llm-rubric
      value: |
        Evaluate whether the output traces the passage's place in the biblical storyline.
        FAIL if the redemptive-historical arc is completely absent and the passage is
        treated as isolated moral instruction with no gospel connection.
        PASS if the passage is connected to the broader biblical narrative, even briefly.
        For OT passages, a redemptive-historical note suffices.
    # Theological guardrail: covenantal awareness
    - type: llm-rubric
      value: |
        Evaluate whether the output respects covenantal distinctions.
        FAIL if OT law is applied directly to Christians without attention to fulfillment
        in Christ, or if no attention is given to progressive revelation between testaments.
        PASS if the analysis attends to covenant context, or if this is an NT passage
        where covenantal distinctions are less directly relevant.

tests:

  # =========================================================================
  # Scenarios S1+S2+S3+S6 CONSOLIDATED — Phil 1:1-11
  # Single API call, all assertions combined.
  # Tests: sections, content quality, morphology, frequency, tiers, verification
  # =========================================================================
  - description: "S1-S3+S6 GREEN: Phil 1:1-11 — structure, data-grounding, tiers, verification"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print"
    assert:
      # --- S1: All 10 required sections + header fields ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          const sections = [
            'passage in literary context', 'internal structure',
            'propositional summary', 'lexical analysis',
            'exegetical conclusions', 'interpretive guardrails',
            'open questions', 'intertextual', 'data sources', 'verification'
          ];
          const headers = ['genre:', 'pericope status:'];
          const missing = [...sections, ...headers].filter(s => !lower.includes(s));
          return {
            pass: missing.length === 0,
            score: 1 - (missing.length / (sections.length + headers.length)),
            reason: missing.length === 0
              ? 'All 10 sections and header fields present'
              : `Missing: [${missing.join(', ')}]`
          };
      # --- S1: Content quality ---
      - type: llm-rubric
        value: |
          Evaluate whether this exegetical notes output contains SUBSTANTIVE analytical
          content, not just section headers with minimal text.

          PASS if ALL of these are true:
          - The "Lexical Analysis" section contains at least one Greek/Hebrew word with
            morphological data (parsing, lemma form, or semantic range discussion)
          - The "Propositional Summary" section contains numbered propositions that map
            the argument's logical flow
          - The "Verification" section contains specific cross-check results citing
            MCP tool outputs (e.g., "[query_morphology]", "[query_vocabulary]")

          FAIL if any section is present as a header only, with one generic sentence
          or no substantive analytical content beneath it.
      # --- S2: Correct morphology (aorist MIDDLE, not active) ---
      - type: llm-rubric
        value: |
          Look for analysis of ἐναρξάμενος (Phil 1:6).
          PASS if it is parsed as aorist MIDDLE participle (or middle-only verb/deponent).
          FAIL if it is parsed as aorist ACTIVE participle.
          FAIL if it is absent from the lexical analysis.
      # --- S2: Frequency counts present (not vague) ---
      - type: llm-rubric
        value: |
          Check the analysis of χαρά or χαίρω in Philippians.
          PASS if specific numerical occurrence counts are given in any of these forms:
          - Verse references (e.g., "5 occurrences: 1:4, 1:25, 2:2, 2:29, 4:1")
          - Chapter-level breakdown (e.g., "9 total: 2 in ch.1, 3 in ch.2, 1 in ch.3, 3 in ch.4")
          - Chapter distribution data from query_vocabulary (e.g., "by chapter: {1:2, 2:2, 4:1}")
          - Total count with chapter distribution in any format
          FAIL if the analysis only says "frequently occurs" or "characteristic of Philippians" without any numerical count data.
      # --- S3: All 4 tiers present ---
      - type: icontains
        value: "Tier 1"
      - type: icontains
        value: "Tier 2"
      - type: icontains
        value: "Tier 3"
      - type: icontains
        value: "Tier 4"
      # --- S3: Tier 1 linguistic grounding ---
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if Tier 1 contains a linguistic/morphological claim grounded in Greek grammar data.
          FAIL if Tier 1 is empty or contains non-linguistic content.
      # --- S3: Tier 4 labeled as agent assessment ---
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if Tier 4 is explicitly labeled as "Agent assessment" or similar marker.
          FAIL if Tier 4 presents agent opinion as established fact without labeling.
      # --- S6: Verification cross-check ---
      - type: llm-rubric
        value: |
          Check the Verification section (Section 10).
          PASS if it reports specific MCP cross-check results with:
          - A count of data claims checked
          - A count of claims confirmed
          - A count of claims corrected (should be 0 if data was used correctly)
          FAIL if Verification is present but contains only generic text without actual cross-check results.
          FAIL if Verification is absent entirely.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Warning issued for Phil 1:3-8 before generating notes
  # Core failure: notes generated without any boundary warning
  # =========================================================================
  - description: "S4 GREEN: Pericope check — warning issued for Phil 1:3-8"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8 --output print"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response includes a boundary warning or pericope check note
          indicating that Phil 1:3-8 may be a partial unit because 1:9-11
          (the prayer) completes the thanksgiving.
          PASS ALSO if it recommends extending to 1:3-11 or similar.
          The warning can appear before the notes header OR in the Pericope Status metadata.
          FAIL if notes are generated for Phil 1:3-8 without any boundary warning, flag,
          or pericope status note anywhere in the output.

  # =========================================================================
  # Scenario 5: OT Analysis — Gen 37:2-11
  # Hebrew morphology, Strong's numbers, OT scholarly sources
  # Core failure: Hebrew claims without tool citation / NT commentaries for OT passage
  # =========================================================================
  - description: "S5 GREEN: OT analysis — Hebrew morphology and Strong's numbers"
    vars:
      prompt: "Generate exegetical notes for Genesis 37:2-11 --output print"
    assert:
      # Hebrew morphology grounded in MCP data
      - type: llm-rubric
        value: |
          Check the Lexical Analysis section for Hebrew morphological data.
          PASS if:
          - At least one Hebrew verb is parsed with stem (Qal, Niphal, Piel, Hiphil, etc.) and conjugation
          - Strong's numbers (H####) are provided for key lemmas
          - MCP tool citation like [query_morphology] is present
          FAIL if:
          - No Hebrew morphological data is cited
          - Morphological claims are made without tool citation
          - Strong's numbers are absent
      # OT scholarly sources (not NT commentaries)
      - type: llm-rubric
        value: |
          Check Tier 3 citations in the Interpretive Guardrails section.
          PASS if at least one cited source is an OT commentary or OT scholar
          (e.g., Wenham, Hamilton, Waltke, Sarna, Mathews, or OT series like WBC, NICOT, TOTC).
          FAIL if only NT commentaries or generic sources are cited.
          FAIL if no specific scholarly source is named.

  # =========================================================================
  # Scenarios S7+S13 CONSOLIDATED — Romans 3:21-26
  # Single API call. Tests: source quality (Tier 3) + NT gloss tiering
  # Core failure: "scholars agree" without names / gloss sources undifferentiated
  # =========================================================================
  - description: "S7+S13 GREEN: Rom 3:21-26 — source quality + NT gloss tiering"
    vars:
      prompt: "Generate exegetical notes for Romans 3:21-26 --output print"
    assert:
      # --- S7: Named scholarly commentaries in Tier 3 ---
      - type: llm-rubric
        value: |
          Check Tier 3 citations in the Interpretive Guardrails section.
          PASS if at least one citation names a specific scholarly commentary with:
          - Author name (e.g., Moo, Cranfield, Dunn, Schreiner, Käsemann)
          - Commentary title or series (e.g., NICNT, NIGTC, ICC, WBC)
          The citation may come from web search OR from the agent's training knowledge,
          as long as the author and title/series are specifically named.
          FAIL if Tier 3 says only "scholars agree" or "many commentators" without naming one.
          FAIL if only devotional or popular-level sources are cited.
          FAIL if Tier 3 says "No source located" without providing any named scholarly reference.
      # --- S13: NT gloss tiering (OpenGNT vs TBESG) ---
      - type: llm-rubric
        value: |
          Check Section 4 (Lexical Analysis) for NT gloss handling.
          PASS if:
          - NT glosses are present with some awareness of different gloss sources
          - OpenGNT inline glosses and TBESG concordance glosses are distinguished
            or at least noted as different tiers/sources
          - Where glosses diverge for the same word, the divergence is flagged as
            a semantic range indicator rather than silently picking one
          - Standard lexica (BDAG, LSJ) are recommended for definitive semantic
            range over any single gloss source
          FAIL if all NT glosses are presented at uniform authority without
          distinguishing between inline and concordance glosses.
          FAIL if gloss divergence is silently resolved without noting it.

  # =========================================================================
  # Scenario 8: Cross-Reference Epistemic Labeling (Phase 4)
  # Core failure: all cross-refs at uniform confidence without evidence hierarchy
  # =========================================================================
  - description: "S8 GREEN: Cross-references — 4-tier intertextual hierarchy with TSK labeling"
    vars:
      prompt: "Generate exegetical notes for Romans 8:28-30 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links).
          PASS if cross-references are organized using a multi-tier hierarchy that
          distinguishes between different types of evidence:
          - Explicit citations (OT quotations) labeled distinctly from editorial candidates
          - Cross-references from TSK/OpenBible labeled as "editorial tradition" or "candidates"
            with vote counts, NOT as confirmed connections
          - At least 2 different tiers of intertextual evidence are distinguished
          FAIL if all cross-references are presented at uniform confidence without
          distinguishing explicit citations from editorial tradition.
          FAIL if TSK-derived cross-references are presented as confirmed connections.

  # =========================================================================
  # Scenario 9: Entity Data in Narrative (Phase 4)
  # Core failure: characters discussed purely from training knowledge
  # =========================================================================
  - description: "S9 GREEN: Entity data — narrative characters grounded in entity data"
    vars:
      prompt: "Generate exegetical notes for Genesis 22:1-4 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links) and the overall character analysis.
          PASS if:
          - Characters (Abraham, Isaac) are discussed with reference to entity data,
            cross-book appearances, or entity continuity across passages
          - The analysis references structured entity data (from PEOPLE_SUMMARY,
            query_people, or similar) rather than relying solely on training knowledge
          - Entity continuity is used as a category of intertextual evidence
          FAIL if characters are discussed purely from training knowledge with no
          reference to entity database information or structured cross-book data.

  # =========================================================================
  # Scenario 10: Speaker Attribution in Dialogue (Phase 4)
  # Core failure: speakers identified from narrative context without structured data
  # =========================================================================
  - description: "S10 GREEN: Speaker data — dialogue with divine speech markers"
    vars:
      prompt: "Generate exegetical notes for Genesis 3:1-7 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails) for speaker attribution data.
          PASS if:
          - Speaker attribution is present with structured data (speaker names, verse ranges)
          - Divine speech is flagged or marked distinctly from non-divine speech
          - Speaker transitions are noted as discourse-significant
          - Data references SPEAKER_SUMMARY, query_speakers, or similar structured source
          FAIL if speakers are identified only from narrative context without reference
          to structured speaker attribution data.
          FAIL if divine and non-divine speech are not distinguished.

  # =========================================================================
  # Scenario 11: Cherith Gloss Tier Awareness (Phase 4)
  # Core failure: all glosses at uniform authority without tier distinction
  # =========================================================================
  - description: "S11 GREEN: Cherith glosses — OT glosses with tier distinction"
    vars:
      prompt: "Generate exegetical notes for Genesis 1:1-5 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 4 (Lexical Analysis) for OT gloss handling.
          PASS if:
          - OT glosses are present with tier or authority information
          - Cherith/Andi Wu glosses are labeled as single-scholar translations or Tier 3
            (not treated as equivalent to standard lexica like BDB/HALOT)
          - Standard lexical definitions (from query_lexicon/LEXICON_SUMMARY) are
            distinguished from contextual glosses where available
          FAIL if all glosses are presented at uniform authority without distinguishing
          between standard lexica and single-scholar translations.
          FAIL if Cherith glosses are cited as lexical authority for semantic range arguments
          without noting their single-scholar status.

  # =========================================================================
  # Scenario 12: Textual Variants with Edition Comparison (Phase 6)
  # Core failure: textual issues discussed from training knowledge without edition data
  # =========================================================================
  - description: "S12 GREEN: Variants — edition comparison for Pericope Adulterae"
    vars:
      prompt: "Generate exegetical notes for John 7:53-8:11 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Textual Variants or similar) for edition comparison data.
          PASS if:
          - The response discusses textual variants with specific edition references
            (e.g., NA28, SBLGNT, Byzantine, Tyndale House, Textus Receptus)
          - Edition agreements/disagreements are cited with evidence rather than
            general "most scholars" language
          - References query_variants, VARIANTS_SUMMARY, or structured variant data
          - Variant data is attributed to edition comparison, not presented as
            the agent's own text-critical judgment
          FAIL if textual issues are discussed only from general training knowledge
          without citing edition-level comparison data.
      - type: llm-rubric
        value: |
          PASS if variant data is used with appropriate caveats — i.e., presented
          as "edition comparison data" rather than a full text-critical apparatus.
          The response should acknowledge that edition comparison shows WHERE editions
          diverge, not the manuscript evidence for each reading.
          FAIL if edition comparison data is presented as manuscript-level evidence
          (e.g., claiming to show papyrus/uncial support for readings).

  # =========================================================================
  # Scenario 14: Apocalyptic Genre Governance — Rev 1:9-20
  # Core failure: apocalyptic imagery allegorized without genre-specific method,
  # OT prophetic backgrounds missing, redemptive-historical arc untraced
  # =========================================================================
  - description: "S14 GREEN: Apocalyptic genre — Rev 1:9-20 with genre governance"
    vars:
      prompt: "Generate exegetical notes for Revelation 1:9-20 --output print"
    assert:
      # --- Genre identification in header ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          return {
            pass: lower.includes('genre:') && lower.includes('apocalyptic'),
            score: lower.includes('apocalyptic') ? 1 : 0,
            reason: lower.includes('apocalyptic')
              ? 'Genre identified as apocalyptic'
              : 'Genre not identified as apocalyptic'
          };
      # --- OT prophetic background for imagery ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          const otRefs = ['daniel 7', 'dan 7', 'zechariah 4', 'zech 4', 'daniel 10', 'dan 10', 'isaiah 49', 'isa 49'];
          const found = otRefs.filter(r => lower.includes(r));
          return {
            pass: found.length >= 2,
            score: found.length / 3,
            reason: found.length >= 2
              ? `OT prophetic backgrounds cited: [${found}]`
              : `Insufficient OT prophetic backgrounds. Found: [${found}]. Expected at least 2 from: [${otRefs}]`
          };
      # --- Genre governance: apocalyptic method constrains interpretation ---
      - type: llm-rubric
        value: |
          Evaluate whether the output applies genre governance to Revelation 1:9-20.
          PASS if ALL of these are true:
          - Apocalyptic is explicitly identified as the governing genre
          - The analysis explains how apocalyptic genre constrains interpretation
            of the symbolic imagery (lampstands, sword, son-of-man figure)
          - Symbols are grounded in OT prophetic imagery (e.g., lampstands in
            Zechariah 4, son of man in Daniel 7, sword in Isaiah 49:2) rather
            than treated as simple allegory or decoded without literary precedent
          - The redemptive-historical arc traces the exalted Christ as fulfillment
            of the Daniel 7 "son of man" prophecy or the broader prophetic tradition
          - The passage is treated as a visionary report with its own literary
            conventions, not as narrative or epistolary instruction

          FAIL if symbols are allegorized without OT prophetic grounding, or if
          apocalyptic genre is not identified as governing the interpretive method,
          or if the redemptive-historical connection to the prophetic tradition is absent.

  # =========================================================================
  # Scenario 15: Citation Grounding via commentary_lookup — Gal 3:10-14
  # Core failure: scholarly citations presented without verification against
  # bundled commentary data; fabricated attributions reach final output
  # =========================================================================
  - description: "S15 GREEN: Citation grounding — Tier 3 citations verified via commentary_lookup"
    vars:
      prompt: "Generate exegetical notes for Galatians 3:10-14 --output print"
    assert:
      # --- commentary_lookup tool was called ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          return {
            pass: lower.includes('commentary_lookup'),
            score: lower.includes('commentary_lookup') ? 1 : 0,
            reason: lower.includes('commentary_lookup')
              ? 'commentary_lookup referenced in output'
              : 'No mention of commentary_lookup in output'
          };
      # --- Citations carry verification caveats ---
      - type: llm-rubric
        value: |
          Check the Interpretive Guardrails section (Section 6) for Tier 3 citations.
          PASS if:
          - At least one scholarly citation includes a verification caveat such as
            "[training knowledge — verify before publication]", "[not verified via
            commentary_lookup]", or "[commentary_lookup contradicts: ...]"
          - Modern commentaries not in the bundled set (e.g., Moo, Fee, Longenecker,
            Bruce) are marked with a training-knowledge caveat rather than presented
            at full confidence
          - Citations from bundled commentaries (adam-clarke, jamieson-fausset-brown,
            john-gill, keil-delitzsch, matthew-henry, tyndale) are either confirmed
            or flagged if the commentary text does not support the attributed position
          FAIL if all Tier 3 citations are presented at uniform confidence without
          any verification caveat or commentary_lookup reference.
          FAIL if modern scholarly citations (not in the bundled commentary set)
          are presented without a training-knowledge caveat.

  # =========================================================================
  # Scenario 16: Self-Critique Catches Moralistic Section 5
  # Core failure: imperatives presented as freestanding moral instruction
  # without identifying the indicative theological ground
  # =========================================================================
  - description: "S16 GREEN: Self-critique — indicative ground for imperative-dominated passage"
    vars:
      prompt: "Generate exegetical notes for Colossians 3:1-11 --output print"
    assert:
      # --- Indicative ground explicitly identified ---
      - type: llm-rubric
        value: |
          Check Section 5 (Exegetical Conclusions) for Colossians 3:1-11.
          This passage is dominated by imperatives (seek, set your minds, put to
          death, put off). The indicative theological ground is the believer's
          union with Christ: "you have been raised with Christ" (3:1), "you have
          died" (3:3), "your life is hidden with Christ in God" (3:4).

          PASS if Section 5 explicitly identifies this indicative ground as the
          theological basis from which the imperatives flow. The analysis must
          make clear that the commands are warranted by what God has done (the
          indicative), not presented as freestanding moral instruction.

          FAIL if the imperatives are listed or explained without explicitly
          identifying the indicative theological ground (union with Christ in
          death and resurrection) as their warrant.
      # --- Genre identified as epistle ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          return {
            pass: lower.includes('genre:') && lower.includes('epistle'),
            score: lower.includes('epistle') ? 1 : 0,
            reason: lower.includes('epistle')
              ? 'Genre identified as epistle'
              : 'Genre not identified as epistle'
          };

  # =========================================================================
  # Scenario 17: Self-Critique Ensures Redemptive-Historical Link
  # Core failure: non-wisdom epistle passage missing cross-testament
  # redemptive-historical connection in Section 8
  # =========================================================================
  - description: "S17 GREEN: Self-critique — redemptive-historical link for epistle"
    vars:
      prompt: "Generate exegetical notes for Ephesians 2:1-10 --output print"
    assert:
      # --- Redemptive-historical link present in Section 8 ---
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links) for Ephesians 2:1-10.
          This is an epistle passage (non-wisdom genre), so the skill's
          self-critique Step 8 requires a redemptive-historical connection
          placing the passage in the biblical arc.

          PASS if Section 8 includes a redemptive-historical connection that:
          - Places Eph 2:1-10 in the broader biblical storyline
            (Creation → Promise → Fulfillment → Consummation)
          - Traces at least one cross-testament link (e.g., the "dead in
            trespasses → made alive" pattern connecting to OT themes of
            exile/restoration, or "by grace through faith" connecting to
            Abrahamic covenant promise)
          - Goes beyond flat thematic parallels to show redemptive-historical
            progression

          FAIL if Section 8 contains only flat cross-references without a
          redemptive-historical framework, or if no cross-testament link is
          present connecting Eph 2:1-10 to the broader biblical arc.
      # --- All 10 sections present ---
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          const sections = [
            'passage in literary context', 'internal structure',
            'propositional summary', 'lexical analysis',
            'exegetical conclusions', 'interpretive guardrails',
            'open questions', 'intertextual', 'data sources', 'verification'
          ];
          const missing = sections.filter(s => !lower.includes(s));
          return {
            pass: missing.length === 0,
            score: 1 - (missing.length / sections.length),
            reason: missing.length === 0
              ? 'All 10 sections present'
              : `Missing: [${missing.join(', ')}]`
          };

  # =========================================================================
  # Scenario 18: Wisdom Genre — Job 38:1-11
  # Correction: genre-graduated method for wisdom theophanic poetry
  # =========================================================================
  - description: "S18 GREEN: Job 38:1-11 — wisdom genre governance with graduated method"
    vars:
      prompt: "Generate exegetical notes for Job 38:1-11 --output print"
    assert:
      # Genre identification present
      - type: icontains
        value: "wisdom"
      # Theodicy/theophany context referenced
      - type: llm-rubric
        value: |
          Evaluate whether the exegetical notes for Job 38:1-11:
          1. Identify wisdom (or theophanic poetry) as the governing genre
          2. Use a genre-graduated redemptive-historical method (indirect, not
             direct promise-fulfillment arc)
          3. Situate God's speech in the book-level theodicy argument (chs 1-2
             setup, dialogue cycle chs 3-37, divine response chs 38-41)
          4. Do NOT moralize the divine questions as simple humility lessons

          PASS if all four criteria are met.
          FAIL if any criterion is violated — especially if a direct
          redemptive-historical arc is forced or the speech is moralized.

  # =========================================================================
  # Scenario 19: Wisdom Genre — Ecclesiastes 1:1-11
  # Correction: genre-graduated method with canonical-literary framing
  # =========================================================================
  - description: "S19 GREEN: Ecclesiastes 1:1-11 — genre-graduated wisdom method"
    vars:
      prompt: "Generate exegetical notes for Ecclesiastes 1:1-11 --output print"
    assert:
      # hebel vocabulary addressed
      - type: icontains
        value: "hebel"
      # Genre-graduated method
      - type: llm-rubric
        value: |
          Evaluate whether the exegetical notes for Ecclesiastes 1:1-11:
          1. Explore the semantic range of הֶבֶל (hebel) beyond a single flat
             translation — discussing breath/vapor/transience/enigma options
          2. Identify wisdom as the governing genre and explain how it constrains
             the redemptive-historical methodology (indirect, creation-theology
             mediated, not direct promise-fulfillment)
          3. Place Qoheleth in canonical-literary context (the epilogue frame,
             the wisdom tradition's role in Israel's theology)
          4. Do NOT read Ecclesiastes as nihilistic OR as straightforwardly
             optimistic — both are genre violations

          PASS if all four criteria are met.
          FAIL if hebel is translated flatly, a direct redemptive-historical
          arc is forced, or canonical framing is absent.

