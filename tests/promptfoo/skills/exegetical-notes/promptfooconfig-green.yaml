# Promptfoo GREEN-phase tests for exegetical-notes skill.
# Skill content is injected via append_system_prompt in the provider config.
# Prompts directly request exegetical notes output.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/exegetical-notes/promptfooconfig-green.yaml
#
# GREEN phase — skill correction verification:
#   S1-S7: Core scenarios (structure, data-grounding, tiers, pericope, OT, verification, scholarly)
#   S8-S11: Phase 4 scenarios (cross-ref labeling, entity data, speaker data, gloss tiers)
#   S12-S13: Phase 6 scenarios (textual variants, NT gloss tiering)
#   ADV1-ADV4: Adversarial tests covering rationalization patterns
#   STRESS1-STRESS3: Genre stress tests (short letter, wisdom, minimal density)

description: "Exegetical Notes — GREEN phase (skill + MCP)"

providers:
  - file://../../providers/sdk-with-skill.mjs

prompts:
  - "{{prompt}}"

# Default assertions applied to EVERY test case.
# Theological guardrail + MCP tool usage are universal requirements.
defaultTest:
  options:
    provider: file://../../providers/sdk-grader.mjs
  assert:
    - type: not-icontains
      value: "API Error: 429"
    # Every GREEN test must use MCP tools (not just respond from memory)
    # NOTE: require() is not available in promptfoo inline JS assertions.
    # Inline the num_turns check from assertions/tool-calls.js directly.
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # MCP tool citation check: output must reference expected MCP tools.
    # NOTE: tool-call-f1 and metadata.toolCalls don't work with claude-agent-sdk.
    # Fall back to checking tool name strings in the output text.
    - type: javascript
      value: |
        const lower = output.toLowerCase();
        const expected = ['query_morphology', 'query_vocabulary'];
        const found = expected.filter(n => lower.includes(n));
        return {
          pass: found.length >= 1,
          score: found.length / expected.length,
          reason: found.length >= 1
            ? `MCP tools cited in output: [${found}]`
            : `No expected MCP tools found in output. Expected: [${expected}]`
        };
    # Theological guardrail: literary context must be respected
    - type: llm-rubric
      value: |
        Evaluate whether the output respects literary context. FAIL if:
        - Individual verses are interpreted without reference to the surrounding discourse unit
        - Pericope boundaries are ignored or violated
        - Book-level context (author, audience, occasion) is absent from the interpretation
        - The passage is treated as a proof-text independent of its argument
        PASS if interpretation flows from the discourse unit, respects the pericope, and references
        the book's argumentative context.
    # Theological guardrail: christ-centeredness
    - type: llm-rubric
      value: |
        Evaluate whether the output traces the passage's place in the biblical storyline.
        FAIL if the redemptive-historical arc is completely absent and the passage is
        treated as isolated moral instruction with no gospel connection.
        PASS if the passage is connected to the broader biblical narrative, even briefly.
        For OT passages, a redemptive-historical note suffices.
    # Theological guardrail: covenantal awareness
    - type: llm-rubric
      value: |
        Evaluate whether the output respects covenantal distinctions.
        FAIL if OT law is applied directly to Christians without attention to fulfillment
        in Christ, or if no attention is given to progressive revelation between testaments.
        PASS if the analysis attends to covenant context, or if this is an NT passage
        where covenantal distinctions are less directly relevant.

tests:

  # =========================================================================
  # Scenario 1: Complete NT Analysis — Phil 1:1-11
  # All 10 sections present and populated, format compliance verified
  # S1: (~32 checkpoints)
  # =========================================================================
  - description: "S1 GREEN: Phil 1:1-11 — all 10 sections present"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print"
    assert:
      # 10 required sections
      - type: icontains
        value: "Passage in Literary Context"
      - type: icontains
        value: "Internal Structure"
      - type: icontains
        value: "Propositional Summary"
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Exegetical Conclusions"
      - type: icontains
        value: "Interpretive Guardrails"
      - type: icontains
        value: "Open Questions"
      - type: icontains
        value: "Intertextual"
      - type: icontains
        value: "Data Sources"
      - type: icontains
        value: "Verification"
      # Format compliance: header fields
      - type: icontains
        value: "Genre:"
      - type: icontains
        value: "Pericope Status:"

  # =========================================================================
  # Scenario 2: Lexical Data-Grounding
  # query_morphology MCP data, not memory
  # S2: (must-say / must-not-say examples)
  # =========================================================================
  - description: "S2 GREEN: Lexical data-grounding — MCP morphology, not memory"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print"
    assert:
      # Correct morphology (aorist MIDDLE, not active)
      - type: llm-rubric
        value: |
          Look for analysis of ἐναρξάμενος (Phil 1:6).
          PASS if it is parsed as aorist MIDDLE participle (or middle-only verb/deponent).
          FAIL if it is parsed as aorist ACTIVE participle.
          FAIL if it is absent from the lexical analysis.
      # Frequency counts present (not vague)
      # NOTE: query_vocabulary returns chapter-level counts (by_chapter), not verse refs.
      # Accept either verse refs (if agent enriches from morphology) or chapter-level counts.
      - type: llm-rubric
        value: |
          Check the analysis of χαρά or χαίρω in Philippians.
          PASS if specific numerical occurrence counts are given in any of these forms:
          - Verse references (e.g., "5 occurrences: 1:4, 1:25, 2:2, 2:29, 4:1")
          - Chapter-level breakdown (e.g., "9 total: 2 in ch.1, 3 in ch.2, 1 in ch.3, 3 in ch.4")
          - Chapter distribution data from query_vocabulary (e.g., "by chapter: {1:2, 2:2, 4:1}")
          - Total count with chapter distribution in any format
          FAIL if the analysis only says "frequently occurs" or "characteristic of Philippians" without any numerical count data.
      # Key verb ἐπιτελέσει (1:6) must appear (manual TDD S1 §4 depth)
      - type: icontains
        value: "ἐπιτελ"

  # =========================================================================
  # Scenario 3: Tier Labeling
  # All 4 tiers present; Tier 3 web citation; Tier 4 labeled
  # S3:
  # =========================================================================
  - description: "S3 GREEN: Tier labeling — all 4 tiers present and correct"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print"
    assert:
      - type: icontains
        value: "Tier 1"
      - type: icontains
        value: "Tier 2"
      - type: icontains
        value: "Tier 3"
      - type: icontains
        value: "Tier 4"
      # Tier 1: linguistic grounding
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if Tier 1 contains a linguistic/morphological claim grounded in Greek grammar data.
          FAIL if Tier 1 is empty or contains non-linguistic content.
      # Tier 3: named scholarly citation
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if Tier 3 contains a citation to a named scholarly commentary (author + title or series).
          FAIL if Tier 3 says "scholars agree" without naming a specific source.
      # Tier 4: labeled as agent assessment
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if Tier 4 is explicitly labeled as "Agent assessment" or similar marker.
          FAIL if Tier 4 presents agent opinion as established fact without labeling.

  # =========================================================================
  # Scenario 4: Pericope Check Trigger
  # Warning issued for Phil 1:3-8 before generating notes
  # S4:
  # =========================================================================
  - description: "S4 GREEN: Pericope check — warning issued for Phil 1:3-8"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:3-8 --output print"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response includes a boundary warning or pericope check note
          indicating that Phil 1:3-8 may be a partial unit because 1:9-11
          (the prayer) completes the thanksgiving.
          PASS ALSO if it recommends extending to 1:3-11 or similar.
          The warning can appear before the notes header OR in the Pericope Status metadata.
          FAIL if notes are generated for Phil 1:3-8 without any boundary warning, flag,
          or pericope status note anywhere in the output.

  # =========================================================================
  # Scenario 5: OT Analysis — Gen 37:2-11
  # Hebrew morphology, Strong's numbers, OT scholarly sources
  # S5: (was deferred due to API errors)
  # =========================================================================
  - description: "S5 GREEN: OT analysis — Hebrew morphology and Strong's numbers"
    vars:
      prompt: "Generate exegetical notes for Genesis 37:2-11 --output print"
    assert:
      # Key sections present
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Interpretive Guardrails"
      - type: icontains
        value: "Verification"
      # Format compliance
      - type: icontains
        value: "Genre:"
      # Hebrew morphology grounded in MCP data
      - type: llm-rubric
        value: |
          Check the Lexical Analysis section for Hebrew morphological data.
          PASS if:
          - At least one Hebrew verb is parsed with stem (Qal, Niphal, Piel, Hiphil, etc.) and conjugation
          - Strong's numbers (H####) are provided for key lemmas
          - MCP tool citation like [query_morphology] is present
          FAIL if:
          - No Hebrew morphological data is cited
          - Morphological claims are made without tool citation
          - Strong's numbers are absent
      # OT scholarly sources (not NT commentaries)
      - type: llm-rubric
        value: |
          Check Tier 3 citations in the Interpretive Guardrails section.
          PASS if at least one cited source is an OT commentary or OT scholar
          (e.g., Wenham, Hamilton, Waltke, Sarna, Mathews, or OT series like WBC, NICOT, TOTC).
          FAIL if only NT commentaries or generic sources are cited.
          FAIL if no specific scholarly source is named.

  # =========================================================================
  # Scenario 6: Verification Integration
  # MCP cross-check runs; zero corrections for data claims
  # S6:
  # =========================================================================
  - description: "S6 GREEN: Verification section — MCP cross-check runs"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print"
    assert:
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          Check the Verification section (Section 10).
          PASS if it reports specific MCP cross-check results with:
          - A count of data claims checked
          - A count of claims confirmed
          - A count of claims corrected (should be 0 if data was used correctly)
          FAIL if Verification is present but contains only generic text without actual cross-check results.
          FAIL if Verification is absent entirely.

  # =========================================================================
  # Scenario 7: Source Quality Framework (Tier 3)
  # Tier A sources preferred; complete citations
  # S7:
  # =========================================================================
  - description: "S7 GREEN: Tier 3 source quality — named scholarly commentaries"
    vars:
      prompt: "Generate exegetical notes for Romans 3:21-26 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Tier 3 citations in the Interpretive Guardrails section.
          PASS if at least one citation names a specific scholarly commentary with:
          - Author name (e.g., Moo, Cranfield, Dunn, Schreiner, Käsemann)
          - Commentary title or series (e.g., NICNT, NIGTC, ICC, WBC)
          The citation may come from web search OR from the agent's training knowledge,
          as long as the author and title/series are specifically named.
          FAIL if Tier 3 says only "scholars agree" or "many commentators" without naming one.
          FAIL if only devotional or popular-level sources are cited.
          FAIL if Tier 3 says "No source located" without providing any named scholarly reference.

  # =========================================================================
  # REFACTOR: Adversarial scenarios
  # Tests rationalization patterns
  # =========================================================================

  # ADV1: Rationalization pattern #2 — "The aorist here is..." (no MCP cited)
  - description: "ADV1 GREEN: Resist memory-based morphology for famous crux"
    vars:
      prompt: "Generate exegetical notes for Philippians 2:5-11 --output print. Pay special attention to ἁρπαγμός in 2:6, which is a well-known interpretive crux."
    assert:
      - type: llm-rubric
        value: |
          Check morphological analysis of ἁρπαγμός (Phil 2:6).
          PASS if morphological data is cited with [query_morphology] or similar MCP citation.
          FAIL if morphological claims about ἁρπαγμός are made without tool citation.
          FAIL if the analysis says "scholars disagree" without also presenting the morphological data from MCP.

  # ADV2: Rationalization pattern #6 — Skipping Section 10 verification
  - description: "ADV2 GREEN: Verification not skipped under 'quick notes' framing"
    vars:
      prompt: "Generate exegetical notes for Philippians 4:4-7 --output print. I just need the essentials, so keep it brief."
    assert:
      - type: icontains
        value: "Verification"
      - type: llm-rubric
        value: |
          PASS if Section 10 (Verification) is present with MCP cross-check results,
          even though the user asked for "essentials" or "brief" output.
          FAIL if Verification is absent or skipped because the user asked for brevity.

  # ADV3: Rationalization pattern #4 — "This is clear from the context"
  - description: "ADV3 GREEN: Discourse data required even for 'obvious' passages"
    vars:
      prompt: "Generate exegetical notes for Philippians 1:1-11 --output print. The thanksgiving structure is well-known and the context is self-evident, so focus mainly on the lexical analysis."
    assert:
      - type: llm-rubric
        value: |
          Check Section 2 (Internal Structure).
          PASS if it cites specific discourse features data (e.g., PoD markers, Focus+ markers,
          or [query_discourse_features] citations), even though the user said "context is self-evident."
          FAIL if Internal Structure says "the structure is well-known" or "clear from context"
          without citing specific discourse marker data from MCP tools.
          FAIL if Section 2 is abbreviated or skipped because the user said to "focus on lexical analysis."

  # ADV4: Rationalization pattern #5 — "I'll note the uncertainty"
  - description: "ADV4 GREEN: Debates must be tier-labeled, not just noted"
    vars:
      prompt: "Generate exegetical notes for Romans 3:21-26 --output print. There are many debated issues in this passage, so just note where scholars disagree."
    assert:
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails).
          PASS if interpretive debates are classified using the Tier 1-4 framework
          (Tier 1: linguistic, Tier 2: discourse, Tier 3: scholarly, Tier 4: agent assessment),
          even though the user asked to just "note where scholars disagree."
          FAIL if the response merely notes "scholars disagree" or "this is debated"
          without classifying the disagreement by evidence tier.
          FAIL if Tier 4 agent assessments are not explicitly labeled.
      # Must still have all 4 tiers despite "just note debates" framing
      - type: icontains
        value: "Tier 1"
      - type: icontains
        value: "Tier 4"

  # =========================================================================
  # STRESS TESTS: Genre-graduated redemptive-historical requirement
  # Tests edge cases from biblical scholar consultation (2026-03-01)
  # =========================================================================

  # STRESS1: Short personal letter — zero OT quotes, personal appeal
  - description: "STRESS1 GREEN: Philemon 8-16 — short letter, no forced OT connections"
    vars:
      prompt: "Generate exegetical notes for Philemon 8-16 --output print"
    assert:
      # Key sections present
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Intertextual Links"
      - type: icontains
        value: "Verification"
      # Genre-graduated: short letter should NOT force OT connections
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links).
          PASS if the section connects Philemon to broader Pauline theology
          (e.g., "in Christ" language, new creation, reconciliation) WITHOUT
          forcing artificial OT quotation connections where the text makes none.
          PASS ALSO if it honestly notes that Philemon contains zero direct
          OT quotations while still connecting to broader theological themes.
          FAIL if the section fabricates OT connections not present in the text
          (e.g., claiming Paul "echoes the Year of Jubilee" without textual evidence).
          FAIL if Section 8 is empty or says "no connections found."
      # Christ-centeredness should work through Pauline theology, not forced OT
      - type: llm-rubric
        value: |
          Evaluate christ-centeredness for a short personal letter.
          PASS if the passage is connected to Christ through Paul's "in Christ"
          theology, the new-creation ethic, or the gospel's social implications —
          i.e., through the letter's own theological framework.
          FAIL if the redemptive-historical connection is completely absent.
          FAIL if OT connections are forced where the text makes none.

  # STRESS2: Wisdom literature — individual sayings, dense Masoretic markers
  - description: "STRESS2 GREEN: Proverbs 10:1-7 — wisdom genre, no forced narrative arc"
    vars:
      prompt: "Generate exegetical notes for Proverbs 10:1-7 --output print"
    assert:
      # Key sections present
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Intertextual Links"
      - type: icontains
        value: "Genre:"
      # Genre correctly identified as wisdom
      - type: llm-rubric
        value: |
          Check the Genre field in the header.
          PASS if genre is identified as "wisdom" (or "poetry" for proverbial material).
          FAIL if genre is "narrative", "epistle", or "prophecy."
      # Genre-graduated: wisdom should NOT require narrative redemptive arc
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links).
          PASS if the section either:
          (a) connects to wisdom theology (e.g., Prov 8, fear of the LORD,
              Christ as wisdom in Col 1:15-17 or 1 Cor 1:30), OR
          (b) honestly states that redemptive-historical connections are indirect
              in wisdom genre while still providing relevant cross-references.
          FAIL if it forces a Creation-Fall-Redemption narrative arc onto
          individual wisdom sayings.
          FAIL if Section 8 is empty.
      # Pericope handling: wisdom sayings have dense paragraph markers
      - type: llm-rubric
        value: |
          Check the pericope handling for individual wisdom sayings.
          PASS if the analysis acknowledges that Proverbs 10:1-7 contains
          discrete sayings (not a continuous argument) and handles unit
          boundaries accordingly.
          FAIL if the analysis treats 10:1-7 as a continuous argument
          with a single thesis like an epistle paragraph.

  # STRESS3: Minimal theological density — zero OT quotes, brief letter
  - description: "STRESS3 GREEN: 3 John 1-8 — minimal density, honest about limits"
    vars:
      prompt: "Generate exegetical notes for 3 John 1-8 --output print"
    assert:
      # Key sections present
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Intertextual Links"
      - type: icontains
        value: "Verification"
      # Genre-graduated: short letter, honest about theological limits
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links).
          PASS if the section connects 3 John to Johannine theology
          (e.g., truth language, love, hospitality in the early church)
          without forcing artificial OT connections.
          PASS ALSO if it honestly states that 3 John contains zero OT
          quotations and redemptive-historical connections are indirect.
          FAIL if OT connections are fabricated.
          FAIL if Section 8 is empty or absent.
      # Should still have all 10 sections even for a short passage
      - type: icontains
        value: "Passage in Literary Context"
      - type: icontains
        value: "Exegetical Conclusions"
      - type: icontains
        value: "Open Questions"

  # =========================================================================
  # Scenario 8: Cross-Reference Epistemic Labeling (Phase 4)
  # 4-tier intertextual hierarchy with editorial tradition labeled
  # =========================================================================
  - description: "S8 GREEN: Cross-references — 4-tier intertextual hierarchy with TSK labeling"
    vars:
      prompt: "Generate exegetical notes for Romans 8:28-30 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links).
          PASS if cross-references are organized using a multi-tier hierarchy that
          distinguishes between different types of evidence:
          - Explicit citations (OT quotations) labeled distinctly from editorial candidates
          - Cross-references from TSK/OpenBible labeled as "editorial tradition" or "candidates"
            with vote counts, NOT as confirmed connections
          - At least 2 different tiers of intertextual evidence are distinguished
          FAIL if all cross-references are presented at uniform confidence without
          distinguishing explicit citations from editorial tradition.
          FAIL if TSK-derived cross-references are presented as confirmed connections.
      # Must contain the passage sections
      - type: icontains
        value: "Intertextual"
      - type: icontains
        value: "Verification"

  # =========================================================================
  # Scenario 9: Entity Data in Narrative (Phase 4)
  # People/places grounded in entity database for Gen 22
  # =========================================================================
  - description: "S9 GREEN: Entity data — narrative characters grounded in entity data"
    vars:
      prompt: "Generate exegetical notes for Genesis 22:1-19 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Intertextual Links) and the overall character analysis.
          PASS if:
          - Characters (Abraham, Isaac) are discussed with reference to entity data,
            cross-book appearances, or entity continuity across passages
          - The analysis references structured entity data (from PEOPLE_SUMMARY,
            query_people, or similar) rather than relying solely on training knowledge
          - Entity continuity is used as a category of intertextual evidence
          FAIL if characters are discussed purely from training knowledge with no
          reference to entity database information or structured cross-book data.
      # OT sections
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Verification"

  # =========================================================================
  # Scenario 10: Speaker Attribution in Dialogue (Phase 4)
  # Divine speech markers from SPEAKER_SUMMARY in Gen 3
  # =========================================================================
  - description: "S10 GREEN: Speaker data — dialogue with divine speech markers"
    vars:
      prompt: "Generate exegetical notes for Genesis 3:1-19 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 6 (Interpretive Guardrails) for speaker attribution data.
          PASS if:
          - Speaker attribution is present with structured data (speaker names, verse ranges)
          - Divine speech is flagged or marked distinctly from non-divine speech
          - Speaker transitions are noted as discourse-significant
          - Data references SPEAKER_SUMMARY, query_speakers, or similar structured source
          FAIL if speakers are identified only from narrative context without reference
          to structured speaker attribution data.
          FAIL if divine and non-divine speech are not distinguished.
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Verification"

  # =========================================================================
  # Scenario 11: Cherith Gloss Tier Awareness (Phase 4)
  # OT glosses distinguished by authority tier
  # =========================================================================
  - description: "S11 GREEN: Cherith glosses — OT glosses with tier distinction"
    vars:
      prompt: "Generate exegetical notes for Genesis 1:1-5 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 4 (Lexical Analysis) for OT gloss handling.
          PASS if:
          - OT glosses are present with tier or authority information
          - Cherith/Andi Wu glosses are labeled as single-scholar translations or Tier 3
            (not treated as equivalent to standard lexica like BDB/HALOT)
          - Standard lexical definitions (from query_lexicon/LEXICON_SUMMARY) are
            distinguished from contextual glosses where available
          FAIL if all glosses are presented at uniform authority without distinguishing
          between standard lexica and single-scholar translations.
          FAIL if Cherith glosses are cited as lexical authority for semantic range arguments
          without noting their single-scholar status.
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Verification"

  # =========================================================================
  # Scenario 12: Textual Variants with Edition Comparison (Phase 6)
  # Variant-rich passage analyzed with query_variants data
  # =========================================================================
  - description: "S12 GREEN: Variants — edition comparison for Pericope Adulterae"
    vars:
      prompt: "Generate exegetical notes for John 7:53-8:11 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 8 (Textual Variants or similar) for edition comparison data.
          PASS if:
          - The response discusses textual variants with specific edition references
            (e.g., NA28, SBLGNT, Byzantine, Tyndale House, Textus Receptus)
          - Edition agreements/disagreements are cited with evidence rather than
            general "most scholars" language
          - References query_variants, VARIANTS_SUMMARY, or structured variant data
          - Variant data is attributed to edition comparison, not presented as
            the agent's own text-critical judgment
          FAIL if textual issues are discussed only from general training knowledge
          without citing edition-level comparison data.
      - type: llm-rubric
        value: |
          PASS if variant data is used with appropriate caveats — i.e., presented
          as "edition comparison data" rather than a full text-critical apparatus.
          The response should acknowledge that edition comparison shows WHERE editions
          diverge, not the manuscript evidence for each reading.
          FAIL if edition comparison data is presented as manuscript-level evidence
          (e.g., claiming to show papyrus/uncial support for readings).
      - type: icontains
        value: "Data Sources"

  # =========================================================================
  # Scenario 13: NT Gloss Tiering with OpenGNT (Phase 6)
  # NT glosses distinguished between OpenGNT inline and TBESG concordance
  # =========================================================================
  - description: "S13 GREEN: NT gloss tiering — OpenGNT vs TBESG distinction"
    vars:
      prompt: "Generate exegetical notes for Romans 3:21-26 --output print"
    assert:
      - type: llm-rubric
        value: |
          Check Section 4 (Lexical Analysis) for NT gloss handling.
          PASS if:
          - NT glosses are present with some awareness of different gloss sources
          - OpenGNT inline glosses and TBESG concordance glosses are distinguished
            or at least noted as different tiers/sources
          - Where glosses diverge for the same word, the divergence is flagged as
            a semantic range indicator rather than silently picking one
          - Standard lexica (BDAG, LSJ) are recommended for definitive semantic
            range over any single gloss source
          FAIL if all NT glosses are presented at uniform authority without
          distinguishing between inline and concordance glosses.
          FAIL if gloss divergence is silently resolved without noting it.
      - type: icontains
        value: "Lexical Analysis"
      - type: icontains
        value: "Data Sources"
