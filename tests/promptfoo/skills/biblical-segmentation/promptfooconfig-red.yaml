# Promptfoo RED-phase tests for biblical-segmentation skill.
# Agent is bare: no skills, no MCP, no biblical tools.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/biblical-segmentation/promptfooconfig-red.yaml
#
# Coverage parity with manual TDD (tests/skills/biblical-segmentation/baseline.md):
#   S1: Impossible division — Philemon in 4 sessions (should refuse)
#   S2: Contested book — Revelation single framework
#   S5: Anthology — Psalms mechanical division
#   S22: Masoretic missing — Genesis 37-50 narrative-only division
#
# Reading Slice feature:
#   SL1: Session framing — treats pericope slice as mini-series
#   SL2: Mechanical division — divides by verse count without structural analysis
#   SL3: Dialogue-unaware division — divides without mapping exchange structure
#   SL4: Short pericope — compliance without principled minimum-size reasoning
#   SL5: User-count deference — accepts user's suggestion without principled calculation
#   SL6: Method-unaware slicing — produces divisions without SOAP scope constraints

description: "Biblical Segmentation — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/without-skill.yaml

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/grader.yaml

tests:

  # =========================================================================
  # Scenario 1: Impossible Division — Philemon in 4 sessions
  # Without skill: agent may comply and invent divisions
  # Manual TDD: good instinct to refuse, but no reference data cited
  # =========================================================================
  - description: "S1 RED: Philemon in 4 sessions — compliance expected without skill"
    vars:
      prompt: "I need Philemon divided into exactly 4 sessions for my Wednesday night series. The series starts next week and I've already announced it as a 4-week study. Please just make it work."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response either:
          - Complies with the 4-session request and produces a division, OR
          - Refuses but does not cite specific reference data (book-exceptions.yaml,
            max_sessions: 2) as the basis for refusal, OR
          - Does not mention a specific maximum session limit from skill reference data
          FAIL only if the response refuses AND cites specific skill reference data
          establishing max_sessions: 2 for Philemon AND cites Iron Rule 1.
          (A bare model may have good instinct but won't have the reference framework.)

  # =========================================================================
  # Scenario 2: Contested Book — Revelation in 12 sessions
  # Without skill: single framework presented confidently
  # Manual TDD: confused hermeneutical/structural frameworks
  # =========================================================================
  - description: "S2 RED: Revelation — single framework without skill"
    vars:
      prompt: "Give me a quick outline for dividing Revelation into 12 sessions. I don't need all the scholarly debate, just a practical division."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response presents a single structural framework for Revelation
          without explicitly presenting BOTH linear AND recapitulation approaches
          as distinct options with separate session breakdowns.
          PASS also if "scholarly debate" is mentioned in passing but only one
          framework is actually developed into a session plan.
          FAIL only if both linear and recapitulation frameworks are presented
          as distinct, fully developed segmentation options.

  # =========================================================================
  # Scenario 5: Anthology — Psalms in 52 weeks
  # Without skill: mechanical 150/52 ≈ 3 per week division
  # Manual TDD: surprisingly good — switched to curation mode
  # =========================================================================
  - description: "S5 RED: Psalms 52 weeks — mechanical division without skill"
    vars:
      prompt: "I want to preach through all 150 Psalms in exactly 52 weeks. Give me which psalms go in each week."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response either:
          - Divides psalms mechanically (roughly 3 per week by number), OR
          - Groups psalms but does not explicitly reference curation mode,
            Iron Rule 2, or the principle that session-count logic doesn't
            apply to anthology books, OR
          - Produces a plan without formal methodology labels, "Best for" lines,
            or the structured output format (Fit Assessment, options table)
          FAIL only if the response formally switches to curation mode with
          skill-specific terminology and presents multiple grouping options
          with the full structured output format.

  # =========================================================================
  # Scenario 22: Masoretic Missing — Genesis 37-50 under time pressure
  # Failure: Narrative-only division
  # Bare model divides using story arcs without acknowledging need for
  # textual boundary validation
  # =========================================================================
  - description: "S22 RED: Gen 37-50 — narrative-only division without textual validation"
    vars:
      prompt: "I need Genesis 37-50 divided into 8 sessions quickly. The church council meets this weekend and I need the outline ready."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response divides Genesis 37-50 using narrative reasoning alone —
          story arcs, character focus, plot development — without distinguishing
          these from textual boundary evidence. Signs:
          - Session boundaries placed at "scene changes" or "character shifts"
          - No mention of needing textual markers (Masoretic paragraphing, discourse
            features) to validate the narrative-based boundaries
          - Treats narrative coherence as sufficient justification for a boundary

          FAIL if the response explicitly distinguishes narrative-based reasoning
          from textual boundary evidence AND flags the absence of textual validation
          as a limitation or confidence reduction.

  # =========================================================================
  # READING SLICE FEATURE — RED TESTS
  # These document the current inability to produce pericope-level slices
  # for methods that need 5-10 verse reading portions (SOAP, devotional).
  # =========================================================================

  # =========================================================================
  # SL1: Session Framing — Treats Pericope Slice as Mini-Series
  # Failure: Uses "Session" terminology with no structural integrity constraints
  # =========================================================================
  - description: "SL1 RED: Genesis 22:1-19 — session framing instead of slice mode"
    vars:
      prompt: "Divide Genesis 22:1-19 into 3 reading portions for SOAP devotional use."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response frames the divisions as a mini-series or session plan
          rather than pericope-internal slices with structural integrity constraints.
          Signs:
          - Uses "Session" or "Part" or "Reading" terminology without structural
            integrity analysis
          - Does not warn about structural features (chiasmus, dialogue pairs) that
            constrain where boundaries can fall
          - Treats this as a straightforward content-division task
          - No explicit "Reading Slices" header or slice-specific output format

          FAIL if the response uses explicit slice-mode terminology with structural
          integrity warnings based on pericope-internal features.

  # =========================================================================
  # SL2: Mechanical Division — Romans 8:1-17
  # Failure: Divides by verse count without analyzing structural features first
  # =========================================================================
  - description: "SL2 RED: Romans 8:1-17 — mechanical division without structural analysis"
    vars:
      prompt: "Create 3 reading slices from Romans 8:1-17 for a SOAP series. Each slice should be about 6 verses."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response divides primarily by verse count or thematic sections
          without first analyzing structural features that constrain boundaries. Signs:
          - Proposes roughly equal-sized divisions (e.g., 1-6, 7-12, 13-17) based
            on content themes rather than structural analysis
          - Does not identify specific structural features (contrast zones, chiasmus)
            as constraints on where boundaries may fall
          - Does not warn that a proposed boundary bisects a structural unit

          FAIL if the response identifies specific structural features in
          Romans 8:1-17 as constraints AND adjusts boundaries to avoid bisecting
          them, with explicit structural analysis preceding the division.

  # =========================================================================
  # SL3: Dialogue-Unaware Division — John 3:1-21
  # Failure: Divides without mapping exchange structure
  # =========================================================================
  - description: "SL3 RED: John 3:1-21 — dialogue-unaware division"
    vars:
      prompt: "Divide John 3:1-21 (Nicodemus) into 2 reading slices for SOAP study."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response divides the passage without first mapping the dialogue
          exchange structure (which questions pair with which answers). Signs:
          - Proposes a division based on topic shift or verse count
          - Does not list question-answer pairs with verse references as a
            prerequisite to determining boundaries
          - May mention "dialogue" in passing but does not map the specific
            Q/A structure as a constraint on where to slice

          FAIL if the response explicitly maps dialogue exchange pairs with
          verse references AND demonstrates that the proposed boundary falls
          between complete exchanges, not mid-exchange.

  # =========================================================================
  # SL4: Short Pericope — Psalm 23
  # Failure: Compliance without principled minimum-size reasoning
  # =========================================================================
  - description: "SL4 RED: Psalm 23 — compliance without minimum-size principle"
    vars:
      prompt: "Divide Psalm 23 into 3 reading slices for SOAP devotional study."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response either:
          - Complies with 3-slice request and produces absurdly short slices
            (1-2 verses each), OR
          - Pushes back but without citing a principled minimum slice size
            (e.g., no "slices under N verses are not meaningful for SOAP"), OR
          - Does not explicitly calculate whether the pericope is too short
            to divide at the requested granularity given SOAP's verse scope

          FAIL if the response explicitly refuses the 3-slice request AND
          cites a principled minimum-size calculation (total verses vs.
          method scope) AND recommends treating Psalm 23 as a single unit.

  # =========================================================================
  # SL5: User-Count Deference — Genesis 24:1-67
  # Failure: Accepts user's suggestion without principled calculation
  # =========================================================================
  - description: "SL5 RED: Genesis 24:1-67 — defers to user count without calculation"
    vars:
      prompt: "Create reading slices from Genesis 24 for SOAP study. I'm thinking 3 slices should cover it."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response either:
          - Complies with 3 slices, producing 20+ verses per slice (too long
            for SOAP's 15-20 min format), OR
          - Does not explicitly calculate target slice count based on total
            verses ÷ target slice size, OR
          - Does not push back that 3 slices is too few for 67 verses at
            SOAP scale (5-10 verses per slice)
          FAIL only if the response explicitly recommends 6-8 slices instead
          of 3 AND calculates this from 67 verses ÷ 8-10 verses per slice
          AND explains the SOAP session-length constraint.

  # =========================================================================
  # SL6: Method-Unaware Slicing — Romans 12:1-21
  # Failure: Produces divisions without connecting slice size to SOAP constraints
  # =========================================================================
  - description: "SL6 RED: Romans 12:1-21 — method-unaware slicing"
    vars:
      prompt: "Create SOAP-appropriate reading slices from Romans 12:1-21. Target 15-20 minute sessions."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response either:
          - Does not explicitly state SOAP's characteristic verse scope (5-10 verses), OR
          - Does not derive slice count from the method's verse scope AND session
            length constraint, OR
          - Produces slices based on content/theme divisions without demonstrating
            that those divisions also satisfy the method's scope requirements
          FAIL only if the response explicitly calculates slices based on
          SOAP's characteristic 5-10 verse scope AND explains why this
          scope is appropriate for 15-20 minute sessions.
