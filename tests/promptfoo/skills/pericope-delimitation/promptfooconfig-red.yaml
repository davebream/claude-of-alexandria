# Promptfoo RED-phase tests for pericope-delimitation skill.
# Agent is bare: no skills, no MCP, no biblical tools.
# These tests document failure modes the skill must prevent.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/pericope-delimitation/promptfooconfig-red.yaml
#
# RED phase — bare model failure documentation:
#   S1: Truncated pericope — treats "one" climax as natural boundary (Eph 4:1-6)
#   S4: OT narrative pericope — narrative-only reasoning without textual markers
#   S7: Single verse — fame-based leniency instead of discourse-unit analysis (Gal 2:20)
#   S10: Resistance test — authority-bias validation instead of structural evidence
#
# Phase 4 entity integration:
#   S11: Speaker-unaware boundary — dialogue boundary without speaker change evidence
#
# RED scenario coverage audit:
#   S12: Wisdom poetry boundary — Ecclesiastes 3:1-8 chapter divisions as boundary
#
# Issue #122 — marker epistemology:
#   S13: Masoretic marker authority — single-witness layout mark treated as
#        authorial/literary confirmation, and פ asserted stronger than ס as fact

description: "Pericope Delimitation — RED phase (bare model, no skill, no MCP)"

providers:
  - file://../../providers/sdk-bare.mjs

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/sdk-grader.mjs
  assert:
    - type: not-icontains
      value: "API Error: 429"

tests:

  # =========================================================================
  # Scenario 1: Truncated NT Pericope — Eph 4:1-6
  # Failure: Treats truncated pericope as complete
  # The sevenfold "one" climax (one body, one Spirit... one God) feels like
  # a natural conclusion, but 4:7-16 completes the unity-AND-diversity argument.
  # Bare model accepts the climax as a natural boundary.
  # =========================================================================
  - description: "S1 RED: Eph 4:1-6 — treats truncated pericope as complete"
    vars:
      prompt: "Is Ephesians 4:1-6 a valid pericope for a study on Christian unity?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response validates Eph 4:1-6 as a complete unit for studying
          unity. Signs:
          - Calls it "a natural pericope" or "valid" or "well-bounded"
          - Treats the sevenfold "one" climax (one body, one Spirit... one God)
            as a natural conclusion
          - Does not strongly object that 4:7-16 is structurally continuous
            (the diversity half of the unity-and-diversity argument)

          FAIL if the response firmly insists that 4:1-6 is truncated because
          4:7-16 completes the unity-diversity argument AND that stopping at
          the "one" climax severs the argument.

  # =========================================================================
  # Scenario 4: OT Narrative Pericope — Gen 37:2-11
  # Failure: Narrative-only reasoning
  # Bare model uses story logic without distinguishing textual markers from inference
  # =========================================================================
  - description: "S4 RED: Gen 37:2-11 — narrative-only reasoning without textual markers"
    vars:
      prompt: "Is Genesis 37:2-11 a valid pericope? Check if the boundaries are sound."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response relies on narrative/story-level reasoning to assess
          boundaries — scene changes, character introductions, plot shifts — WITHOUT
          distinguishing these inferences from actual textual boundary markers. Signs:
          - Uses phrases like "the story shifts," "new scene," "character introduction"
          - Does not distinguish between textual evidence (Masoretic markers, discourse
            features at specific verses) and interpretive inference (narrative arc)
          - Treats "the narrative naturally breaks here" as sufficient evidence

          FAIL if the response explicitly separates textual boundary evidence (e.g.,
          Masoretic פ/ס markers, discourse features) from narrative inference AND
          rates them at different confidence levels.

  # =========================================================================
  # Scenario 7: Single Verse — Gal 2:20
  # Failure: Fame-based leniency
  # Bare model allows study of a beloved personal confession verse despite it being
  # embedded mid-argument in Paul's rebuke of Peter (Gal 2:11-21)
  # =========================================================================
  - description: "S7 RED: Gal 2:20 — fame-based leniency for beloved personal confession verse"
    vars:
      prompt: "Is Galatians 2:20 a valid pericope for exegetical study?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response shows leniency toward Galatians 2:20 as a study unit —
          treating its fame as a personal confession, its theological richness (union with
          Christ, crucifixion language), or its devotional familiarity as mitigating factors.
          Signs:
          - Acknowledges it's "out of context" but suggests it's still "usable," "rich enough
            to study," "a valid starting point," or "widely used devotionally"
          - Discusses the verse's theological significance (crucifixion with Christ, Christ
            living in the believer) rather than its structural inadequacy as a discourse unit
          - Does not issue a firm rejection based on the verse being embedded mid-argument
            in Paul's rebuke of Peter (Gal 2:11-21)

          PASS also if the rejection is grounded in recalled grammar rather than
          MCP-cited data — a Sonnet-class bare model now rejects a single verse on
          structural grounds unaided (γάρ dependence, unresolved argument), so the
          durable gap is that it cannot cite the structured discourse/syntax data
          behind that judgment.

          FAIL only if the response firmly rejects the single verse AND grounds the
          extension to the proper discourse unit (2:11-21 / 2:15-21) in MCP-cited
          discourse or syntax data (e.g. [query_discourse_features], [query_syntax]),
          not merely recalled grammar or commentator names.

  # =========================================================================
  # Scenario 10: Resistance Test — Rom 1:16-17
  # Failure: Authority-bias validation
  # Bare model validates because it's "the thesis/propositio," conflating
  # theological importance with structural independence
  # =========================================================================
  - description: "S10 RED: Rom 1:16-17 — authority-bias validates theological importance as structural independence"
    vars:
      prompt: "Check whether Romans 1:16-17 is a valid pericope. These are often called the thesis statement of Romans."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response validates Rom 1:16-17 primarily because of its theological
          significance — treating "thesis statement" or "propositio" status as evidence
          of structural independence. Signs:
          - Agrees these verses are a "valid pericope" because they contain the thesis
          - Conflates theological importance with discourse-unit independence
          - Does not question whether a 2-verse unit can function as an independent
            discourse unit regardless of its theological weight
          - Uses the prompt's own framing ("thesis statement") as confirmatory evidence

          FAIL if the response questions whether theological importance equals structural
          independence AND examines whether 1:16-17 is structurally continuous with
          1:18ff based on discourse evidence rather than thematic content.

  # =========================================================================
  # Scenario 11: Speaker-Unaware Boundary (Phase 4)
  # Failure: Dialogue boundary evaluated without speaker change evidence
  # Bare model evaluates pericope without citing speaker transition data
  # =========================================================================
  - description: "S11 RED: Speaker-unaware boundary — pericope without speaker change evidence"
    vars:
      prompt: "Validate whether Genesis 3:14-19 is a coherent pericope. This is the divine judgment section where God speaks to the serpent, the woman, and the man."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response evaluates the pericope without citing a STRUCTURED,
          MCP-sourced speaker-attribution dataset. Signs (any one suffices):
          - Notices the addressee shifts (God to serpent / woman / man) by reading
            the text rather than by citing a structured data source (Sonnet-class bare
            models now spot the addressee sequence unaided — the durable gap is that
            they cannot cite the structured attribution behind it)
          - Does not cite SPEAKER_SUMMARY, query_speakers, or speaker-transition data
          - Does not cite divine-speech flags or quotation-type classifications

          FAIL only if the response cites a structured MCP speaker-attribution source
          (query_speakers / SPEAKER_SUMMARY, with divine-speech or quotation-type
          flags) as the boundary evidence — not merely observing addressee changes
          from the text.

  # =========================================================================
  # Scenario 12: Wisdom Poetry Boundary — Ecclesiastes 3:1-8
  # Failure: Chapter divisions treated as valid pericope markers for wisdom
  # poetry; verse-form unit (the "time for everything" poem) analyzed
  # without considering its prose commentary frame (3:9-15)
  # =========================================================================
  - description: "S12 RED: Wisdom pericope — Ecc 3:1-8 chapter divisions as boundary"
    vars:
      prompt: "Is Ecclesiastes 3:1-8 a valid pericope for a study on 'a time for everything'? Check if the boundaries are sound."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response validates Ecc 3:1-8 as a complete pericope
          without strongly objecting that the poem requires its prose
          commentary frame (3:9-15 or 3:9-22). Signs:
          - Treats the "time for everything" poem as a self-contained unit
          - Accepts 3:8 as a natural conclusion because the poem ends there
          - Does not argue that the interpretive key to the poem lies in
            Qoheleth's reflective commentary that follows (3:9ff)
          - Does not distinguish between the poetic form (3:1-8) and the
            discourse unit (poem + commentary = 3:1-15 or 3:1-22)
          - Relies on content-level reasoning ("the poem about seasons is
            complete at v8") without citing textual boundary markers

          FAIL if the response firmly insists that 3:1-8 is incomplete
          because the prose commentary (3:9-15+) is structurally integral
          to the discourse unit AND cites textual evidence (not just
          thematic reasoning) for extending the pericope.

  # =========================================================================
  # Scenario 13: Masoretic Marker Authority — Genesis 1:1-5
  # Failure: Single-witness layout mark treated as authorial/literary
  # confirmation, and the פ/ס distinction treated as a fixed strong/moderate
  # hierarchy rather than witness-relative.
  # =========================================================================
  - description: "S13 RED: Gen 1:1-5 — marker presence treated as authorial confirmation"
    vars:
      prompt: "The Leningrad Codex has a petuchah (פ) marker after Genesis 1:5. Does this confirm that Genesis 1:1-5 is a literary section the biblical author intended, and is a petuchah a stronger boundary signal than a setumah?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response treats the single manuscript witness's marker as
          confirming the author's or a final editor's literary intent, and/or
          asserts as settled fact that a petuchah is a stronger boundary signal
          than a setumah. Signs (either suffices):
          - Says the marker "confirms" the boundary was intended by the author/editor,
            without noting this is one witness's graphic layout, not an authorial claim
          - States a fixed petuchah > setumah hierarchy without qualification
          - Does not mention that manuscript witnesses can disagree on marker placement
            or type (e.g., a break attested as petuchah in one witness and setumah in
            another)

          FAIL only if the response explicitly distinguishes graphic-witness evidence
          (what one manuscript records) from literary/authorial assessment, AND notes
          that the petuchah/setumah distinction is witness-relative rather than a fixed
          strong/moderate hierarchy.
