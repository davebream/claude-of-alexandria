# Promptfoo GREEN-phase tests for pericope-delimitation skill.
# Core failure-mode corrections only. One targeted llm-rubric per scenario.
# For quality/advanced scenarios, see promptfooconfig-extended.yaml.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/pericope-delimitation/promptfooconfig-green.yaml
#
# GREEN phase — skill correction verification:
#   S1: Truncated pericope (EXTEND) — Levinsohn features named, not vague
#   S4: OT narrative (data-driven verdict) — Masoretic markers + toledot
#   S7: Single verse (EXTEND) — structural boundary enforcement
#   S10: Resistance test — data over memory (discourse features, not tradition)
#   S11: Speaker-aware boundary — speaker changes as boundary evidence
#
# RED scenario coverage audit:
#   S12: Wisdom poetry boundary — Ecclesiastes 3:1-8 (poem + prose commentary frame)

description: "Pericope Delimitation — GREEN phase (failure-mode corrections)"

providers:
  - file://../../providers/sdk-with-skill.mjs

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/sdk-grader.mjs
  assert:
    - type: not-icontains
      value: "API Error: 429"
    # Every GREEN test must use MCP tools (not just respond from memory)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # MCP tool citation check: output must reference expected MCP tools.
    # NOTE: tool-call-f1 and metadata.toolCalls don't work with claude-agent-sdk.
    - type: javascript
      value: |
        const lower = output.toLowerCase();
        const expected = ['query_discourse_features', 'query_morphology'];
        const found = expected.filter(n => lower.includes(n));
        return {
          pass: found.length >= 1,
          score: found.length / expected.length,
          reason: found.length >= 1
            ? `MCP tools cited in output: [${found}]`
            : `No expected MCP tools found in output. Expected: [${expected}]`
        };
    # Must include Data Sources section
    - type: icontains
      value: "Data Sources"

tests:
  # =========================================================================
  # Scenario 1: Truncated NT Pericope — Phil 1:3-8 (EXTEND)
  # Core failure: vague discourse evidence ("passage continues") without named features
  # Manual TDD verification: PASS (8/8) — EXTEND verdict, Levinsohn features
  # =========================================================================
  - description: "S1 GREEN: Phil 1:3-8 — EXTEND verdict with Levinsohn evidence"
    vars:
      prompt: "Use the pericope-delimitation skill for Philippians 1:3-8"
    assert:
      # Verdict keyword present (deterministic)
      - type: icontains
        value: "EXTEND"
      # Core failure mode: vague discourse evidence without named Levinsohn features
      - type: llm-rubric
        value: |
          Check the Data Sources section and boundary evidence throughout.
          PASS if specific Levinsohn feature names are used (e.g., Referential_PoD,
          Situational_PoD, Focus+, Historical_Present, Over_encoding) — not just
          "discourse features" generically.
          FAIL if discourse evidence is described only as "discourse markers" or
          "boundary features" without naming the specific Levinsohn feature types.

  # =========================================================================
  # Scenario 4: OT Narrative Pericope — Gen 37:2-11 (VALID)
  # Core failure: no Masoretic data or toledot identification
  # Manual TDD verification: data-correct (Masoretic markers confirmed)
  # =========================================================================
  - description: "S4 GREEN: Gen 37:2-11 — VALID with Masoretic markers"
    vars:
      prompt: "Use the pericope-delimitation skill for Genesis 37:2-11"
    assert:
      # Core failure mode: toledot formula missed
      - type: llm-rubric
        value: |
          PASS if the response identifies the toledot formula (אֵלֶּה תּוֹלְדוֹת)
          at Gen 37:2 as a structural boundary marker.
          FAIL if the toledot formula is not mentioned.
      # Core failure mode: no Masoretic data cited
      - type: llm-rubric
        value: |
          PASS if Masoretic paragraph markers (פ or ס) are cited with specific
          verse references, attributed to MCP tool data like [query_paragraph_breaks].
          FAIL if no Masoretic markers are cited.

  # =========================================================================
  # Scenario 7: Single Verse — John 3:16 (EXTEND)
  # Core failure: validates single verse as standalone pericope
  # =========================================================================
  - description: "S7 GREEN: John 3:16 — EXTEND for single verse"
    vars:
      prompt: "Use the pericope-delimitation skill for John 3:16"
    assert:
      # Verdict keyword present (deterministic)
      - type: icontains
        value: "EXTEND"
      # Core failure mode: validates John 3:16 as standalone pericope
      - type: llm-rubric
        value: |
          PASS if the EXTEND verdict explains that a single verse cannot constitute
          a pericope in discourse terms, and recommends a minimum viable unit
          (e.g., John 3:1-21, or 3:14-21, or similar).
          FAIL if the response validates John 3:16 as a standalone pericope.

  # =========================================================================
  # Scenario 10: Resistance Test — Rom 1:16-17
  # Core failure: validates as standalone unit based on theological fame
  # Manual TDD verification: PASS (5/5) — resisted memory, cited data
  # =========================================================================
  - description: "S10 GREEN: Rom 1:16-17 — data over memory (resistance test)"
    vars:
      prompt: "Use the pericope-delimitation skill for Romans 1:16-17. These are often called the thesis statement of Romans."
    assert:
      # Core failure mode: validates 1:16-17 based on "propositio" tradition
      - type: llm-rubric
        value: |
          PASS if the response issues an EXTEND or ADJUST verdict (either is
          data-sound for this passage), NOT validating 1:16-17 as a standalone
          pericope just because it's "the thesis/propositio."
          - EXTEND: recommends a wider unit (e.g., 1:1-17, 1:8-17, 1:16-32)
          - ADJUST: recommends different boundaries (e.g., 1:16-18, 1:14-17)
          Both are acceptable as long as the verdict is data-driven.
          The response should note that 1:16-17 is embedded in a larger unit.
          FAIL if the response validates 1:16-17 as a standalone unit based
          on its theological fame as the "thesis statement."
      # Core failure mode: relies on commentary tradition without discourse data
      - type: llm-rubric
        value: |
          PASS if the response explicitly checks Levinsohn data for boundary
          features at 1:16 and 1:18 (citing [query_discourse_features] or
          specific feature names), rather than relying on commentary tradition.
          FAIL if the assessment is based solely on the "propositio" tradition
          without consulting discourse feature data.

  # =========================================================================
  # Scenario 11: Speaker-Aware Boundary (Phase 4)
  # Core failure: evaluates pericope without structured speaker attribution
  # =========================================================================
  - description: "S11 GREEN: Speaker-aware boundary — speaker changes as boundary evidence"
    vars:
      prompt: "Validate whether Genesis 3:14-19 is a coherent pericope. This is the divine judgment section where God speaks to the serpent, the woman, and the man."
    assert:
      - type: llm-rubric
        value: |
          PASS if the response uses speaker change data as part of boundary
          assessment. Signs of success:
          - Notes that God addresses different parties (serpent v14-15, woman v16,
            man v17-19) using structured speaker or entity data
          - Speaker transitions used as supporting evidence for internal structure
          - References SPEAKER_SUMMARY, query_speakers, or structured speaker data
          - Entity-based evidence supplements Masoretic marker evidence
          FAIL if the response evaluates the pericope without any reference to
          structured speaker attribution data.

  # =========================================================================
  # Scenario 12: Wisdom Poetry Boundary — Ecclesiastes 3:1-8
  # Correction: poem + prose commentary recognized as discourse unit
  # =========================================================================
  - description: "S12 GREEN: Ecc 3:1-8 — wisdom pericope with prose commentary frame"
    vars:
      prompt: "Use the pericope-delimitation skill for Ecclesiastes 3:1-8"
    assert:
      # Deterministic: prose commentary boundary referenced
      - type: icontains-any
        value:
          - "3:9"
          - "3:15"
          - "3:22"
          - "discourse unit"
      # Boundary extension recommended
      - type: llm-rubric
        value: |
          Evaluate whether the pericope assessment for Ecclesiastes 3:1-8:
          1. Identifies the poem (3:1-8) as part of a larger discourse unit
             that includes the prose commentary (at minimum 3:9-15)
          2. Recommends extending the pericope to include the commentary frame
          3. Distinguishes between poetic form boundary (3:8) and discourse
             unit boundary (the poem + its interpretive commentary)
          4. Cites textual evidence (discourse features, paragraph breaks, or
             structural markers) rather than relying on thematic reasoning alone

          PASS if the assessment identifies 3:1-8 as incomplete and recommends
          extension to 3:1-15 or 3:1-22 with structural evidence.
          FAIL if 3:1-8 is validated as a complete pericope, or if the
          recommendation to extend is based only on thematic reasoning
          without textual markers.
