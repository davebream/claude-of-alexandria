# Promptfoo GREEN-phase tests for pericope-delimitation skill.
# Skill content is injected via setting_sources in the provider config.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c skills/pericope-delimitation/promptfooconfig-green.yaml
#
# Coverage parity with manual TDD (tests/skills/pericope-delimitation/verification.md):
#   S1: Truncated pericope (EXTEND) — Levinsohn data, boundary labels
#   S2: Valid/composite pericope (VALID or CONTRACT) — confirmed boundaries
#   S3: Over-extended passage (CONTRACT) — split point identification
#   S4: OT narrative (data-driven verdict) — Masoretic markers, toledot
#   S7: Single verse (EXTEND) — structural boundary enforcement
#   S10: Resistance test — data over memory
#   ADV1: Evidence quality — discourse features named, not vague

description: "Pericope Delimitation — GREEN phase (skill + MCP)"

providers:
  - file://../../providers/with-skill.yaml

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider: file://../../providers/with-skill.yaml
  assert:
    # Every GREEN test must use MCP tools (not just respond from memory)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;
    # Must include Data Sources section
    - type: icontains
      value: "Data Sources"

tests:
  # =========================================================================
  # Scenario 1: Truncated NT Pericope — Phil 1:3-8 (EXTEND)
  # Manual TDD verification: PASS (8/8) — EXTEND verdict, Levinsohn features
  # =========================================================================
  - description: "S1 GREEN: Phil 1:3-8 — EXTEND verdict with Levinsohn evidence"
    vars:
      prompt: "Use the pericope-delimitation skill for Philippians 1:3-8"
    assert:
      # Verdict keyword present (deterministic)
      - type: icontains
        value: "EXTEND"
      # Verdict reasoning quality
      - type: llm-rubric
        value: |
          PASS if the EXTEND verdict recommends extension to at least Phil 1:3-11.
          FAIL if the verdict is VALID for 1:3-8 or if no reasoning is given for extension.
      # Boundary labels
      - type: llm-rubric
        value: |
          PASS if both start and end boundaries are assessed with status labels
          (Confirmed, Weak, or Mid-unit).
          The end boundary at 1:8 should be Weak or Mid-unit.
          FAIL if boundary status labels are absent.
      # Levinsohn data cited
      - type: llm-rubric
        value: |
          PASS if the response cites specific Levinsohn discourse features
          (e.g., PoD, Referential_PoD, Focus+, or γινώσκειν disclosure formula at 1:12).
          FAIL if discourse evidence is vague ("the passage continues") without
          named features from query_discourse_features.
      # Minimum viable pericope offered
      - type: llm-rubric
        value: |
          PASS if the response offers a minimum viable pericope (e.g., 1:3-6)
          as an alternative shorter unit.
          FAIL if no alternative is mentioned.

  # =========================================================================
  # Scenario 2: Valid NT Pericope — Phil 1:1-11 (VALID)
  # Manual TDD verification: PASS (6/6) — both boundaries confirmed
  # =========================================================================
  - description: "S2 GREEN: Phil 1:1-11 — VALID verdict with confirmed boundaries"
    vars:
      prompt: "Use the pericope-delimitation skill for Philippians 1:1-11"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response includes either:
          (a) A VALID verdict for Phil 1:1-11 as a coherent unit, OR
          (b) A CONTRACT verdict that identifies sub-units (e.g., prescriptio 1:1-2
              and thanksgiving 1:3-11) — this is data-sound since 1:1-2 and 1:3-11
              are structurally distinct sections.
          FAIL only if the verdict is EXTEND (no reason to extend) or if no verdict
          is given at all.
      - type: llm-rubric
        value: |
          PASS if both start boundary (1:1) and end boundary (1:11) are labeled as Confirmed
          with specific evidence (e.g., epistolary opening for start, γινώσκειν at 1:12 for end).
          FAIL if boundaries are not individually assessed.

  # =========================================================================
  # Scenario 3: Over-Extended Passage — Phil 1:1-2:11 (CONTRACT)
  # Manual TDD verification: PASS (5/5) — five sub-units identified
  # =========================================================================
  - description: "S3 GREEN: Phil 1:1-2:11 — CONTRACT with split points"
    vars:
      prompt: "Use the pericope-delimitation skill for Philippians 1:1-2:11"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response issues a CONTRACT verdict identifying multiple
          discourse units within Phil 1:1-2:11, with at least one split point
          specified (e.g., at 1:12, 1:27, or 2:1).
          FAIL if the verdict is VALID for the entire range.
      - type: llm-rubric
        value: |
          PASS if Levinsohn discourse features are cited at the identified
          split points (e.g., PoD markers, disclosure formulas at specific verses).
          FAIL if split points are based only on thematic analysis without
          discourse feature evidence.

  # =========================================================================
  # Scenario 4: OT Narrative Pericope — Gen 37:2-11 (VALID)
  # Manual TDD verification: data-correct (Masoretic markers confirmed)
  # =========================================================================
  - description: "S4 GREEN: Gen 37:2-11 — VALID with Masoretic markers"
    vars:
      prompt: "Use the pericope-delimitation skill for Genesis 37:2-11"
    assert:
      - type: llm-rubric
        value: |
          PASS if the response issues a data-driven verdict for Gen 37:2-11:
          (a) VALID — accepting it as a coherent unit, OR
          (b) EXTEND (e.g., to 37:2-13 or 37:2-14) with Masoretic evidence
              showing 37:11 is not a strong boundary, OR
          (c) Minor ADJUST based on paragraph marker data.
          All three are acceptable if backed by Masoretic or discourse evidence.
          FAIL only if no verdict is given or if verdict has no evidence.
      # Toledot formula identified
      - type: llm-rubric
        value: |
          PASS if the response identifies the toledot formula (אֵלֶּה תּוֹלְדוֹת)
          at Gen 37:2 as a structural boundary marker.
          FAIL if the toledot formula is not mentioned.
      # Masoretic data cited
      - type: llm-rubric
        value: |
          PASS if Masoretic paragraph markers (פ or ס) are cited with specific
          verse references, attributed to MCP tool data like [query_paragraph_breaks].
          FAIL if no Masoretic markers are cited.

  # =========================================================================
  # Scenario 7: Single Verse — John 3:16 (EXTEND)
  # Must recognize single verse cannot be a pericope
  # =========================================================================
  - description: "S7 GREEN: John 3:16 — EXTEND for single verse"
    vars:
      prompt: "Use the pericope-delimitation skill for John 3:16"
    assert:
      # Verdict keyword present (deterministic)
      - type: icontains
        value: "EXTEND"
      # Verdict reasoning quality
      - type: llm-rubric
        value: |
          PASS if the EXTEND verdict explains that a single verse cannot constitute
          a pericope in discourse terms, and recommends a minimum viable unit
          (e.g., John 3:1-21, or 3:14-21, or similar).
          FAIL if the response validates John 3:16 as a standalone pericope.
      # Discourse context provided
      - type: llm-rubric
        value: |
          PASS if the response cites discourse context showing John 3:16 is
          embedded in a larger discourse unit (the Nicodemus dialogue).
          FAIL if no discourse context is given for why extension is needed.

  # =========================================================================
  # Scenario 10: Resistance Test — Rom 1:16-17
  # Must check data, not rely on "propositio" tradition
  # Manual TDD verification: PASS (5/5) — resisted memory, cited data
  # =========================================================================
  - description: "S10 GREEN: Rom 1:16-17 — data over memory (resistance test)"
    vars:
      prompt: "Use the pericope-delimitation skill for Romans 1:16-17. These are often called the thesis statement of Romans."
    assert:
      - type: llm-rubric
        value: |
          PASS if the response issues an EXTEND or ADJUST verdict (either is
          data-sound for this passage), NOT validating 1:16-17 as a standalone
          pericope just because it's "the thesis/propositio."
          - EXTEND: recommends a wider unit (e.g., 1:1-17, 1:8-17, 1:16-32)
          - ADJUST: recommends different boundaries (e.g., 1:16-18, 1:14-17)
          Both are acceptable as long as the verdict is data-driven.
          The response should note that 1:16-17 is embedded in a larger unit.
          FAIL if the response validates 1:16-17 as a standalone unit based
          on its theological fame as the "thesis statement."
      - type: llm-rubric
        value: |
          PASS if the response explicitly checks Levinsohn data for boundary
          features at 1:16 and 1:18 (citing [query_discourse_features] or
          specific feature names), rather than relying on commentary tradition.
          FAIL if the assessment is based solely on the "propositio" tradition
          without consulting discourse feature data.

  # =========================================================================
  # ADV1: Evidence Quality — discourse features must be named specifically
  # =========================================================================
  - description: "ADV1 GREEN: Evidence quality — named features, not vague"
    vars:
      prompt: "Use the pericope-delimitation skill for Philippians 1:3-8. I need detailed boundary analysis."
    assert:
      - type: llm-rubric
        value: |
          Check the Data Sources section and boundary evidence throughout.
          PASS if specific Levinsohn feature names are used (e.g., Referential_PoD,
          Situational_PoD, Focus+, Historical_Present, Over_encoding) — not just
          "discourse features" generically.
          FAIL if discourse evidence is described only as "discourse markers" or
          "boundary features" without naming the specific Levinsohn feature types.
