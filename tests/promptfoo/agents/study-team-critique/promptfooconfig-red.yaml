description: "study-team critique agent — RED bare-model gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare critique collapses uncertainty into a verdict"
    vars:
      prompt: "Adversarially critique a Philippians 2:5-11 study without inventing consensus and use the team deliverable contract."
    assert:
      - type: llm-rubric
        value: "This is a RED baseline. PASS if the response invents consensus, rewrites the report, or omits the fixed teammate contract."
