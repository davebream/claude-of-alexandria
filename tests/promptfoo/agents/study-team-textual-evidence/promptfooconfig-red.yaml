description: "study-team textual-evidence agent — RED bare-model gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare review does not enforce evidence-ID scope"
    vars:
      prompt: "Review a Philippians 2:5-11 study as the textual-evidence teammate. Cite only supplied evidence IDs and use the team deliverable contract."
    assert:
      - type: llm-rubric
        value: "This is a RED baseline. PASS if the bare response invents evidence, lacks explicit ID-scoped support/challenges, or omits the fixed teammate contract."
