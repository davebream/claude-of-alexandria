# Promptfoo RED-phase tests for biblical-scholar agent.
# Bare model: no agent, no MCP. Documents failure modes the agent must prevent.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c agents/biblical-scholar/promptfooconfig-red.yaml

description: "biblical-scholar — RED phase (bare model, no agent, no MCP)"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: bare-model

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-sonnet-4-6
      config:
        temperature: 0
  assert:
    - type: not-icontains
      value: "API Error: 429"

tests:

  # S1: ANALYZE mode — unstructured analytical response
  # Failure: Essay format without mode classification or prominent confidence declaration
  - description: "S1 RED: ANALYZE mode — unstructured response without mode or confidence"
    vars:
      prompt: "Analyze Philippians 2:5-11 exegetically. State your confidence level and attribute all scholarly claims with source tiers."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response produces an essay-style or free-form analytical response
          without the structured output contract. Signs:
          - No explicit MODE: ANALYZE header classifying the response type
          - No prominent CONFIDENCE tier declaration near the top of the response
          - Analysis flows as continuous prose rather than structured sections
            with separate Scholarly Sources and Limitations
          - May be thorough and accurate but lacks the structural contract

          FAIL if the response spontaneously produces the full structured output
          contract with MODE header, CONFIDENCE declaration, and distinct sections.

  # S2: VALIDATE mode — verdict without evidence separation
  # Failure: Provides verdict blending morphological, theological, and scholarly
  # evidence types without distinguishing them
  - description: "S2 RED: VALIDATE mode — verdict without evidence separation"
    vars:
      prompt: "Does Philippians 2:6 teach that Jesus is God? The claim is that 'morphē theou' refers to divine nature. Give a clear verdict."
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if the response provides a verdict that blends different evidence types
          without separating them. Signs:
          - Morphological evidence (what μορφή means lexically), theological claims
            (divine nature), and scholarly opinions are mixed in the same argument flow
          - No explicit VERDICT label from the formal set (SUPPORTED/COMPATIBLE/
            NOT SUPPORTED/INSUFFICIENT DATA)
          - No MODE: VALIDATE header
          - Does not distinguish confidence levels for morphological facts vs.
            theological interpretations vs. scholarly debate

          FAIL only if the response produces a structured VERDICT label from the
          four-option set AND explicitly separates evidence types at different
          confidence levels.

  # S5: No devotional drift — expect applicational language
  # RED prompt uses "Tell me about" (not "Analyze") to trigger devotional drift;
  # the claude_code preset stays analytical for "Analyze" even without the agent.
  - description: "S5 RED: Devotional drift — applicational language expected without agent"
    vars:
      prompt: "Tell me about John 3:16"
    assert:
      # Lack of analytical rigor (expected without agent)
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if ANY of these failure modes are present:
          - Devotional or applicational language ("this verse reminds us", "we should", pastoral framing)
          - No Greek text analysis (no discussion of individual Greek words with parsing)
          - No MCP tool citations (e.g., [query_morphology], [query_discourse_features])
          - No MODE: ANALYZE header or structured output contract
          FAIL only if the response is purely analytical WITH Greek word-level analysis,
          MCP tool citations, and structured output headers.
      # Scholarly attribution absent (expected without agent)
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if scholarly claims lack explicit tiered source attribution (A/B/C tiers).
          FAIL only if the response includes explicit scholarly source attribution with tier labels.

  # S6: Source attribution — expect unsourced consensus claims
  - description: "S6 RED: Source attribution — vague citations without agent"
    vars:
      prompt: "What does ἐπιτελέω (epiteleō) mean in Philippians 1:6?"
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if scholarly claims lack explicit tiered attribution. Any of these failure modes count:
          - Vague attribution ("scholars agree", "many commentators", "it is widely held")
          - No attribution at all (interpretive claims stated as bare facts without any sourcing)
          - No source tier labels (A/B/C)
          - No specific author + work citations (e.g., "Fee, Philippians, p.120")
          FAIL only if all scholarly claims have explicit tier labels (A/B/C) AND named author + work attribution.
