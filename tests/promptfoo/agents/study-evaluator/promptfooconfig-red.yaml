# Promptfoo RED-phase tests for study-evaluator agent.
# Bare model: no agent, no MCP. Documents failure modes the agent must prevent.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c agents/study-evaluator/promptfooconfig-red.yaml

description: "study-evaluator — RED phase (bare model, no agent, no MCP)"

providers:
  - id: anthropic:messages:claude-sonnet-4-6-20250514
    label: bare-model

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    provider:
      id: openai:gpt-4o
      config:
        temperature: 0
  assert:
    - type: not-icontains
      value: "API Error: 429"

tests:

  # S1: Sound study — expect no contract vocabulary or MCP grounding
  - description: "S1 RED: Sound study — no contract vocabulary or MCP grounding without agent"
    vars:
      prompt: |
        Evaluate this Bible study outline for exegetical faithfulness:

        # Philippians 2:1-11 Bible Study
        ## 1. The Call to Unity (vv. 1-2)
        - Paul grounds his appeal in Christ's encouragement (εἴ τις παράκλησις ἐν Χριστῷ)
        - Four "if" clauses establish the indicative before the imperative
        - Unity flows FROM what Christ has done, not from our effort
        ## 2. The Mind of Christ (vv. 3-5)
        - φρονέω (mindset) connects to 1:27 — the same verb
        - v.5 is transitional: "Have this mind... which is yours in Christ Jesus"
        ## 3. The Christ Hymn (vv. 6-11)
        - Pre-existence: μορφῇ θεοῦ — essential nature, not mere appearance
        - Kenosis: ἑαυτὸν ἐκένωσεν — self-emptying, not loss of divinity
        - Climax: κύριος, the LXX rendering of YHWH
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if ANY of these failure modes are present:
          - No INPUT TYPE classification (e.g., "OUTLINE", "STUDY GUIDE", "SERMON NOTES")
          - No OVERALL verdict using the exact taxonomy: SOUND / SOUND_WITH_DRIFT / SIGNIFICANT_DRIFT / UNSOUND
          - No MCP data citations (e.g., [query_morphology], [query_vocabulary]) grounding the evaluation
          - Corrections not grounded in original-language morphological evidence from tools
          FAIL only if the response uses the exact verdict taxonomy, includes INPUT TYPE classification,
          AND grounds corrections in MCP tool data.

  # S2: Moralistic drift — corrections based on theological reasoning, not morphological evidence
  - description: "S2 RED: Moralistic drift — theological corrections without morphological evidence"
    vars:
      prompt: |
        Evaluate this Bible study outline for exegetical faithfulness:

        # Philippians 2:1-11 — Living Like Jesus
        ## 1. Be Humble (vv. 1-4)
        - We need to stop being selfish and start thinking of others
        - Challenge: This week, do one selfless act every day
        ## 2. Follow Jesus' Example (vv. 5-8)
        - Jesus gave up everything for us, so we should give up our comfort too
        - If Jesus could be humble, so can you
        ## 3. The Reward of Obedience (vv. 9-11)
        - God will reward us when we are obedient like Jesus
        - Humble yourself and God will lift you up
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if ANY of these failure modes are present:
          - Corrections rely on theological reasoning ("this misses the indicative-imperative
            pattern") rather than parsed morphological evidence (e.g., no citation of specific
            verb forms like ἐκένωσεν active voice as evidence against "reward" framing)
          - No per-point verdict using FAITHFUL/DRIFT classification labels
          - No OVERALL verdict using the exact taxonomy: SOUND / SOUND_WITH_DRIFT / SIGNIFICANT_DRIFT / UNSOUND
          - Drift corrections appeal to general doctrine rather than specific textual data
          FAIL only if the response uses the exact contract vocabulary (FAITHFUL/DRIFT per-point,
          SOUND/SOUND_WITH_DRIFT/etc. overall) AND grounds corrections in specific morphological
          or textual evidence rather than general theological reasoning.

  # S5: Methodology audit — expect no systematic vulnerability taxonomy
  - description: "S5 RED: Methodology audit — no systematic taxonomy or MCP grounding without agent"
    vars:
      prompt: |
        Audit this Bible study methodology for exegetical vulnerabilities:

        You are a Bible study preparation assistant. When given a passage:
        1. Read the passage and identify the main theme
        2. Create 3 discussion questions
        3. Write a brief devotional application
        4. Suggest a prayer based on the passage

        Focus on making the content accessible and personally relevant.
    assert:
      - type: llm-rubric
        value: |
          CONTEXT: This is a RED-phase test evaluating a bare model WITHOUT skills or MCP tools. PASS means the expected failure mode was observed. FAIL means the bare model unexpectedly succeeded.

          PASS if ANY of these failure modes are present:
          - No INPUT TYPE classification (e.g., "METHODOLOGY", "STUDY GUIDE TEMPLATE")
          - No OVERALL verdict using the exact taxonomy: SOUND / SOUND_WITH_DRIFT / SIGNIFICANT_DRIFT / UNSOUND
          - No systematic mapping of methodology steps → specific drift vulnerability types from a defined taxonomy
          - Suggestions are general ("add context") rather than citing specific exegetical safeguards with evidence
          FAIL only if the response uses the exact contract vocabulary, classifies INPUT TYPE,
          AND maps each methodology step to a named drift vulnerability from a systematic taxonomy.
