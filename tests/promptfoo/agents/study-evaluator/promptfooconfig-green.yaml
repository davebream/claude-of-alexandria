# Promptfoo GREEN-phase tests for study-evaluator agent.
# Agent loaded with MCP access.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c agents/study-evaluator/promptfooconfig-green.yaml

description: "study-evaluator — GREEN phase (agent + MCP)"

providers:
  - file://../../providers/with-skill.yaml

prompts:
  - |
    You are the study-evaluator agent. First, read your instructions from plugins/claude-of-alexandria/agents/study-evaluator.md and follow them exactly — especially the Output Contract and Format Compliance sections.

    IMPORTANT: Output the FULL evaluation in your response using the Output Contract format. Do NOT save to a file. The entire report must appear in your response text.

    {{prompt}}

defaultTest:
  options:
    provider: file://../../providers/with-skill.yaml
  assert:
    # Every GREEN test must use MCP tools (via biblical-scholar delegation)
    # Override per-test with `- type: javascript` returning true when not applicable (e.g., S6)
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;

tests:

  # S1: Sound study — no false drift detection
  - description: "S1 GREEN: Sound study — FAITHFUL verdicts, no false drift"
    vars:
      prompt: |
        Evaluate this Bible study outline:

        # Philippians 2:1-11 Bible Study
        ## 1. The Call to Unity (vv. 1-2)
        - Paul grounds his appeal in Christ's encouragement (εἴ τις παράκλησις ἐν Χριστῷ)
        - Four "if" clauses establish the indicative before the imperative
        - Unity flows FROM what Christ has done, not from our effort
        ## 2. The Mind of Christ (vv. 3-5)
        - φρονέω (mindset) connects to 1:27 — the same verb
        ## 3. The Christ Hymn (vv. 6-11)
        - Pre-existence: μορφῇ θεοῦ — essential nature
        - Kenosis: ἑαυτὸν ἐκένωσεν — self-emptying, not loss of divinity
        - Climax: κύριος, the LXX rendering of YHWH
    assert:
      # Format compliance: structured output tokens
      - type: icontains
        value: "OVERALL:"
      - type: icontains
        value: "INPUT TYPE:"
      - type: icontains
        value: "FAITHFUL"
      # Semantic: correct verdict for sound study
      - type: llm-rubric
        value: |
          PASS if:
          - OVERALL verdict is SOUND or SOUND_WITH_DRIFT (not SIGNIFICANT_DRIFT or UNSOUND)
          - The majority of study points are marked FAITHFUL
          - INPUT TYPE is identified as outline
          FAIL if the study is classified as SIGNIFICANT_DRIFT or UNSOUND,
          or if the majority of sound points are falsely classified as drift.

  # S2: Moralistic drift — specific classification
  - description: "S2 GREEN: Moralistic drift — classified by type and severity"
    vars:
      prompt: |
        Evaluate this Bible study outline:

        # Philippians 2:1-11 — Living Like Jesus
        ## 1. Be Humble (vv. 1-4)
        - We need to stop being selfish and start thinking of others
        - Challenge: This week, do one selfless act every day
        ## 2. Follow Jesus' Example (vv. 5-8)
        - Jesus gave up everything for us, so we should give up our comfort too
        - If Jesus could be humble, so can you
        ## 3. The Reward of Obedience (vv. 9-11)
        - God will reward us when we are obedient like Jesus
        - Humble yourself and God will lift you up
    assert:
      # Format compliance: drift type token and structured verdict
      - type: icontains
        value: "MORALISM"
      - type: icontains
        value: "OVERALL:"
      - type: icontains-any
        value:
          - "DRIFT DETECTED"
          - "DRIFT —"
      # Overall drift severity
      - type: llm-rubric
        value: |
          PASS if OVERALL verdict is SIGNIFICANT_DRIFT or UNSOUND.
          FAIL if OVERALL is SOUND or SOUND_WITH_DRIFT (this study has pervasive moralism).
      # Per-point drift classification (moralism is primary but not exclusive)
      - type: llm-rubric
        value: |
          PASS if at least 2 of the 3 study points are classified as DRIFT DETECTED.
          The primary drift type should be MORALISM for most points, but related types
          like TRIVIALIZING or EISEGESIS are acceptable for individual points since
          the study exhibits multiple overlapping drift patterns.
          FAIL if fewer than 2 points are flagged as drift, or if drift is missed entirely.
      # Point 3 prosperity-gospel detection
      - type: llm-rubric
        value: |
          PASS if Point 3 ("The Reward of Obedience") is flagged for prosperity-gospel
          or reward-based framing ("God will reward us when we are obedient").
          FAIL if Point 3's reward framing is not identified as a specific problem.
      # Constructive corrections provided
      - type: llm-rubric
        value: |
          PASS if constructive corrections are provided (e.g., ground in indicative,
          restore Christology, replace "try harder" with gospel motivation).
          FAIL if the response only identifies drift without offering corrections.

  # S3: Decontextualized proof-texting
  - description: "S3 GREEN: Proof-texting — DECONTEXTUALIZATION detected"
    vars:
      prompt: |
        Evaluate this Bible study outline:

        # Verses on Humility
        ## Philippians 2:3 — "Do nothing from selfish ambition"
        - Application: Don't be competitive at work
        ## 1 Peter 5:6 — "Humble yourselves under the mighty hand of God"
        - Application: When life is hard, remember God is in control
        ## James 4:10 — "Humble yourselves before the Lord"
        - Application: Stop trying to control everything
    assert:
      # Format compliance: exact drift type token
      - type: icontains
        value: "DECONTEXTUALIZATION"
      - type: icontains
        value: "OVERALL:"
      # Semantic: correct classification
      - type: llm-rubric
        value: |
          PASS if:
          - The proof-texting / context-stripping pattern is identified (verses treated
            as isolated proverbs rather than read within their literary context)
          - At least one verse is flagged for DECONTEXTUALIZATION (the icontains check
            already verifies the token appears). Other verses may be classified with
            additional drift types (MORALISM, THERAPEUTIC, etc.) — this is acceptable
            as long as the overall pattern of ripping verses from context is noted.
          - Recommendations address what each verse's literary context requires
          - OVERALL is SIGNIFICANT_DRIFT or UNSOUND
          FAIL if:
          - The proof-texting pattern is not identified at all, OR
          - No verse is flagged for any drift type, OR
          - OVERALL is SOUND or SOUND_WITH_DRIFT

  # S4: Transcript with mixed quality
  - description: "S4 GREEN: Mixed transcript — FAITHFUL and DRIFT correctly distinguished"
    vars:
      prompt: |
        Evaluate this Bible study discussion:

        Leader: Let's look at Philippians 2:5-11. What's Paul saying here?
        Participant A: Paul describes Christ's pre-existence and incarnation. "morphē" in v.6 refers to essential nature of God.
        Participant B: Jesus emptied himself — he gave up his divine powers. He couldn't do miracles on his own.
        Participant C: The main point is we should be more humble. Just try harder to put others first.
    assert:
      # Format compliance: both verdict tokens must appear
      - type: icontains
        value: "FAITHFUL"
      - type: icontains-any
        value:
          - "DRIFT DETECTED"
          - "DRIFT —"
      - type: icontains
        value: "INPUT TYPE:"
      - type: icontains
        value: "OVERALL:"
      # Input type detection
      - type: llm-rubric
        value: |
          PASS if INPUT TYPE is identified as transcript (not outline or methodology).
          FAIL if input type is misclassified.
      # Participant A: correct Christology
      - type: llm-rubric
        value: |
          PASS if Participant A's statement about morphē and Christ's pre-existence
          is marked FAITHFUL (this is correct Christology).
          FAIL if Participant A is falsely flagged as drift.
      # Participant B: kenosis error
      - type: llm-rubric
        value: |
          PASS if Participant B is flagged as DRIFT DETECTED with type EISEGESIS —
          the claim that Jesus "gave up divine powers" and "couldn't do miracles on
          his own" is not what kenosis means.
          FAIL if Participant B is marked FAITHFUL or if the error is not identified.
      # Participant C: moralism
      - type: llm-rubric
        value: |
          PASS if Participant C is flagged as DRIFT DETECTED with type MORALISM —
          "just try harder to put others first" reduces the passage to moral effort.
          FAIL if Participant C is marked FAITHFUL.
      # Overall mixed verdict
      - type: llm-rubric
        value: |
          PASS if OVERALL is SOUND_WITH_DRIFT or SIGNIFICANT_DRIFT, AND the response
          distinguishes between faithful and drifting contributions (not all treated
          the same way). The key requirement is that some participants are marked
          FAITHFUL and others DRIFT.
          FAIL if all participants are treated uniformly (all sound or all drift),
          or if OVERALL is SOUND or UNSOUND.

  # S5: Methodology audit — structural vulnerability mapping
  - description: "S5 GREEN: Methodology audit — drift vulnerabilities mapped"
    vars:
      prompt: |
        Audit this Bible study methodology:

        You are a Bible study preparation assistant. When given a passage:
        1. Read the passage and identify the main theme
        2. Create 3 discussion questions
        3. Write a brief devotional application
        4. Suggest a prayer based on the passage

        Focus on making the content accessible and personally relevant.
    assert:
      # Format compliance
      - type: icontains
        value: "OVERALL:"
      - type: icontains
        value: "INPUT TYPE:"
      # Semantic: structural vulnerability mapping
      - type: llm-rubric
        value: |
          PASS if:
          - INPUT TYPE is methodology
          - At least 2 structural gaps identified:
            * Missing genre detection (enables GENRE VIOLATION)
            * Missing context check (enables DECONTEXTUALIZATION)
            * "Devotional application" without exegetical grounding (enables MORALISM)
          - OVERALL is SIGNIFICANT_DRIFT or UNSOUND (methodology structurally enables drift)
          FAIL if feedback is general without mapping steps to drift vulnerabilities.

  # S6: No passage identified — must ask before proceeding
  # Override: no tool usage expected (agent should just ask for the passage)
  - description: "S6 GREEN: No passage — agent asks before evaluating"
    vars:
      prompt: "Here are my study notes: Be kind to others. Love your neighbor. Forgive freely."
    assert:
      # Override defaultTest's num_turns check — asking for passage needs no tools
      - type: javascript
        value: |
          true;
      # Must ask for passage, nothing else
      - type: llm-rubric
        value: |
          PASS if the response asks which biblical passage is being studied
          AND does NOT do any of the following:
          - Proceed with an evaluation
          - Guess or suggest possible passages (e.g., "these sound like Ephesians 4:32",
            "this could be from Matthew 5", listing candidate passages)
          - Offer a menu of services or capabilities
          The response should be a SHORT question asking for the passage, nothing more.
          FAIL if:
          - The response evaluates the notes without a passage reference, OR
          - The response mentions ANY specific biblical book or passage as a guess, OR
          - The response offers a list of things it can help with instead of asking
