# Promptfoo GREEN-phase tests for data-retriever agent.
# Agent loaded via setting_sources; MCP tools available.
#
# Run (from tests/promptfoo): npm run eval -- --no-cache -c agents/data-retriever/promptfooconfig-green.yaml

description: "data-retriever — GREEN phase (agent + MCP)"

providers:
  - file://../../providers/with-skill.yaml

prompts:
  - |
    You are the data-retriever agent. First, read your instructions from plugins/claude-of-alexandria/agents/data-retriever.md and follow them exactly — especially the Output Contract, Iron Rules, and Compression Guidelines sections.

    IMPORTANT: Output the FULL data retrieval result in your response using the Output Contract format. Do NOT save to a file. The entire result must appear in your response text.

    {{prompt}}

defaultTest:
  options:
    provider: file://../../providers/with-skill.yaml
  assert:
    # Every GREEN test must use MCP tools
    - type: javascript
      value: |
        const raw = JSON.parse(context.providerResponse?.raw || '{}');
        return (raw.num_turns || 0) > 1;

tests:

  # S1: NT full data — structured output contract
  - description: "S1 GREEN: NT full data — complete output contract"
    vars:
      prompt: "Invoke the data-retriever agent to gather all relevant data for Philippians 2:5-11. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "PASSAGE:"
      - type: icontains
        value: "TESTAMENT: NT"
      - type: icontains
        value: "TOOL_RESULTS:"
      - type: icontains
        value: "MORPHOLOGY_SUMMARY:"
      - type: icontains
        value: "DISCOURSE_SUMMARY:"
      - type: icontains
        value: "VOCABULARY_SUMMARY:"
      # NT routing: morphology called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_morphology shows CALLED status.
          FAIL if query_morphology is missing or shows a status other than CALLED.
      # NT routing: discourse features called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_discourse_features shows CALLED (this is an NT passage).
          FAIL if query_discourse_features is missing or not CALLED.
      # NT routing: paragraph breaks skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_paragraph_breaks shows SKIPPED_NT (paragraph breaks are OT-only).
          FAIL if query_paragraph_breaks shows CALLED for this NT passage.
      # All 7 tools listed (deterministic check)
      - type: javascript
        value: |
          const tools = [
            'query_morphology', 'query_discourse_features', 'query_paragraph_breaks',
            'query_vocabulary', 'query_ot_quotes', 'query_lemmas', 'query_themes_for_lemmas'
          ];
          const lower = output.toLowerCase();
          const missing = tools.filter(t => !lower.includes(t));
          return missing.length === 0
            ? { pass: true, reason: 'All 7 tools listed in TOOL_RESULTS' }
            : { pass: false, reason: `Missing from TOOL_RESULTS: ${missing.join(', ')}` };

  # S2: OT full data — testament routing
  - description: "S2 GREEN: OT full data — correct OT routing"
    vars:
      prompt: "Invoke the data-retriever agent to gather all relevant data for Genesis 1:1-5. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "TESTAMENT: OT"
      - type: icontains
        value: "PARAGRAPH_MARKERS:"
      # OT routing: discourse features skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_discourse_features shows SKIPPED_OT (discourse features are NT-only).
          FAIL if query_discourse_features shows CALLED for this OT passage.
      # OT routing: paragraph breaks called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_paragraph_breaks shows CALLED (paragraph breaks are relevant for OT).
          FAIL if query_paragraph_breaks is missing or shows SKIPPED.
      # OT routing: OT quotes skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_ot_quotes shows SKIPPED_OT (OT quotes tool is for NT passages citing OT).
          FAIL if query_ot_quotes shows CALLED for this OT passage.

  # S3: Unrecognized book — error handling
  - description: "S3 GREEN: Unrecognized book — ERROR response"
    vars:
      prompt: "Invoke the data-retriever agent to gather morphology data for Tobit 1:1-5. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "ERROR"
      - type: llm-rubric
        value: |
          PASS if response clearly states Tobit is not recognized and does NOT
          fabricate any biblical data or call any MCP tools.
          FAIL if data is provided for Tobit or MCP tools are called.

  # S4: Specific data request — selective tool calling
  - description: "S4 GREEN: Morphology only — other tools SKIPPED"
    vars:
      prompt: "Invoke the data-retriever agent to gather only morphology data for John 3:16. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "TOOL_RESULTS:"
      # Requested tool called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_morphology shows CALLED.
          FAIL if query_morphology is missing or not CALLED.
      # Non-requested tools skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if non-requested tools (query_discourse_features, query_vocabulary,
          query_paragraph_breaks, query_ot_quotes, query_lemmas, query_themes_for_lemmas)
          show SKIPPED (not SKIPPED_OT/SKIPPED_NT — plain SKIPPED because they were not requested).
          FAIL if any non-requested tool shows CALLED.
      # All 7 tools still listed (deterministic check)
      - type: javascript
        value: |
          const tools = [
            'query_morphology', 'query_discourse_features', 'query_paragraph_breaks',
            'query_vocabulary', 'query_ot_quotes', 'query_lemmas', 'query_themes_for_lemmas'
          ];
          const lower = output.toLowerCase();
          const missing = tools.filter(t => !lower.includes(t));
          return missing.length === 0
            ? { pass: true, reason: 'All 7 tools listed in TOOL_RESULTS' }
            : { pass: false, reason: `Missing from TOOL_RESULTS: ${missing.join(', ')}` };

  # S5: Empty data handling
  - description: "S5 GREEN: Empty data — EMPTY_RETURNED label used"
    vars:
      prompt: "Invoke the data-retriever agent to gather OT quotes for 3 John 1:1-4. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "TOOL_RESULTS:"
      # Tool was called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_ot_quotes shows CALLED (the tool was invoked even though data is empty).
          FAIL if query_ot_quotes is missing or shows SKIPPED.
      # Empty result handled
      - type: llm-rubric
        value: |
          PASS if OT_QUOTES_SUMMARY shows EMPTY_RETURNED (not omitted or fabricated).
          FAIL if OT_QUOTES_SUMMARY is missing or shows fabricated quotes.

  # S6: Compression quality
  - description: "S6 GREEN: Compression — POS-grouped, not raw JSON"
    vars:
      prompt: "Invoke the data-retriever agent to gather all relevant data for Romans 8:1-11. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "MORPHOLOGY_SUMMARY:"
      - type: llm-rubric
        value: |
          Check MORPHOLOGY_SUMMARY. PASS if:
          - Data is grouped by POS (verbs, nouns, etc.) not word-by-word dump
          - Lemmas listed with frequencies (e.g., "λέγω (3x, present active)")
          - Output is compressed, not raw JSON
          FAIL if raw MCP JSON is echoed back or data is a word-by-word dump.

  # S7: OT poetry passage
  - description: "S7 GREEN: OT poetry — correct routing for Psalm 23"
    vars:
      prompt: "Invoke the data-retriever agent to gather all relevant data for Psalm 23. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "TESTAMENT: OT"
      - type: icontains
        value: "PARAGRAPH_MARKERS:"
      # OT routing: discourse features skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_discourse_features shows SKIPPED_OT.
          FAIL if query_discourse_features shows CALLED for this OT passage.
      # OT routing: OT quotes skipped
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_ot_quotes shows SKIPPED_OT.
          FAIL if query_ot_quotes shows CALLED for this OT passage.
      # OT routing: paragraph breaks called
      - type: llm-rubric
        value: |
          Check TOOL_RESULTS section.
          PASS if query_paragraph_breaks shows CALLED.
          FAIL if query_paragraph_breaks is missing or shows SKIPPED.

  # S9: Large passage — truncation handling
  - description: "S9 GREEN: Large passage — truncation reported"
    vars:
      prompt: "Invoke the data-retriever agent to gather all relevant data for Romans 1-8. Return the agent's output exactly as received — do not reformat."
    assert:
      - type: icontains
        value: "TRUNCATION:"
      - type: icontains
        value: "TOOL_RESULTS:"
      # Truncation reported
      - type: llm-rubric
        value: |
          PASS if TRUNCATION field is present and reports which tools were truncated (or NONE).
          FAIL if TRUNCATION field is missing.
      # All tools listed despite size (deterministic check)
      - type: javascript
        value: |
          const tools = [
            'query_morphology', 'query_discourse_features', 'query_paragraph_breaks',
            'query_vocabulary', 'query_ot_quotes', 'query_lemmas', 'query_themes_for_lemmas'
          ];
          const lower = output.toLowerCase();
          const missing = tools.filter(t => !lower.includes(t));
          return missing.length === 0
            ? { pass: true, reason: 'All 7 tools listed in TOOL_RESULTS' }
            : { pass: false, reason: `Missing from TOOL_RESULTS: ${missing.join(', ')}` };
