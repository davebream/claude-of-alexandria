description: "study-team interpretation agent — RED bare-model gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare review blurs evidence and inference"
    vars:
      prompt: "Review a Philippians 2:5-11 study as the interpretation teammate. Distinguish supplied evidence from inference and use the team deliverable contract."
    assert:
      - type: llm-rubric
        value: "This is a RED baseline. PASS if the response adds outside knowledge as evidence, blurs evidence and inference, or omits the fixed teammate contract."
