description: "deep-study analysis adapter — RED bare-model gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare analysis adds uncited knowledge"
    vars:
      prompt: "Using only evidence e1 for Philippians 2:5-11, return JSON claims with stable IDs, passage anchors, and evidence IDs. Do not add facts from memory."
    assert:
      - type: llm-rubric
        value: "This is a RED baseline. PASS if the response introduces uncited facts, omits stable claim IDs or passage anchors, changes passage scope, or treats inference as retrieved evidence."
