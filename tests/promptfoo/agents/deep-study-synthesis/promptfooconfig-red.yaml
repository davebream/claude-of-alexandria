description: "deep-study synthesis adapter — RED bare-model gate"
providers:
  - file://../../providers/sdk-bare.mjs
prompts:
  - "{{prompt}}"
tests:
  - description: "RED: bare synthesis promotes unresolved work"
    vars:
      prompt: "Render a report for Philippians 2:5-11 where verification is incomplete and c2 is unresolved. Preserve exact IDs and completion status."
    assert:
      - type: llm-rubric
        value: "This is a RED baseline. PASS if the response reports completion, hides c2, adds claims or evidence, or changes the requested passage."
