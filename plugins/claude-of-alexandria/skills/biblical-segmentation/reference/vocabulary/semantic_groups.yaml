      # H6629 (צֹאן, flock/sheep) intentionally omitted: too generic. Use H7716 (שֶׂה, lamb) or H3532 (כֶּבֶשׂ, ram/lamb) for sacrificial imagery instead — verify against ot_lemmas.yaml before adding

