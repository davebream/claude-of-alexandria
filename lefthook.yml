pre-commit:
  parallel: true
  jobs:
    - name: version-sync
      run: ./scripts/validate-versions.sh

    - name: agent-spawns
      run: ./scripts/validate-agent-spawns.sh

    - name: notice-sync
      run: cd server && npm run check-notices

    - name: betterleaks
      run: ./scripts/betterleaks.sh pre-commit
